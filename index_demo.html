    <div style="background: linear-gradient(135deg, rgba(251,191,36,0.08), transparent); border: 1px solid rgba(251,191,36,0.25); border-radius: 8px; padding: 12px; margin: 12px 0;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
        <div class="label-mono" style="color:#fbbf24;">🎯 ATHLETIC LEAN PHYSIQUE — alignment</div>
        <div style="font-size:11px; color:#fbbf24; font-family:'JetBrains Mono', monospace;">${stars} · ${ep.target_freq || 1}×/wk</div>
      </div>
      <div style="font-size:12px; color:var(--muted); line-height:1.5;">${aestheticHtml}</div>
    </div>
  ` : '';

  const html = `
    <div class="modal-header">
      <div>
        <span style="background:${bpC}30; color:${bpC}; padding:2px 8px; border-radius:6px; font-size:9px; font-family:'JetBrains Mono', monospace; letter-spacing:0.1em;">${ep.body_part}</span>${subBadgeP}
        <h2 style="margin-top:6px;">${ep.name}</h2>
      </div>
      <button class="modal-close" onclick="closeProgressionModal()">×</button>
    </div>
    <div class="modal-stats">All-time max: ${allTimeMax.toFixed(1)} kg · ${matches.length} total sets · ${byDate.size} sessions</div>

    ${alignmentNote}

    <div style="display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap;">
      ${deltaBox('TOP WEIGHT (4wk avg vs prior 4wk)', wRecent, wPrior, ' kg')}
      ${deltaBox('EST. 1RM (4wk avg vs prior 4wk)', oRecent, oPrior, ' kg')}
    </div>

    ${plateauNote}
    ${nextSuggest}

    <div style="margin-top:18px;">
      <div class="label-mono" style="margin-bottom:4px;">TOP SET WEIGHT</div>
      ${weightPts.length >= 2 ? buildLineChart(weightPts, 'kg', bpC, {decimals:1, yFmt: v => v.toFixed(1)+' kg'}) : '<div style="color:var(--muted); padding:14px;">Not enough data (need 2+ sessions)</div>'}
    </div>

    <div style="margin-top:14px;">
      <div class="label-mono" style="margin-bottom:4px;">ESTIMATED 1RM (Epley)</div>
      ${oneRMPts.length >= 2 ? buildLineChart(oneRMPts, 'kg', bpC, {decimals:1, yFmt: v => v.toFixed(1)+' kg'}) : '<div style="color:var(--muted); padding:14px;">Not enough data</div>'}
    </div>

    <div style="margin-top:14px;">
      <div class="label-mono" style="margin-bottom:4px;">SESSION VOLUME</div>
      ${volPts.length >= 2 ? buildLineChart(volPts, 'kg', bpC, {decimals:0, yFmt: v => num(v,0)+' kg'}) : '<div style="color:var(--muted); padding:14px;">Not enough data</div>'}
    </div>

    <div class="modal-footer-note">
      Showing ${finalDates.length} sessions (last ${chartDates.length >= 2 ? '6 months' : 'all time'}). Tap line dots for date details.
    </div>
  `;
  document.getElementById("progression-modal-content").innerHTML = html;
  document.getElementById("progression-modal").classList.add("open");
}

function closeProgressionModal() {
  document.getElementById("progression-modal").classList.remove("open");
}

// === Option B: Body Part Drilldown modal ===
window.showBodyPartDrilldown = function(bp) {
  const today = new Date(); today.setHours(0,0,0,0);
  const weeksAgo = (n) => { const d = new Date(today); d.setDate(d.getDate() - n*7); return d; };
  const cutoff12 = weeksAgo(12);
  const cutoff24 = weeksAgo(24);
  const allLifts = DATA.lifts || [];

  const lifts = allLifts.filter(l => bodyPart(l.exercise || '') === bp);
  const recent = lifts.filter(l => parseDateOnly(dateOnly(l.date)) >= cutoff12);
  const prior = lifts.filter(l => {
    const d = parseDateOnly(dateOnly(l.date));
    return d >= cutoff24 && d < cutoff12;
  });
  const recentVol = recent.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
  const priorVol = prior.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
  const deltaPct = priorVol > 0 ? ((recentVol - priorVol) / priorVol * 100) : 0;
  const sessions = new Set(recent.map(l => dateOnly(l.date))).size;
  const sessionsPerWk = sessions / 12;

  // Per-exercise breakdown with progressive overload metrics
  const byEx = new Map();
  for (const l of recent) {
    const ex = l.exercise || '(unnamed)';
    if (!byEx.has(ex)) byEx.set(ex, []);
    byEx.get(ex).push(l);
  }
  const exStats = [];
  let totalNewPRs = 0;
  for (const [ex, sets] of byEx) {
    sets.sort((a,b) => a.date.localeCompare(b.date));
    const allSets = lifts.filter(l => (l.exercise || '') === ex).sort((a,b) => a.date.localeCompare(b.date));
    let allTimeMax = 0, lastPRdate = null, lastPRreps = 0;
    let recentPRs = 0;
    for (const s of allSets) {
      const w = s.weight || 0;
      if (w > allTimeMax) {
        allTimeMax = w; lastPRdate = dateOnly(s.date); lastPRreps = s.reps || 0;
        if (parseDateOnly(dateOnly(s.date)) >= cutoff12) recentPRs++;
      }
    }
    totalNewPRs += recentPRs;
    // Top set start vs end (12-wk window)
    const recentSets = sets;  // last 12 weeks
    const firstWeekSets = recentSets.filter(l => {
      const d = parseDateOnly(dateOnly(l.date));
      const cutoff10 = new Date(cutoff12); cutoff10.setDate(cutoff10.getDate() + 14);  // first 2 wks of window
      return d < cutoff10;
    });
    const startTopW = firstWeekSets.reduce((m,l) => Math.max(m, l.weight||0), 0);
    const exSessions = new Set(sets.map(l => dateOnly(l.date))).size;
    const topSetW = sets.reduce((m,l) => Math.max(m, l.weight||0), 0);
    const topSetReps = sets.reduce((m,l) => ((l.weight||0) === topSetW) ? Math.max(m, l.reps||0) : m, 0);
    const weightDelta = startTopW > 0 ? topSetW - startTopW : 0;
    const weightDeltaPct = startTopW > 0 ? (weightDelta / startTopW * 100) : 0;
    const daysSincePR = lastPRdate ? Math.floor((today - parseDateOnly(lastPRdate)) / 86400000) : 999;
    // Progression status icon
    let progStatus, progColor;
    if (weightDeltaPct >= 5) { progStatus = '↑'; progColor = '#84cc16'; }
    else if (weightDeltaPct >= 1) { progStatus = '↗'; progColor = '#a3e635'; }
    else if (weightDeltaPct <= -3) { progStatus = '↓'; progColor = '#f43f5e'; }
    else if (daysSincePR > 60) { progStatus = '⏸'; progColor = '#fbbf24'; }
    else { progStatus = '➡'; progColor = 'var(--muted)'; }
    exStats.push({ ex, sessions: exSessions, topSetW, topSetReps, daysSincePR, allTimeMax,
                   startTopW, weightDelta, weightDeltaPct, recentPRs, progStatus, progColor });
  }
  exStats.sort((a, b) => b.sessions - a.sessions);

  // Diagnosis
  const targetSessionsPerWk = (bp === 'CORE') ? 3 : 2.5;  // rough
  const lowFreq = sessionsPerWk < targetSessionsPerWk;
  const stagnant = deltaPct >= -3 && deltaPct <= 3 && recentVol > 0;
  let diag = [];
  if (lowFreq) diag.push(`<strong style="color:#fbbf24;">⚠ Low frequency</strong> (${sessionsPerWk.toFixed(1)}/wk · target ~${targetSessionsPerWk}/wk)`);
  if (stagnant) diag.push(`<strong style="color:#fbbf24;">⏸ Volume plateau</strong> — recent 12wk ≈ prior 12wk`);
  if (deltaPct < -10) diag.push(`<strong style="color:#f43f5e;">↓ Volume regression</strong> (${deltaPct.toFixed(0)}%)`);
  if (deltaPct > 15) diag.push(`<strong style="color:#84cc16;">↑ Strong progression</strong> (+${deltaPct.toFixed(0)}%)`);
  if (diag.length === 0) diag.push(`<strong style="color:var(--muted);">Maintenance</strong> — stable training`);

  const bpC = BP_COLORS[bp] || 'var(--accent)';
  const exRows = exStats.slice(0, 15).map(s => {
    let prTag;
    if (s.daysSincePR <= 14) prTag = `<span style="color:#84cc16;">${s.daysSincePR}d ✨</span>`;
    else if (s.daysSincePR <= 30) prTag = `<span style="color:#a3e635;">${s.daysSincePR}d</span>`;
    else if (s.daysSincePR <= 60) prTag = `<span style="color:var(--muted);">${s.daysSincePR}d</span>`;
    else prTag = `<span style="color:#fbbf24;">${s.daysSincePR}d ⏸</span>`;
    const topSetStr = s.topSetW > 0 ? `${s.topSetW.toFixed(1)}kg` : 'BW';
    const deltaStr = s.startTopW > 0 && s.weightDelta !== 0
      ? `${s.weightDelta > 0 ? '+' : ''}${s.weightDelta.toFixed(1)}kg`
      : (s.startTopW === 0 ? 'new' : '—');
    const deltaColor = s.weightDelta > 0 ? '#84cc16' : (s.weightDelta < 0 ? '#f43f5e' : 'var(--muted)');
    return `<div style="display:grid; grid-template-columns:1.5fr 0.4fr 0.8fr 0.7fr 0.6fr; gap:6px; padding:7px 0; font-size:11px; align-items:center; border-bottom:1px solid var(--border);">
      <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
        <span style="color:${s.progColor}; margin-right:4px;">${s.progStatus}</span>${s.ex}
      </div>
      <div style="font-family:'JetBrains Mono', monospace; text-align:center;">${s.sessions}</div>
      <div style="font-family:'JetBrains Mono', monospace;">${topSetStr}×${s.topSetReps}</div>
      <div style="font-family:'JetBrains Mono', monospace; color:${deltaColor}; font-size:10px;">${deltaStr}</div>
      <div style="font-family:'JetBrains Mono', monospace; text-align:right;">${prTag}</div>
    </div>`;
  }).join('');

  // Progressive overload summary box
  const progressingCount = exStats.filter(s => s.weightDeltaPct >= 1).length;
  const stagnantCount = exStats.filter(s => s.weightDeltaPct < 1 && s.weightDeltaPct > -3 && s.daysSincePR < 60).length;
  const stalledCount = exStats.filter(s => s.daysSincePR >= 60).length;
  const regressingCount = exStats.filter(s => s.weightDeltaPct <= -3).length;
  const overloadSummary = `
    <div style="background:var(--surface-2); border-radius:8px; padding:10px; margin-bottom:14px; font-size:11px; font-family:'JetBrains Mono', monospace;">
      <div class="stat-label" style="margin-bottom:6px;">PROGRESSIVE OVERLOAD STATUS</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
        <div><span style="color:#84cc16;">↑ Progressing:</span> <strong>${progressingCount}</strong></div>
        <div><span style="color:var(--muted);">➡ Maintaining:</span> <strong>${stagnantCount}</strong></div>
        <div><span style="color:#fbbf24;">⏸ Stalled:</span> <strong>${stalledCount}</strong></div>
        <div><span style="color:#f43f5e;">↓ Regressing:</span> <strong>${regressingCount}</strong></div>
      </div>
      <div style="margin-top:6px; color:var(--muted); font-size:10px;">
        New PRs in 12wk: <strong style="color:${totalNewPRs > 0 ? '#84cc16' : '#fbbf24'};">${totalNewPRs}</strong>
        ${totalNewPRs === 0 ? ' ⚠ no overload in this bp' : ''}
      </div>
    </div>`;

  const html = `
    <div class="modal-header">
      <div><span class="bp-chip" style="background:${bpC}30; color:${bpC};">${bp}</span><h2 style="margin-top:6px;">12-week analysis</h2></div>
      <button class="modal-close" onclick="closeBodyPartModal()">×</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 14px;">
      <div style="background:var(--surface-2); padding:8px; border-radius:6px;">
        <div class="stat-label">VOLUME</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:13px;">${num(recentVol, 0)} kg</div>
        <div style="font-size:10px; color:${deltaPct >= 0 ? '#84cc16' : '#f43f5e'};">${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(0)}% vs prior 12wk</div>
      </div>
      <div style="background:var(--surface-2); padding:8px; border-radius:6px;">
        <div class="stat-label">SESSIONS</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:13px;">${sessions}</div>
        <div style="font-size:10px; color:${lowFreq ? '#fbbf24' : 'var(--muted)'};">${sessionsPerWk.toFixed(1)}/wk${lowFreq ? ' ⚠' : ''}</div>
      </div>
    </div>
    <div style="background:rgba(251,191,36,0.06); border:1px solid rgba(251,191,36,0.20); padding:10px; border-radius:8px; margin-bottom:14px; font-size:12px;">
      ${diag.join('<br>')}
    </div>
    ${overloadSummary}
    <div style="display:grid; grid-template-columns:1.5fr 0.4fr 0.8fr 0.7fr 0.6fr; gap:6px; padding:4px 0; font-size:9px; color:var(--muted); font-family:'JetBrains Mono', monospace; letter-spacing:0.08em; border-bottom:1px solid var(--border);">
      <div>EXERCISE</div><div style="text-align:center;">SESS</div><div>TOP SET</div><div>Δ12WK</div><div style="text-align:right;">LAST PR</div>
    </div>
    ${exRows || `<div style="color:var(--muted); padding:14px;">No exercises logged in last 12 weeks</div>`}
  `;
  document.getElementById("bp-modal-content").innerHTML = html;
  document.getElementById("bp-modal").classList.add("open");
};

function closeBodyPartModal() {
  document.getElementById("bp-modal").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLiftModal(); closeProgressionModal(); closeBodyPartModal(); }
  // Left/Right arrow nav between dates when modal open
  if (window._currentModalDate && document.getElementById("lift-modal")?.classList.contains("open")) {
    if (e.key === "ArrowLeft") {
      const prev = findAdjacentLiftDate(window._currentModalDate, -1);
      if (prev) showLiftModal(prev);
    } else if (e.key === "ArrowRight") {
      const next = findAdjacentLiftDate(window._currentModalDate, +1);
      if (next) showLiftModal(next);
    }
  }
});
document.addEventListener("click", e => {
  if (e.target.id === "lift-modal") closeLiftModal();
  if (e.target.id === "progression-modal") closeProgressionModal();
  if (e.target.id === "bp-modal") closeBodyPartModal();
});

// Touch swipe support on modal content for date nav
(function() {
  let startX = null, startY = null;
  document.addEventListener("touchstart", e => {
    const modal = document.getElementById("lift-modal");
    if (!modal || !modal.classList.contains("open")) return;
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (startX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    startX = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;  // not a horizontal swipe
    if (!window._currentModalDate) return;
    if (dx < 0) {
      const next = findAdjacentLiftDate(window._currentModalDate, +1);
      if (next) showLiftModal(next);
    } else {
      const prev = findAdjacentLiftDate(window._currentModalDate, -1);
      if (prev) showLiftModal(prev);
    }
  }, { passive: true });
})();

    ],
    bodyHead: "BODY",
    bodyItems: [

    ],
    mapHead: "MAP",
    mapItems: [

      "8x decimation (1 of every 8 GPS points kept)",

    ],
  };
  const c = LANG === "ko" ? KO : EN;
  const renderItems = items => items.map(i => `<li style="padding-left:14px; text-indent:-14px;">·  ${i}</li>`).join("");

          <span class="label-mono">${c.runHead}</span>

function refresh() {
  const view = document.getElementById("viewSelect").value;
  const range = document.getElementById("rangeSelect").value;
  const [start, end] = computeRange(range);

  // Sync From/To inputs with computed range (unless user is editing custom)
  if (range !== "custom") {
    document.getElementById("customFrom").value = isoDate(start);
    document.getElementById("customTo").value = isoDate(end);
  }

  const customWrap = document.getElementById("customRange");
  customWrap.classList.toggle("disabled", range !== "custom");

  const agg = aggregate(DATA.runs, DATA.lifts, start, end);
  const html = VIEWS[view](agg);
  document.getElementById("content").innerHTML = html;
  document.getElementById("conventions").innerHTML = renderConventions();
  bindTooltips();

  // Auto-scroll "This week" calendar to today's recommended cell
  setTimeout(() => {
    const wrap = document.getElementById("this-week-scroll");
    if (!wrap) return;
    const todayCell = wrap.querySelector('[data-today-cell="1"]');
    if (!todayCell) return;
    const target = todayCell.offsetLeft - (wrap.clientWidth - todayCell.offsetWidth) / 2;
    wrap.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
  }, 50);

  // Toggle scrolled-end class on .hscroll-wrap when inner .hscroll is at right edge
  // (so the right-edge fade gradient disappears and doesn't obscure last cells)
  document.querySelectorAll(".hscroll-wrap").forEach(wrap => {
    const inner = wrap.querySelector(".hscroll");
    if (!inner) return;
    const update = () => {
      const atEnd = inner.scrollLeft + inner.clientWidth >= inner.scrollWidth - 4;
      wrap.classList.toggle("scrolled-end", atEnd);
    };
    inner.addEventListener("scroll", update, { passive: true });
    update();
  });

  // Update URL state
  const params = new URLSearchParams();
  params.set("view", view);
  params.set("range", range);
  if (range === "custom") {
    const f = document.getElementById("customFrom").value;
    const t = document.getElementById("customTo").value;
    if (f) params.set("from", f);
    if (t) params.set("to", t);
  }
  history.replaceState(null, "", "?" + params.toString());
}

function rebuildRangeOptions() {
  const sel = document.getElementById("rangeSelect");
  const cur = sel.value || "all";
  sel.innerHTML = ["all","1y","3m","1m","1w","custom"].map(k =>
    `<option value="${k}">${t(k)}</option>`).join("");
  sel.value = cur;
}

function applyLangToStaticUI() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  rebuildRangeOptions();
  document.documentElement.lang = LANG;
  document.querySelectorAll(".lang-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === LANG));
}

function setLang(lang) {
  LANG = lang;
  localStorage.setItem("dashboardLang", lang);
  applyLangToStaticUI();
  refresh();
}

// === Init ===
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const viewSel = document.getElementById("viewSelect");
  const rangeSel = document.getElementById("rangeSelect");

  // Language: URL > localStorage > default en
  LANG = params.get("lang") || localStorage.getItem("dashboardLang") || "en";

  viewSel.value = params.get("view") || "heatmap";
  rangeSel.value = params.get("range") || "all";
  if (params.get("from")) document.getElementById("customFrom").value = params.get("from");
  if (params.get("to")) document.getElementById("customTo").value = params.get("to");

  applyLangToStaticUI();

  ["change", "input"].forEach(evt => {
    viewSel.addEventListener(evt, refresh);
    rangeSel.addEventListener(evt, refresh);
    document.getElementById("customFrom").addEventListener(evt, () => {
      if (rangeSel.value === "custom") refresh();
    });
    document.getElementById("customTo").addEventListener(evt, () => {
      if (rangeSel.value === "custom") refresh();
    });
  });

  document.querySelectorAll(".lang-btn").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang)));

  refresh();
});

</script>
