    chartHtml = `<div style="margin: 6px 0 12px; color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${periodLabel} 내 세션 없음</div>`;
  }
  const dates = [...new Set(lifts.map(l => dateOnly(l.date)))].sort().slice(-5).reverse();
  let sessionsHtml = '';
  for (const d of dates) {
    const ss = lifts.filter(l => dateOnly(l.date) === d);
    const setsStr = ss.map(s => {
      const wStr = (!s.weight || s.weight === 0) ? 'BW' : `${s.weight}kg`;
      return `${wStr}×${s.reps}`;
    }).join(', ');
    sessionsHtml += `<div style="display:flex; justify-content:space-between; padding:6px 0; font-family:'JetBrains Mono', monospace; font-size:12px; border-bottom:1px solid var(--border);">
      <span style="color:var(--muted);">${d}</span>
      <span>${setsStr}</span>
    </div>`;
  }
  return `<div style="background:var(--surface-2); border-top:1px dashed var(--border); padding:12px 16px;">
    ${chartHtml}
    <div class="label-mono" style="margin: 6px 0 4px;">최근 5 세션</div>
    ${sessionsHtml}
  </div>`;
}

window.togglePRDetailsForRow = function(row) {
  const name = row.dataset.praName;
  const details = row.nextElementSibling;
  if (!details || !details.classList.contains('pra-details')) return;
  const isOpen = details.dataset.open === '1';
  if (isOpen) {
    details.style.maxHeight = '0';
    details.dataset.open = '0';
    row.style.borderColor = 'var(--border)';
  } else {
    if (!details.dataset.loaded) {
      try {
        details.innerHTML = buildPRDetailsHtml(name);
        details.dataset.loaded = '1';
      } catch (e) {
        console.error('PR details build failed:', e);
        details.innerHTML = '<div style="padding:14px; color:var(--muted);">상세 로딩 실패</div>';
      }
    }
    details.style.maxHeight = details.scrollHeight + 'px';
    details.dataset.open = '1';
    row.style.borderColor = BP_COLORS[bodyPart(name)] || 'var(--lift)';
  }
};

function renderPRActivity() {
  const periodDays = window.PR_PERIOD_DAYS || 90;
  const isAllTime = periodDays >= 9999;
  const metric = window.PR_METRIC || 'weight';
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = isAllTime ? new Date(0) : (() => { const c = new Date(today); c.setDate(c.getDate() - periodDays); return c; })();
  const lifts = isAllTime ? (DATA.lifts || []) : (DATA.lifts || []).filter(l => parseDateOnly(dateOnly(l.date)) >= cutoff);
  const exMap = new Map();
  // First pass: collect all sets per exercise + detect BW / time-based
  for (const l of lifts) {
    const ex = l.exercise || '(unnamed)';
    if (!exMap.has(ex)) {
      const bp = bodyPart(ex);
      exMap.set(ex, {name: ex, sets: [], sessions: new Set(), bp, sub: subBodyPart(ex, bp)});
    }
    const e = exMap.get(ex);
    e.sets.push(l);
    e.sessions.add(dateOnly(l.date));
  }
  // Second pass: compute best per current metric
  for (const e of exMap.values()) {
    const setsAll = e.sets;
    const maxW = Math.max(0, ...setsAll.map(s => s.weight || 0));
    const maxDur = Math.max(0, ...setsAll.map(s => s.duration_sec || 0));
    const maxReps = Math.max(0, ...setsAll.map(s => s.reps || 0));
    const isTimeBased = maxW === 0 && maxReps === 0 && maxDur > 0;
    const isBW = maxW === 0 && !isTimeBased;
    e.isTimeBased = isTimeBased;
    e.isBW = isBW;
    e.bestW = 0; e.bestReps = 0; e.bestDur = 0; e.bestDate = '';
    e.bestSetVol = 0; e.bestSessionVol = 0; e.bestSessionSets = 0;

    if (isTimeBased) {
      for (const s of setsAll) {
        const dur = s.duration_sec || 0;
        const d = dateOnly(s.date);
        if (dur > e.bestDur || (dur === e.bestDur && d > e.bestDate)) {
          e.bestDur = dur; e.bestDate = d;
        }
      }
    } else if (metric === 'session_volume') {
      const sessMap = new Map();
      for (const s of setsAll) {
        const d = dateOnly(s.date);
        const v = isBW ? (s.reps || 0) : ((s.weight || 0) * (s.reps || 0));
        if (!sessMap.has(d)) sessMap.set(d, {vol: 0, sets: 0});
        const se = sessMap.get(d);
        se.vol += v; se.sets++;
      }
      for (const [d, se] of sessMap) {
        if (se.vol > e.bestSessionVol || (se.vol === e.bestSessionVol && d > e.bestDate)) {
          e.bestSessionVol = se.vol; e.bestSessionSets = se.sets; e.bestDate = d;
        }
      }
    } else if (metric === 'set_volume') {
      for (const s of setsAll) {
        const w = s.weight || 0, r = s.reps || 0;
        const v = isBW ? r : (w * r);
        const d = dateOnly(s.date);
        if (v > e.bestSetVol || (v === e.bestSetVol && d > e.bestDate)) {
          e.bestSetVol = v; e.bestW = w; e.bestReps = r; e.bestDate = d;
        }
      }
    } else {
      // weight
      for (const s of setsAll) {
        const w = s.weight || 0, r = s.reps || 0;
        const d = dateOnly(s.date);
        const better = w > e.bestW || (w === e.bestW && r > e.bestReps);
        const sameLater = w === e.bestW && r === e.bestReps && d > e.bestDate;
        if (better || sameLater) {
          e.bestW = w; e.bestReps = r; e.bestDate = d;
        }
      }
    }
  }
  const listAll = [...exMap.values()].map(e => ({...e, sets: e.sets.length, sessions: e.sessions.size}))
    .sort((a, b) => b.sets - a.sets);
  const bpFilter = window.PR_BP_FILTER || 'ALL';
  const list = bpFilter === 'ALL' ? listAll : listAll.filter(e => e.bp === bpFilter);
  const cap = bpFilter === 'ALL' ? 20 : 10;
  const visible = window.PR_SHOW_ALL ? list : list.slice(0, cap);

  const periodOpts = [{d:30,l:'30d'},{d:60,l:'60d'},{d:90,l:'90d'},{d:180,l:'6mo'},{d:365,l:'1y'},{d:9999,l:'All time'}];
  const periodChips = periodOpts.map(o => {
    const active = o.d === periodDays;
    return `<button onclick="window.setPRPeriod(${o.d})" style="background:${active?'var(--lift)':'transparent'}; color:${active?'white':'var(--lift)'}; border:1px solid var(--lift); padding:5px 14px; border-radius:999px; font-family:'JetBrains Mono', monospace; font-size:11px; cursor:pointer; font-weight:${active?'600':'400'};">${o.l}</button>`;
  }).join(' ');

  const bpOrder = ['CHEST','BACK','SHOULDERS','ARMS','LEGS','CORE','OTHER'];
  const bpsPresent = new Set(listAll.map(e => e.bp));
  const bpOptsForDropdown = ['ALL', ...bpOrder.filter(bp => bpsPresent.has(bp))];
  const bpDropdown = `<select onchange="window.setPRBPFilter(this.value)" style="background-color:#27272a; color:#fafafa; -webkit-appearance:none; -moz-appearance:none; appearance:none; border:1px solid var(--lift); border-radius:6px; padding:5px 26px 5px 10px; font-family:'JetBrains Mono', monospace; font-size:11px; cursor:pointer; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22 viewBox=%220 0 10 6%22><path d=%22M0 0l5 6 5-6z%22 fill=%22%23FF1A8C%22/></svg>'); background-repeat:no-repeat; background-position:right 8px center;">
    ${bpOptsForDropdown.map(bp => `<option value="${bp}" ${bp === bpFilter ? 'selected' : ''} style="background:#27272a; color:#fafafa;">${bp === 'ALL' ? 'BP: All' : `BP: ${bp}`}</option>`).join('')}
  </select>`;

  const cards = visible.length === 0
    ? `<div class="card"><p style="color:var(--muted)">기간 내 데이터 없음</p></div>`
    : visible.map((e, idx) => {
        const c = BP_COLORS[e.bp] || 'var(--muted)';
        const daysSince = e.bestDate ? Math.floor((today - parseDateOnly(e.bestDate)) / 86400000) : 999;
        const _fmtDur = (sec) => { const m=Math.floor(sec/60), s=sec%60; return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`; };
        let wStr;
        if (e.isTimeBased) {
          wStr = e.bestDur > 0 ? `${_fmtDur(e.bestDur)} hold` : '—';
        } else if (metric === 'session_volume') {
          if (e.bestSessionVol === 0) { wStr = '—'; }
          else if (e.isBW) { wStr = `${e.bestSessionSets} sets · ${_fmtNum(e.bestSessionVol)} reps`; }
          else { wStr = `${e.bestSessionSets} sets · ${_fmtNum(e.bestSessionVol)}kg total`; }
        } else if (metric === 'set_volume') {
          if (e.bestSetVol === 0) { wStr = '—'; }
          else if (e.isBW) { wStr = `BW × ${e.bestReps} reps`; }
          else { wStr = `${_fmtKg(e.bestW)} × ${e.bestReps} = ${_fmtNum(e.bestSetVol)}kg`; }
        } else {
          wStr = e.bestW > 0 ? `${_fmtKg(e.bestW)} × ${e.bestReps}` : (e.bestReps > 0 ? `BW × ${e.bestReps}` : '—');
        }
        const stalled = daysSince >= 60;
        const dateLabel = stalled
          ? `<span style="color:#fbbf24;">⏸ ${e.bestDate} (${daysSince}일 전 — 정체)</span>`
          : `<span style="color:var(--muted);">📅 ${e.bestDate} (${daysSince}일 전)</span>`;
        const stalledBorder = stalled ? 'border-left:3px solid #fbbf24;' : '';
        const subBadge = e.sub
          ? `<span style="background:${subColor(e.bp, e.sub)}20; color:${subColor(e.bp, e.sub)}; padding:1px 6px; border-radius:6px; font-size:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.08em; margin-left:4px;">${e.sub}</span>`
          : '';
        const safeName = e.name.replace(/"/g, '&quot;');
        return `<div>
          <div class="pra-row" data-pra-idx="${idx}" data-pra-name="${safeName}" onclick="window.togglePRDetailsForRow(this)" style="background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; ${stalledBorder} transition: border-color 0.15s; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span style="font-size:15px; font-weight:600;">${e.name}</span>
                <span style="background:${c}30; color:${c}; padding:2px 8px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.1em; white-space:nowrap;">${e.bp}</span>
                ${subBadge}
              </div>
              <span style="color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:10px; white-space:nowrap;">${e.sets} sets · ${e.sessions} sessions</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-family:'JetBrains Mono', monospace; font-size:13px;">
              <span style="color:${c}; font-weight:600; font-size:16px;">${wStr}</span>
              ${dateLabel}
            </div>
          </div>
          <div class="pra-details" data-pra-for-idx="${idx}" style="overflow:hidden; max-height:0; transition:max-height 0.3s ease;"></div>
        </div>`;
      }).join('');

  const showMoreBtn = list.length > cap
    ? `<button onclick="window.togglePRShowAll()" style="background:transparent; color:var(--muted); border:1px dashed var(--border); border-radius:8px; padding:12px; width:100%; text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px; cursor:pointer; margin-top:8px;">
        ${window.PR_SHOW_ALL ? `▲ 상위 ${cap}개만 보기` : `▼ 전체 ${list.length}개 운동 펼치기`}
      </button>`
    : '';

  const periodLabel = isAllTime ? '전체 기간' : periodDays === 365 ? '지난 1년' : periodDays === 180 ? '지난 6개월' : `지난 ${periodDays}일`;
  const filterLabel = bpFilter === 'ALL' ? '' : ` · ${bpFilter}`;
  return `
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 24px 0 10px;">
      <h2 style="margin:0;">💪 PR Activity</h2>
      ${_prMetricDropdownHtml()}
    </div>
    <div style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">${periodChips}</div>
      ${bpDropdown}
    </div>
    <div class="label-mono" style="margin-bottom:10px;">${periodLabel}${filterLabel} · 세트 수 desc · ${visible.length}/${list.length}개 표시</div>
    ${cards}
    ${showMoreBtn}
  `;
}

// === Recent PRs (metric-aware: max weight / single set volume / session volume) ===
function renderRecentPRs(limit) {
  limit = limit || 10;
  const lifts = (DATA.lifts || []);
  if (lifts.length === 0) return '';
  const metric = window.PR_METRIC || 'weight';
  const byEx = new Map();
  for (const l of lifts) {
    const ex = l.exercise || '(unnamed)';
    if (!byEx.has(ex)) byEx.set(ex, []);
    byEx.get(ex).push(l);
  }
  const events = [];
  for (const [ex, sets] of byEx) {
    sets.sort((a, b) => a.date.localeCompare(b.date));
    const maxW = Math.max(...sets.map(s => s.weight || 0));
    const maxReps = Math.max(...sets.map(s => s.reps || 0));
    const maxDur = Math.max(...sets.map(s => s.duration_sec || 0));
    const isTimeBased = maxW === 0 && maxReps === 0 && maxDur > 0;
    const isBW = maxW === 0 && !isTimeBased;

    let getMetric, targetMax, prSet = null, prDate, extra = {};
    if (isTimeBased) {
      getMetric = (s) => (s.duration_sec || 0);
      targetMax = maxDur;
      for (const s of sets) if (getMetric(s) === targetMax) { prSet = s; break; }
      if (!prSet) continue;
      prDate = dateOnly(prSet.date);
    } else if (metric === 'session_volume') {
      // Sum per session
      const sessionMap = new Map(); // date -> {vol, sets, isBW}
      for (const s of sets) {
        const d = dateOnly(s.date);
        const w = s.weight || 0;
        const r = s.reps || 0;
        const v = isBW ? r : (w * r);
        if (!sessionMap.has(d)) sessionMap.set(d, {vol: 0, sets: 0});
        const e = sessionMap.get(d);
        e.vol += v;
        e.sets++;
      }
      let bestDate = '', bestSess = null;
      for (const [d, e] of sessionMap) {
        if (!bestSess || e.vol > bestSess.vol || (e.vol === bestSess.vol && d > bestDate)) {
          bestSess = e; bestDate = d;
        }
      }
      if (!bestSess || bestSess.vol === 0) continue;
      targetMax = bestSess.vol;
      prDate = bestDate;
      extra = {sessionVol: bestSess.vol, sessionSets: bestSess.sets};
      // prev max across earlier sessions
      let prevMax = 0;
      for (const [d, e] of sessionMap) {
        if (d >= prDate) continue;
        if (e.vol > prevMax) prevMax = e.vol;
      }
      events.push({
        exercise: ex, date: prDate,
        weight: 0, reps: 0, duration: 0,
        delta: targetMax - prevMax, isBW, isTimeBased: false, isFirst: prevMax === 0,
        bp: bodyPart(ex), metric, ...extra,
      });
      continue;
    } else if (metric === 'set_volume') {
      getMetric = (s) => isBW ? (s.reps || 0) : ((s.weight || 0) * (s.reps || 0));
      targetMax = Math.max(...sets.map(getMetric));
      if (targetMax === 0) continue;
      for (const s of sets) if (getMetric(s) === targetMax) { prSet = s; break; }
      if (!prSet) continue;
      prDate = dateOnly(prSet.date);
    } else {
      // metric === 'weight' (default)
      getMetric = isBW ? (s) => (s.reps || 0) : (s) => (s.weight || 0);
      targetMax = isBW ? maxReps : maxW;
      if (targetMax === 0) continue;
      for (const s of sets) if (getMetric(s) === targetMax) { prSet = s; break; }
      if (!prSet) continue;
      prDate = dateOnly(prSet.date);
    }

    let prevMax = 0;
    for (const s of sets) {
      if (dateOnly(s.date) >= prDate) continue;
      const m = getMetric(s);
      if (m > prevMax) prevMax = m;
    }
    events.push({
      exercise: ex, date: prDate,
      weight: prSet.weight || 0, reps: prSet.reps || 0,
      duration: prSet.duration_sec || 0,
      delta: targetMax - prevMax, isBW, isTimeBased, isFirst: prevMax === 0,
      bp: bodyPart(ex), metric,
    });
  }
  events.sort((a, b) => b.date.localeCompare(a.date));
  const recent = events.slice(0, limit);
  if (recent.length === 0) return '';

  const today = new Date(); today.setHours(0,0,0,0);
  const agoLabel = (dateStr) => {
    const d = parseDateOnly(dateStr);
    const days = Math.floor((today - d) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    return `${days}d ago`;
  };

  const fmtDur = (sec) => {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
  };
  const rows = recent.map(ev => {
    const c = BP_COLORS[ev.bp] || 'var(--muted)';
    let wStr, unit, deltaValStr;
    if (ev.isTimeBased) {
      wStr = `${fmtDur(ev.duration)} hold`;
      unit = 's';
      deltaValStr = `${ev.delta % 1 === 0 ? ev.delta.toFixed(0) : ev.delta.toFixed(1)}${unit}`;
    } else if (ev.metric === 'session_volume') {
      if (ev.isBW) {
        wStr = `${ev.sessionSets} sets · ${_fmtNum(ev.sessionVol)} reps`;
        deltaValStr = `${_fmtNum(ev.delta)} reps`;
      } else {
        wStr = `${ev.sessionSets} sets · ${_fmtNum(ev.sessionVol)}kg total`;
        deltaValStr = `${_fmtNum(ev.delta)}kg`;
      }
    } else if (ev.metric === 'set_volume') {
      if (ev.isBW) {
        wStr = `BW × ${ev.reps} reps`;
        deltaValStr = `${_fmtNum(ev.delta)} reps`;
      } else {
        const setVol = (ev.weight || 0) * (ev.reps || 0);
        wStr = `${_fmtKg(ev.weight)} × ${ev.reps} = ${_fmtNum(setVol)}kg`;
        deltaValStr = `${_fmtNum(ev.delta)}kg`;
      }
    } else {
      // weight mode
      wStr = ev.weight > 0 ? `${_fmtKg(ev.weight)} × ${ev.reps}` : `BW × ${ev.reps}`;
      unit = ev.isBW ? ' reps' : 'kg';
      deltaValStr = `${ev.delta % 1 === 0 ? ev.delta.toFixed(0) : ev.delta.toFixed(1)}${unit}`;
    }
    const dateLabel = ev.date.slice(5);
    const deltaText = ev.isFirst
      ? `<span style="color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:10px;">new</span>`
      : `<span style="color:#84cc16; font-family:'JetBrains Mono', monospace; font-size:10px;">↑ +${deltaValStr}</span>`;
    return `<div style="display:flex; align-items:center; gap:14px; padding:10px 12px; border-bottom:1px solid var(--border);">
      <div style="font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); min-width:80px;">
        <b style="color:var(--text); font-weight:500;">${agoLabel(ev.date)}</b><br>${dateLabel}
      </div>
      <div style="flex:1; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;">
        <span>${ev.exercise}</span>
        <span style="background:${c}30; color:${c}; padding:2px 8px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.1em; white-space:nowrap;">${ev.bp}</span>
      </div>
      <div style="font-family:'JetBrains Mono', monospace; color:var(--lift); font-weight:600; font-size:14px; min-width:150px; text-align:right;">${wStr}</div>
      <div style="min-width:80px; text-align:right;">${deltaText}</div>
    </div>`;
  }).join('');

  return `
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 0 0 10px;">
      <h2 style="margin-top:0;">🔥 RECENT PRs (TOP ${limit})</h2>
      ${_prMetricDropdownHtml()}
    </div>
    <div class="card" style="padding: 4px 0; margin-bottom:16px;">
      ${rows}
    </div>
  `;
}

// === View: PR (v3) ===
function renderPR(agg) {
  const allLifts = (DATA.lifts || []).filter(l => inRange(l.date, agg.rangeStart, agg.rangeEnd));
  const sortMetric = window.PR_SORT_METRIC || 'weight';

  // Aggregate per exercise
  const exStats = new Map();
  for (const l of allLifts) {
    const ex = l.exercise || "(unnamed)";
    if (!exStats.has(ex)) {
      const bp = bodyPart(ex);
      exStats.set(ex, {sets:0, volume:0, maxWeight:0, maxSetVol:0, maxDate:"", maxSetVolDate:"", sessions:new Set(), bp, sub:subBodyPart(ex, bp)});
    }
    const e = exStats.get(ex);
    e.sets++;
    const sv = (l.weight||0) * (l.reps||0);
    e.volume += sv;
    if (sv > e.maxSetVol) { e.maxSetVol = sv; e.maxSetVolDate = dateOnly(l.date); }
    if ((l.weight||0) > e.maxWeight) { e.maxWeight = l.weight||0; e.maxDate = dateOnly(l.date); }
    e.sessions.add(dateOnly(l.date));
  }
  for (const [name, info] of exStats) {
    info.sessions = info.sessions.size;
    info.bigKey = findBigMatch(name, BIG7_PATTERNS);
    info.isBig3 = ["SQUAT","BENCH","DEADLIFT"].includes(info.bigKey);
    info.isBig7 = !!info.bigKey;
  }

  // Big 7 PRs (max across all matching exercise variants — within selected period)
  const big7Order = ["SQUAT","BENCH","DEADLIFT","OHP","BB ROW","PULL-UP","DIP"];
  const big7PRs = {};
  for (const k of big7Order) big7PRs[k] = {weight:0, vol:0, total:0, date:"", name:"", prevWeight:0, prevDate:""};
  for (const [name, info] of exStats) {
    if (!info.bigKey) continue;
    const k = info.bigKey;
    if (info.maxWeight > big7PRs[k].weight) {
      big7PRs[k].weight = info.maxWeight;
      big7PRs[k].vol = info.maxSetVol;
      big7PRs[k].total = info.volume;
      big7PRs[k].date = info.maxDate;
      big7PRs[k].name = name;
    }
  }
  // For each Big 7 key, find best weight in DATA.lifts BEFORE current period start (for change indicator)
  const periodStartIso = isoDate(agg.rangeStart);
  for (const l of (DATA.lifts || [])) {
    const k = findBigMatch(l.exercise || "", BIG7_PATTERNS);
    if (!k) continue;
    const d = dateOnly(l.date);
    if (d >= periodStartIso) continue;  // only "before" period
    const w = l.weight || 0;
    if (w > big7PRs[k].prevWeight) {
      big7PRs[k].prevWeight = w;
      big7PRs[k].prevDate = d;
    }
  }
  const big3Total = ["SQUAT","BENCH","DEADLIFT"].reduce((s, k) => s + big7PRs[k].weight, 0);

  // Latest body weight for BW ratio
  let bodyWeight = 0;
  if (DATA.body && DATA.body.weight && DATA.body.weight.length > 0) {
    const sorted = [...DATA.body.weight].sort((a,b) => a.date.localeCompare(b.date));
    bodyWeight = sorted[sorted.length - 1].value;
  }
  const bwRatio = bodyWeight > 0 && big3Total > 0 ? big3Total / bodyWeight : 0;

  // Helper to build a PR row
  function prRowHtml(label, p) {
    if (!p.weight || p.weight <= 0) {
      return `<div style="display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--border);">
        <div><div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:11px; letter-spacing:0.05em;">${label}</div></div>
        <div style="text-align:right;"><div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13px;">— no data</div></div>
      </div>`;
    }
    let changeHtml = "";
    if (p.prevWeight === 0) {
      changeHtml = `<div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px;">first record</div>`;
    } else {
      const diff = p.weight - p.prevWeight;
      const prevMonth = p.prevDate ? new Date(p.prevDate + "T00:00:00") : null;
      const prevLabel = prevMonth ? MONTH_NAMES[prevMonth.getMonth()] + " " + String(prevMonth.getFullYear()).slice(2) : "";
      if (Math.abs(diff) < 0.05) {
        changeHtml = `<div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px;">= unchanged</div>`;
      } else if (diff > 0) {
        changeHtml = `<div style="font-family:'JetBrains Mono', monospace; color:#84cc16; font-size:10px;">↑ +${diff.toFixed(1)}kg vs ${prevLabel}</div>`;
      } else {
        changeHtml = `<div style="font-family:'JetBrains Mono', monospace; color:#f43f5e; font-size:10px;">↓ ${diff.toFixed(1)}kg vs ${prevLabel}</div>`;
      }
    }
    return `<div style="display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--border);">
      <div>
        <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:11px; letter-spacing:0.05em;">${label}</div>
        <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px;">${p.date || ''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:'JetBrains Mono', monospace; color:var(--text); font-size:14px;">${p.weight.toFixed(1)} kg</div>
        ${changeHtml}
      </div>
    </div>`;
  }

  const big3Html = ["SQUAT","BENCH","DEADLIFT"].map(k => prRowHtml(k, big7PRs[k])).join("");
  const big7RestHtml = ["OHP","BB ROW","PULL-UP","DIP"].map(k => prRowHtml(k, big7PRs[k])).join("");

  // Body part summary
  const bpSummary = {};
  for (const bp of ["CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"]) bpSummary[bp] = {sessions:new Set(), sets:0, volume:0, exercises:0};
  for (const [, info] of exStats) {
    const s = bpSummary[info.bp];
    s.exercises++; s.sets += info.sets; s.volume += info.volume;
  }
  for (const l of allLifts) bpSummary[bodyPart(l.exercise || "")].sessions.add(dateOnly(l.date));
  for (const bp of Object.values(bpSummary)) bp.sessions = bp.sessions.size;
  const bpOrder = ["CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"];
  const visibleBps = bpOrder.filter(bp => bpSummary[bp].sets > 0);
  // Build sub-level breakdown per primary
  const subBreakdown = {};  // bp → {sub → sets}
  for (const [, info] of exStats) {
    if (!info.sub) continue;
    if (!subBreakdown[info.bp]) subBreakdown[info.bp] = {};
    subBreakdown[info.bp][info.sub] = (subBreakdown[info.bp][info.sub] || 0) + info.sets;
  }
  const bpCards = visibleBps.map(bp => {
    const s = bpSummary[bp];
    const c = BP_COLORS[bp];
    // Mini sub-bar
    let subBar = "";
    const subData = subBreakdown[bp];
    if (subData) {
      const subTotal = Object.values(subData).reduce((a, b) => a + b, 0);
      const segs = Object.entries(subData).sort((a, b) => b[1] - a[1]).map(([sub, cnt]) => {
        const sc = SUB_COLORS[bp + "/" + sub] || c;
        const pct = subTotal > 0 ? (cnt / subTotal * 100) : 0;
        return `<div title="${sub}: ${cnt} sets" style="flex:${cnt}; background:${sc}; height:6px; min-width:2px;"></div>`;
      }).join("");
      const labels = Object.entries(subData).sort((a, b) => b[1] - a[1]).map(([sub, cnt]) => {
        const sc = SUB_COLORS[bp + "/" + sub] || c;
        return `<span style="color:${sc}; font-size:9px; font-family:'JetBrains Mono', monospace;">${sub} ${cnt}</span>`;
      }).join(" · ");
      subBar = `<div style="display:flex; gap:1px; margin-top:8px; border-radius:2px; overflow:hidden;">${segs}</div>
                <div style="margin-top:4px; line-height:1.5;">${labels}</div>`;
    }
    return `<div class="card bp-summary-card" style="margin:0; cursor:pointer; border-color:${c}40;" onclick="setBpFilter('${bp}')">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="label-mono" style="color:${c}; margin:0;">${bp}</span>
        <span style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${s.exercises} ex</span>
      </div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:500; color:var(--text);">${s.sessions} sessions</div>
      <div style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${s.sets} sets · ${num(s.volume, 0)} kg</div>
      ${subBar}
    </div>`;
  }).join("");

  // Chips: ALL / BIG3 / BIG7 / body parts (primary row)
  const chipsHtml = ["ALL","BIG3","BIG7", ...visibleBps].map(bp => {
    let c, label;
    if (bp === "ALL") { c = "var(--text)"; label = "ALL"; }
    else if (bp === "BIG3") { c = "var(--gold)"; label = "🏆 BIG 3"; }
    else if (bp === "BIG7") { c = "var(--silver)"; label = "⭐ BIG 7"; }
    else { c = BP_COLORS[bp]; label = bp; }
    return `<button class="bp-chip${bp === 'ALL' ? ' active' : ''}" data-bp="${bp}" onclick="setBpFilter('${bp}')" style="--c: ${c};">${label}</button>`;
  }).join("");

  // Sub chips per primary (hidden by default, shown when primary clicked)
  const subOrder = {
    SHOULDERS: ["LATERAL","FRONT","REAR"],
    BACK: ["WIDTH","THICKNESS","LOWER"],
    CHEST: ["UPPER","MID","LOWER"],
    LEGS: ["GLUTES","HAMS","QUADS","CALVES"],
    ARMS: ["BICEPS","TRICEPS","FOREARM"],
  };
  // Count exercises per sub
  const subCounts = {};
  for (const [, info] of exStats) {
    if (!info.sub) continue;
    const k = info.bp + "/" + info.sub;
    subCounts[k] = (subCounts[k] || 0) + 1;
  }
  const subChipRowsHtml = visibleBps.filter(bp => subOrder[bp]).map(bp => {
    const subs = subOrder[bp].filter(s => subCounts[bp + "/" + s] > 0);
    if (subs.length === 0) return "";
    const inner = subs.map(s => {
      const key = bp + "/" + s;
      const c = SUB_COLORS[key] || BP_COLORS[bp];
      const cnt = subCounts[key] || 0;
      return `<button class="bp-chip sub-chip" data-bp="${key}" onclick="setBpFilter('${key}')" style="--c: ${c};">${s} (${cnt})</button>`;
    }).join("");
    return `<div class="sub-chip-row bp-chips" data-parent="${bp}" style="display:none; gap:6px; margin-top:8px; padding-left:8px; border-left:2px solid ${BP_COLORS[bp]}40;">${inner}</div>`;
  }).join("");

  // Sort
  const exList = [...exStats.entries()].sort((a, b) => {
    if (sortMetric === 'weight') return b[1].maxWeight - a[1].maxWeight;
    if (sortMetric === 'volume') return b[1].maxSetVol - a[1].maxSetVol;
    if (sortMetric === 'totalVolume') return b[1].volume - a[1].volume;
    return b[1].sets - a[1].sets;
  });

  const exCards = exList.length === 0
    ? `<div class="card"><p style="color:var(--muted)">${t("noPrData")}</p></div>`
    : exList.map(([name, info]) => {
        const c = BP_COLORS[info.bp];
        let primaryStr;
        if (sortMetric === 'weight') primaryStr = info.maxWeight > 0 ? `${info.maxWeight.toFixed(1)} kg` : "BW";
        else if (sortMetric === 'volume') primaryStr = `${num(info.maxSetVol, 0)} kg`;
        else if (sortMetric === 'totalVolume') primaryStr = `${num(info.volume, 0)} kg`;
        else primaryStr = `${info.sets} sets`;
        const safeName = name.replace(/'/g, "\\'");
        const bigCls = info.isBig3 ? " big3" : (info.isBig7 ? " big7" : "");
        const bigBadge = info.isBig3 ? "🏆" : (info.isBig7 ? "⭐" : "");
        const subBadge = info.sub
          ? `<span style="background:${subColor(info.bp, info.sub)}20; color:${subColor(info.bp, info.sub)}; padding:1px 6px; border-radius:6px; font-size:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.08em; white-space:nowrap; margin-left:4px;">${info.sub}</span>`
          : '';
        return `<div class="card pr-card${bigCls}" style="margin:0; cursor:pointer;" data-bp="${info.bp}" data-sub="${info.sub || ''}" data-isbig3="${info.isBig3}" data-isbig7="${info.isBig7}" onclick="showExerciseModal('${safeName}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <h3 style="flex:1; margin:0;">${name}${bigBadge ? ' <span style="font-size:13px; margin-left:4px;">' + bigBadge + '</span>' : ''}</h3>
            <div style="display:flex; flex-wrap:wrap; gap:2px; justify-content:flex-end;">
              <span style="background:${c}30; color:${c}; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-family:'JetBrains Mono', monospace; letter-spacing: 0.1em; white-space: nowrap;">${info.bp}</span>
              ${subBadge}
            </div>
          </div>
          <div class="stat-big" style="font-size:22px; margin-top:6px;">${primaryStr}</div>
          <div class="stat-label">${info.sets} sets · ${info.sessions} sessions · ${num(info.volume, 0)} kg vol</div>
        </div>`;
      }).join("");

  // === Options A, C, D: enhanced PR sections (with safety) ===
  const todayPR = new Date(); todayPR.setHours(0,0,0,0);
  const prioritiesPR = (DATA.exercise_priorities || {}).exercises || [];
  const stalledThreshold = window.STALLED_THRESHOLD || 60;  // adjustable
  const bpProgressWeeks = window.BP_PROGRESS_WEEKS || 12;  // adjustable
  let bpProgressPR = {}, stalledPR = [], prTimelinesPR = [];
  try { bpProgressPR = computeBodyPartProgress(DATA.lifts || [], todayPR, bpProgressWeeks); }
  catch (e) { console.error('[renderPR] bpProgress failed:', e); }
  try { stalledPR = findStalledPRs(DATA.lifts || [], prioritiesPR, todayPR, stalledThreshold); }
  catch (e) { console.error('[renderPR] stalled failed:', e); }
  try {
    prTimelinesPR = prioritiesPR
      .filter(ep => (ep.priority || 0) >= 4)
      .map(ep => buildPRTimeline(DATA.lifts || [], ep, todayPR))
      .filter(t => t && t.events && t.events.length >= 2)
      .sort((a, b) => (a.stalled !== b.stalled) ? (a.stalled ? -1 : 1) : b.events.length - a.events.length);
  } catch (e) { console.error('[renderPR] timelines failed:', e); }

  // Option A: Body Part Progress Grid
  const bpProgressHtmlPR = (() => {
    const cards = ['SHOULDERS','BACK','CHEST','ARMS','LEGS','CORE'].map(bp => {
      const s = bpProgressPR[bp];
      if (!s) return '';
      const c = BP_COLORS[bp] || 'var(--muted)';
      const deltaPct = s.deltaPct;
      let deltaIcon = '➡', deltaColor = 'var(--muted)';
      let deltaLabel = `${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(0)}%`;
      if (deltaPct >= 10) { deltaIcon = '↑'; deltaColor = '#84cc16'; }
      else if (deltaPct >= 3) { deltaIcon = '↗'; deltaColor = '#84cc16'; }
      else if (deltaPct <= -5) { deltaIcon = '↓'; deltaColor = '#f43f5e'; }
      else if (Math.abs(deltaPct) < 3 && s.recentVol > 0) { deltaIcon = '⏸'; deltaColor = '#fbbf24'; deltaLabel = 'flat'; }
      const maxSpark = Math.max(...s.sparkline, 1);
      const sparkBars = s.sparkline.map(v => `<span style="height:${Math.max(2, (v / maxSpark) * 14).toFixed(0)}px"></span>`).join('');
      const sessionWarn = s.sessionsPerWk < 1.5 && s.recentVol > 0 ? ' ⚠' : '';
      const warnBorder = (deltaPct < -3 || (s.recentPRs === 0 && s.sessionsPerWk >= 1)) ? 'border-color: rgba(244,63,94,0.35);' : '';
      return `<div class="bp-progress-card" style="${warnBorder}" onclick="window.showBodyPartDrilldown('${bp}')">
        <div class="bp-name" style="color:${c};">${bp}</div>
        <div class="bp-trend" style="color:${deltaColor};">${deltaIcon} ${deltaLabel}
          <span class="sparkline" style="color:${deltaColor}; margin-left:4px;">${sparkBars}</span>
        </div>
        <div class="bp-meta">${s.recentPRs} PR${s.recentPRs !== 1 ? 's' : ''} · ${s.sessionsPerWk.toFixed(1)}/wk${sessionWarn}</div>
      </div>`;
    }).join('');
    const weeksOpts = [4, 8, 12, 24, 52];
    const weeksBtns = weeksOpts.map(w => {
      const active = w === bpProgressWeeks;
      const label = w === 52 ? '1y' : `${w}w`;
      return `<button onclick="window.BP_PROGRESS_WEEKS=${w}; refresh();" style="background:${active ? 'var(--accent)' : 'transparent'}; color:${active ? '#fff' : 'var(--accent)'}; border:1px solid var(--accent); padding:3px 10px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:10px; cursor:pointer; font-weight:${active ? '600' : '400'};">${label}</button>`;
    }).join(' ');
    const periodLabel = bpProgressWeeks === 52 ? 'last 1 year' : `last ${bpProgressWeeks} weeks`;
    return `<div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
        <div class="label-mono">📊 BODY PART PROGRESS — ${periodLabel}</div>
        <div style="display:flex; gap:4px;">${weeksBtns}</div>
      </div>
      <div class="bp-progress-grid">${cards}</div>
      <div style="color:var(--muted); font-size:10px; margin-top:8px; font-family:'JetBrains Mono', monospace;">Tap a card → drilldown</div>
    </div>`;
  })();

  // Option C: Stalled PRs panel with adjustable threshold
  const thresholdOpts = [30, 60, 90, 120];
  const thresholdBtns = thresholdOpts.map(d => {
    const active = d === stalledThreshold;
    return `<button onclick="window.STALLED_THRESHOLD=${d}; refresh();" style="background:${active ? '#fbbf24' : 'transparent'}; color:${active ? '#0a0a0a' : '#fbbf24'}; border:1px solid #fbbf24; padding:3px 10px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:10px; cursor:pointer; font-weight:${active ? '600' : '400'};">${d}d</button>`;
  }).join(' ');
  const stalledHtmlPR = (() => {
    const rows = stalledPR.length > 0
      ? stalledPR.slice(0, 15).map(s => {
          const subBadge = s.sub_part ? `<span style="background:rgba(113,113,122,0.2); color:var(--muted); padding:1px 5px; border-radius:4px; font-size:8px; font-family:'JetBrains Mono', monospace; margin-left:4px;">${s.sub_part}</span>` : '';
          return `<div class="stalled-row">
            <span class="stalled-stars">${'★'.repeat(s.priority)}</span>
            <span class="stalled-name">${s.name}${subBadge}</span>
            <span class="stalled-rec">${s.maxW > 0 ? s.maxW.toFixed(1)+'kg' : 'BW'} × ${s.maxWReps}</span>
            <span class="stalled-days">${s.daysSincePR}d</span>
          </div>`;
        }).join('')
      : `<div style="color:var(--muted); padding:16px; text-align:center; font-size:12px;">✓ 모든 priority 운동이 ${stalledThreshold}일 안에 PR 갱신됨</div>`;
    return `<div class="card" style="border-color: rgba(251,191,36,0.30); background: rgba(251,191,36,0.04);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
        <div class="label-mono" style="color:#fbbf24;">⏸ STALLED PRs — ${stalledThreshold}+ days no new PR (${stalledPR.length})</div>
        <div style="display:flex; gap:4px;">${thresholdBtns}</div>
      </div>
      ${rows}
      ${stalledPR.length > 0 ? `<div style="color:#fbbf24; font-size:11px; margin-top:10px; padding-top:8px; border-top:1px dashed rgba(251,191,36,0.3); font-family:'JetBrains Mono', monospace;">
        → Variation 시도 (Cable / 1.5 rep / drop set / deload)
      </div>` : ''}
    </div>`;
  })();

  // Option D: PR Timeline with always-visible weight labels
  const oneYrAgoPR = new Date(todayPR); oneYrAgoPR.setFullYear(oneYrAgoPR.getFullYear() - 1);
  const timelineHtmlPR = prTimelinesPR.length > 0 ? (() => {
    const yrSpan = todayPR.getTime() - oneYrAgoPR.getTime();
    const rows = prTimelinesPR.slice(0, 8).map(t => {
      const c = BP_COLORS[t.bp] || '#FF1A8C';
      const dots = t.events.map((e, i) => {
        const dt = parseDateOnly(e.date);
        const pos = Math.max(0, Math.min(100, (dt - oneYrAgoPR) / yrSpan * 100));
        const isLast = e === t.events[t.events.length - 1];
        const dotColor = isLast && t.stalled ? '#fbbf24' : (isLast ? '#84cc16' : c);
        const wStr = e.weight > 0 ? `${e.weight.toFixed(e.weight % 1 === 0 ? 0 : 1)}` : 'BW';
        // Alternate label position: even idx above, odd idx below — avoids overlap
        const above = i % 2 === 0;
        const labelStyle = above
          ? `bottom: 20px; left: ${pos.toFixed(1)}%; transform: translateX(-50%);`
          : `top: 20px; left: ${pos.toFixed(1)}%; transform: translateX(-50%);`;
        return `<div class="pr-event" style="left:${pos.toFixed(1)}%; background:${dotColor};"></div>
        <div class="pr-event-label" style="${labelStyle} color:${dotColor};">${wStr}×${e.reps}</div>`;
      }).join('');
      const lastEvent = t.events[t.events.length - 1];
      const lastDot = t.events.length;
      const statusBadge = t.stalled
        ? `<span style="color:#fbbf24; font-size:10px;">⏸ ${t.daysSinceLast}d</span>`
        : `<span style="color:#84cc16; font-size:10px;">↑ ${t.daysSinceLast}d</span>`;
      // PR progression delta: first vs last
      const first = t.events[0];
      const deltaPct = first.weight > 0 ? ((lastEvent.weight - first.weight) / first.weight * 100) : 0;
      const deltaText = lastDot >= 2
        ? `<span style="color:${deltaPct >= 0 ? '#84cc16' : '#f43f5e'}; font-family:'JetBrains Mono', monospace; font-size:10px;">${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(0)}% (${lastDot} PRs)</span>`
        : '';
      return `<div class="pr-timeline-row">
        <div class="pr-row-name">
          <span style="display:flex; align-items:center; gap:5px;">
            <span class="bp-chip" style="background:${c}25; color:${c};">${t.bp}</span>
            <span>${t.name}</span>
          </span>
          <span style="display:flex; gap:6px; align-items:center;">${deltaText}${statusBadge}</span>
        </div>
        <div class="pr-timeline-bar" style="padding: 24px 0; margin: 8px 0;">${dots}</div>
        <div class="pr-axis"><span>1 yr ago</span><span>6 mo</span><span>3 mo</span><span>now</span></div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="label-mono" style="margin-bottom:10px;">📈 PR TIMELINE — priority exercises (last 1 year)</div>
      ${rows}
    </div>`;
  })() : '';

  return `
    ${renderPRExerciseSearch()}

    ${renderRecentPRs(10)}

    <div class="card" style="background: linear-gradient(135deg, rgba(251,191,36,0.06), transparent); border-color: rgba(251,191,36,0.3); margin-bottom:16px;">
      <div class="label-mono" style="color:var(--gold); margin-bottom:8px;">🏆 BIG 3 PR</div>
      ${big3Html}
      <div style="display:flex; justify-content:space-between; align-items:baseline; padding:14px 0 0 0; margin-top:4px; border-top:2px solid rgba(251,191,36,0.3);">
        <span style="font-family:'JetBrains Mono', monospace; color:var(--gold); font-size:11px; letter-spacing:0.1em;">TOTAL</span>
        <span style="font-family:'JetBrains Mono', monospace; color:var(--gold); font-size:22px;">${big3Total > 0 ? big3Total.toFixed(0) + ' kg' : '—'}</span>
      </div>
      ${bwRatio > 0 ? `<div style="display:flex; justify-content:space-between; align-items:baseline; padding:8px 0;">
        <span style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:11px; letter-spacing:0.1em;">BW RATIO</span>
        <span style="font-family:'JetBrains Mono', monospace; color:var(--text); font-size:14px;">${bwRatio.toFixed(2)}× (${bodyWeight.toFixed(1)} kg)</span>
      </div>` : ''}
      <div style="border-top:1px dashed var(--border); margin:12px 0;"></div>
      <div class="label-mono" style="color:var(--silver); margin-bottom:8px;">⭐ BIG 7 (rest)</div>
      ${big7RestHtml}
    </div>

    <h2><span class="pill-lift">LIFTING</span> Body Part Summary</h2>
    <div class="grid grid-3">${bpCards}</div>

    ${renderPRActivity()}
  `;
}

// === View: Trends (v3) — running + lifting time-series ===
function renderTrends(agg) {
  const mode = window.TRENDS_MODE || 'run';  // 'run' | 'lift' | 'compare'
  const tr = agg.totalsRun, tl = agg.totalsLift;
  const days = Math.floor((agg.rangeEnd - agg.rangeStart) / 86400000) + 1;
  const liftBpFilter = window.TRENDS_LIFT_BP || 'ALL';
  const liftDrillEx = window.TRENDS_LIFT_DRILL || '';

  // Option E: Periodization Indicator — weekly volume + deload pattern
  const periodToday = new Date(); periodToday.setHours(0,0,0,0);
  const weekly = computeWeeklyVolume(DATA.lifts || [], periodToday, 16);
  const maxVol = Math.max(...weekly.map(w => w.vol), 1);
  const buildPct = weekly.filter(w => !w.isDeload && w.vol > 0).map(w => w.vol);
  const deloadCount = weekly.filter(w => w.isDeload).length;
  // Cross-cycle progression: are recent build-week peaks higher than older ones?
  let progressNote = '';
  if (buildPct.length >= 6) {
    const earlyAvg = buildPct.slice(0, Math.floor(buildPct.length/3)).reduce((s,v)=>s+v,0) / Math.floor(buildPct.length/3);
    const lateAvg = buildPct.slice(-Math.floor(buildPct.length/3)).reduce((s,v)=>s+v,0) / Math.floor(buildPct.length/3);
    const change = earlyAvg > 0 ? ((lateAvg - earlyAvg) / earlyAvg * 100) : 0;
    if (change >= 8) progressNote = `<span style="color:#84cc16;">✓ Build peaks progressing</span> — late mesocycle peaks +${change.toFixed(0)}% vs early`;
    else if (change <= -5) progressNote = `<span style="color:#f43f5e;">↓ Build peaks regressing</span> ${change.toFixed(0)}%`;
    else progressNote = `<span style="color:#fbbf24;">⏸ Volume plateau across cycles</span> — Δ${change >= 0 ? '+' : ''}${change.toFixed(0)}%`;
  }
  const bars = weekly.map(w => {
    const h = w.vol > 0 ? Math.max(4, (w.vol / maxVol) * 70) : 2;
    const cls = w.isDeload ? 'period-bar deload' : 'period-bar';
    return `<div class="${cls}" style="height:${h.toFixed(0)}%;" title="W${w.weekIdx}: ${num(w.vol, 0)} kg"></div>`;
  }).join('');
  const periodHtml = `<div class="card">
    <div class="label-mono" style="margin-bottom:6px;">📊 TOTAL WEEKLY VOLUME — last 16 weeks</div>
    <div class="period-bars">${bars}</div>
    <div style="font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); margin-top:18px;">
      <span style="display:inline-block; width:10px; height:10px; background:var(--lift); margin-right:4px; vertical-align:middle;"></span>build &nbsp;
      <span style="display:inline-block; width:10px; height:10px; background:#fbbf24; opacity:0.5; margin:0 4px 0 8px; vertical-align:middle;"></span>deload (auto-detected: vol < 70% prior wk)
    </div>
    ${progressNote ? `<div style="background:rgba(132,204,22,0.06); border:1px solid rgba(132,204,22,0.2); padding:8px 10px; border-radius:6px; margin-top:10px; font-size:11px; font-family:'JetBrains Mono', monospace;">
      ${deloadCount > 0 ? `<span style="color:#a3e635;">✓ ${deloadCount} deload week${deloadCount > 1 ? 's' : ''} detected</span> · ` : ''}${progressNote}
    </div>` : ''}
  </div>`;

  // === Running Best Efforts ===
  function runBestEfforts() {
    const runs = (DATA.runs || []).filter(r => inRange(r.date, agg.rangeStart, agg.rangeEnd));
    let longest = {distance:0, date:""}, fastestPace = {pace:99, date:"", distance:0};
    let fastest5k = {pace:99, date:""}, fastest10k = {pace:99, date:""};
    let mostCal = {calories:0, date:""}, highestHR = {hr:0, date:""};
    for (const r of runs) {
      if ((r.distance||0) > longest.distance) { longest = {distance:r.distance, date:dateOnly(r.date)}; }
      if (r.distance >= 1 && r.pace && r.pace < fastestPace.pace) { fastestPace = {pace:r.pace, distance:r.distance, date:dateOnly(r.date)}; }
      if (r.distance >= 5 && r.pace && r.pace < fastest5k.pace) { fastest5k = {pace:r.pace, date:dateOnly(r.date)}; }
      if (r.distance >= 10 && r.pace && r.pace < fastest10k.pace) { fastest10k = {pace:r.pace, date:dateOnly(r.date)}; }
      if ((r.calories||0) > mostCal.calories) { mostCal = {calories:r.calories, date:dateOnly(r.date)}; }
      if ((r.hr||0) > highestHR.hr) { highestHR = {hr:r.hr, date:dateOnly(r.date)}; }
    }
    function card(label, val, sub) {
      return `<div class="card" style="margin:0;">
        <h3>${label}</h3>
        <div class="stat-big" style="font-size:22px; color:var(--run);">${val}</div>
        <div class="stat-label">${sub}</div>
      </div>`;
    }
    return `<div class="grid grid-3" style="margin-bottom:12px;">
      ${card('LONGEST', longest.distance > 0 ? longest.distance.toFixed(2) + ' km' : '—', longest.date || '—')}
      ${card('FASTEST PACE', fastestPace.pace < 99 ? fmtPace(fastestPace.pace) : '—', fastestPace.distance > 0 ? `${fastestPace.distance.toFixed(2)}km · ${fastestPace.date}` : '—')}
      ${card('FASTEST 5K', fastest5k.pace < 99 ? fmtPace(fastest5k.pace) : '—', fastest5k.date || '—')}
      ${card('FASTEST 10K', fastest10k.pace < 99 ? fmtPace(fastest10k.pace) : '—', fastest10k.date || '—')}
      ${card('MOST CAL', mostCal.calories > 0 ? num(mostCal.calories,0) + ' kcal' : '—', mostCal.date || '—')}
      ${card('HIGHEST HR', highestHR.hr > 0 ? highestHR.hr.toFixed(0) + ' bpm' : '—', highestHR.date || '—')}
    </div>`;
  }

  // === Line chart: numeric series over time ===
  function buildLineChart(points, yLabel, color, opts) {
    opts = opts || {};
    const w = 800, h = 180, padL = 40, padR = 12, padT = 12, padB = 28;
    if (points.length < 2) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    points.sort((a,b) => a.t - b.t);
    const ys = points.map(p => p.v);
    const yMin = opts.yMin !== undefined ? opts.yMin : Math.min(...ys);
    const yMax = opts.yMax !== undefined ? opts.yMax : Math.max(...ys);
    const yRng = (yMax - yMin) || 1;
    const xMin = points[0].t, xMax = points[points.length-1].t;
    const xRng = (xMax - xMin) || 1;
    const xS = t => padL + (t - xMin) / xRng * (w - padL - padR);
    const yS = v => h - padB - (v - yMin) / yRng * (h - padT - padB);
    const path = points.map(p => `${xS(p.t).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" L");
    const dots = points.map(p =>
      `<circle cx="${xS(p.t).toFixed(1)}" cy="${yS(p.v).toFixed(1)}" r="2.5" fill="${color}" data-payload="${(p.payload||'').replace(/"/g,'&quot;')}" class="hbar"/>`
    ).join("");
    // axis labels
    const yMidVal = (yMin + yMax) / 2;
    const yLabels = `
      <text x="2" y="${(padT+8).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${opts.yFmt ? opts.yFmt(yMax) : yMax.toFixed(opts.decimals||1)}</text>
      <text x="2" y="${yS(yMidVal).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${opts.yFmt ? opts.yFmt(yMidVal) : yMidVal.toFixed(opts.decimals||1)}</text>
      <text x="2" y="${(h-padB-2).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${opts.yFmt ? opts.yFmt(yMin) : yMin.toFixed(opts.decimals||1)}</text>
    `;
    // x-axis: first and last date
    const fdate = isoDate(new Date(xMin));
    const ldate = isoDate(new Date(xMax));
    const xLabels = `
      <text x="${padL}" y="${(h-6).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fdate}</text>
      <text x="${(w - padR).toFixed(1)}" y="${(h-6).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${ldate}</text>
    `;
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;">
      ${yLabels}
      <path d="M${path}" stroke="${color}" stroke-width="1.5" fill="none"/>
      ${dots}
      ${xLabels}
    </svg>`;
  }

  // === Scatter chart ===
  function buildScatter(points, xLabel, yLabel, opts) {
    opts = opts || {};
    const w = 800, h = 220, padL = 50, padR = 12, padT = 12, padB = 38;
    if (!points.length) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const xMin = opts.xMin !== undefined ? opts.xMin : Math.min(...xs);
    const xMax = opts.xMax !== undefined ? opts.xMax : Math.max(...xs);
    const yMin = opts.yMin !== undefined ? opts.yMin : Math.min(...ys);
    const yMax = opts.yMax !== undefined ? opts.yMax : Math.max(...ys);
    const xRng = (xMax - xMin) || 1, yRng = (yMax - yMin) || 1;
    const xS = x => padL + (x - xMin) / xRng * (w - padL - padR);
    const yS = y => h - padB - (y - yMin) / yRng * (h - padT - padB);
    const dots = points.map(p =>
      `<circle cx="${xS(p.x).toFixed(1)}" cy="${yS(p.y).toFixed(1)}" r="${p.r||3}" fill="${p.color||opts.color||'#888'}" opacity="0.7" data-payload="${(p.payload||'').replace(/"/g,'&quot;')}" class="hbar"/>`
    ).join("");
    const fmtX = opts.xFmt || (v => v.toFixed(opts.xDec||1));
    const fmtY = opts.yFmt || (v => v.toFixed(opts.yDec||1));
    const yMid = (yMin + yMax) / 2;
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <text x="2" y="${(padT+8).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMax)}</text>
      <text x="2" y="${yS(yMid).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMid)}</text>
      <text x="2" y="${(h-padB-2).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMin)}</text>
      ${dots}
      <text x="${(padL).toFixed(1)}" y="${(h-12).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtX(xMin)}</text>
      <text x="${(w-padR).toFixed(1)}" y="${(h-12).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${fmtX(xMax)}</text>
      <text x="${(w/2).toFixed(1)}" y="${(h-2).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${xLabel}</text>
    </svg>`;
  }

  // === Donut chart ===
  function buildDonut(slices) {
    const total = slices.reduce((s, x) => s + x.value, 0);
    if (total === 0) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const cx = 100, cy = 100, R = 80, r = 50;
    let cumulative = 0;
    const arcs = slices.map(s => {
      if (s.value === 0) return "";
      const startAngle = (cumulative / total) * Math.PI * 2 - Math.PI/2;
      cumulative += s.value;
      const endAngle = (cumulative / total) * Math.PI * 2 - Math.PI/2;
      const x1 = cx + R * Math.cos(startAngle), y1 = cy + R * Math.sin(startAngle);
      const x2 = cx + R * Math.cos(endAngle), y2 = cy + R * Math.sin(endAngle);
      const x3 = cx + r * Math.cos(endAngle), y3 = cy + r * Math.sin(endAngle);
      const x4 = cx + r * Math.cos(startAngle), y4 = cy + r * Math.sin(startAngle);
      const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      return `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L ${x3.toFixed(1)} ${y3.toFixed(1)} A ${r} ${r} 0 ${largeArc} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${s.color}" opacity="0.85"/>`;
    }).join("");
    const legend = slices.map(s =>
      `<div style="display:flex; align-items:center; gap:8px; padding:3px 0;">
        <div style="width:10px; height:10px; background:${s.color}; border-radius:2px;"></div>
        <span style="flex:1; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text);">${s.label}</span>
        <span style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);">${(s.value/total*100).toFixed(0)}% (${s.value})</span>
      </div>`
    ).join("");
    return `<div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
      <svg width="200" height="200" viewBox="0 0 200 200">
        ${arcs}
        <text x="${cx}" y="${cy}" fill="var(--text)" font-size="16" text-anchor="middle" font-family="JetBrains Mono" dy="-2">${total}</text>
        <text x="${cx}" y="${cy+14}" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">total</text>
      </svg>
      <div style="flex:1; min-width:160px;">${legend}</div>
    </div>`;
  }

  // === Stacked bars (monthly with segments) ===
  function buildStackedBars(labels, stacks, segOrder, colorMap) {
    if (!labels.length) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const cw = 800, ch = 200, padB = 24;
    const totals = labels.map(l => Object.values(stacks[l] || {}).reduce((s, v) => s + v, 0));
    const maxV = Math.max(1, ...totals);
    const out = [];
    labels.forEach((m, i) => {
      let yCursor = ch - padB;
      const x = (i + 0.5) * (cw / labels.length);
      const bw = (cw / labels.length) * 0.6;
      const bx = x - bw / 2;
      const segments = stacks[m] || {};
      const total = totals[i];
      for (const seg of segOrder) {
        const val = segments[seg] || 0;
        if (val <= 0) continue;
        const segH = (val / maxV) * (ch - 40 - padB);
        yCursor -= segH;
        const payload = JSON.stringify({date:m, primary:`${seg}: ${num(val,0)} kg`, secondary:`total ${num(total,0)} kg (${(val/total*100).toFixed(0)}%)`}).replace(/"/g,"&quot;");
        out.push(`<rect x="${bx.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${bw.toFixed(1)}" height="${segH.toFixed(1)}" fill="${colorMap[seg]||'#888'}" opacity="0.85" rx="1" class="hbar" data-payload="${payload}"></rect>`);
      }
      out.push(`<text x="${x.toFixed(1)}" y="${ch-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${m.slice(5)}</text>`);
    });
    const legend = segOrder.map(k => `<span style="margin-right:12px; font-family:'JetBrains Mono', monospace; font-size:10px;"><span style="display:inline-block; width:8px; height:8px; background:${colorMap[k]||'#888'}; vertical-align:middle; margin-right:3px; border-radius:1px;"></span>${k}</span>`).join("");
    return `<svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">${out.join("")}</svg>
      <div style="margin-top:8px;">${legend}</div>`;
  }

  // === Simple bar chart (for day-of-week, HR histogram) ===
  function buildBarChart(labels, values, color, opts) {
    opts = opts || {};
    if (!labels.length) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const cw = 800, ch = 160, padB = 28;
    const maxV = Math.max(1, ...values);
    const out = [];
    labels.forEach((lbl, i) => {
      const v = values[i] || 0;
      const x = (i + 0.5) * (cw / labels.length);
      const bw = (cw / labels.length) * 0.6;
      const bx = x - bw / 2;
      const by = ch - padB - (v / maxV) * (ch - 40 - padB);
      const bh = (v / maxV) * (ch - 40 - padB);
      const payload = JSON.stringify({date:lbl, primary:opts.fmt ? opts.fmt(v) : v.toString(), secondary: opts.unit||""}).replace(/"/g,"&quot;");
      out.push(`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" opacity="0.7" rx="2" class="hbar" data-payload="${payload}"></rect>`);
      out.push(`<text x="${x.toFixed(1)}" y="${(ch-padB+12).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="middle">${lbl}</text>`);
      if (v > 0) out.push(`<text x="${x.toFixed(1)}" y="${(by-3).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${opts.fmt ? opts.fmt(v) : v}</text>`);
    });
    return `<svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">${out.join("")}</svg>`;
  }

  // === Multi-line chart ===
  function buildMultiLine(seriesByLabel, opts) {
    opts = opts || {};
    const w = 800, h = 200, padL = 50, padR = 12, padT = 12, padB = 28;
    const allPts = [];
    for (const [, pts] of Object.entries(seriesByLabel)) for (const p of pts) allPts.push(p);
    if (allPts.length < 2) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const xs = allPts.map(p => p.t), ys = allPts.map(p => p.v);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = opts.yMin !== undefined ? opts.yMin : Math.min(...ys);
    const yMax = opts.yMax !== undefined ? opts.yMax : Math.max(...ys);
    const xRng = (xMax - xMin) || 1, yRng = (yMax - yMin) || 1;
    const xS = x => padL + (x - xMin) / xRng * (w - padL - padR);
    const yS = y => h - padB - (y - yMin) / yRng * (h - padT - padB);
    const lines = [];
    const legendBits = [];
    for (const [label, pts] of Object.entries(seriesByLabel)) {
      const sorted = [...pts].sort((a,b) => a.t - b.t);
      const c = (opts.colors && opts.colors[label]) || COLORS.lift;
      if (sorted.length < 1) continue;
      const path = sorted.map(p => `${xS(p.t).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" L");
      lines.push(`<path d="M${path}" stroke="${c}" stroke-width="1.5" fill="none"/>`);
      const dots = sorted.map(p => `<circle cx="${xS(p.t).toFixed(1)}" cy="${yS(p.v).toFixed(1)}" r="2.5" fill="${c}" data-payload="${(p.payload||'').replace(/"/g,'&quot;')}" class="hbar"/>`).join("");
      lines.push(dots);
      legendBits.push(`<span style="margin-right:12px; font-family:'JetBrains Mono', monospace; font-size:10px;"><span style="display:inline-block; width:14px; height:2px; background:${c}; vertical-align:middle; margin-right:4px;"></span>${label}</span>`);
    }
    const fmtY = opts.yFmt || (v => v.toFixed(opts.yDec||1));
    const yMid = (yMin + yMax)/2;
    const fdate = isoDate(new Date(xMin));
    const ldate = isoDate(new Date(xMax));
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <text x="2" y="${(padT+8).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMax)}</text>
      <text x="2" y="${yS(yMid).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMid)}</text>
      <text x="2" y="${(h-padB-2).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fmtY(yMin)}</text>
      ${lines.join("")}
      <text x="${padL}" y="${(h-6).toFixed(1)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono">${fdate}</text>
      <text x="${(w-padR).toFixed(1)}" y="${(h-6).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${ldate}</text>
    </svg>
    <div style="margin-top:8px;">${legendBits.join("")}</div>`;
  }

  // === Bar chart: monthly aggregation ===
  function buildMonthlyBars(months, byMonth, color, kind) {
    if (!months.length) return `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;
    const cw = 800, ch = 180;
    const maxV = Math.max(1, ...months.map(m => kind==="run" ? byMonth[m].distance : byMonth[m].volume));
    const out = [];
    months.forEach((m, i) => {
      const md = byMonth[m];
      const v = kind === "run" ? md.distance : md.volume;
      const x = (i + 0.5) * (cw / months.length);
      const bw = (cw / months.length) * 0.6;
      const bx = x - bw / 2;
      const by = ch - 24 - (v / maxV) * (ch - 60);
      const bh = (v / maxV) * (ch - 60);
      const primary = kind === "run" ? `${v.toFixed(1)} km` : `${num(v, 0)} kg volume`;
      const secondary = kind === "run" ? `${md.count} runs · ${Math.round(md.duration)} min` : `${md.sets} sets · ${md.sessions} sessions`;
      const payload = JSON.stringify({date: m, primary, secondary}).replace(/"/g, "&quot;");
      out.push(`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" opacity="0.7" rx="2" class="hbar" data-payload="${payload}"></rect>`);
      out.push(`<text x="${x.toFixed(1)}" y="${ch-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${m.slice(5)}</text>`);
    });
    return `<svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">${out.join("")}</svg>`;
  }

  // === Run mode ===
  function renderRunMode() {
    const monthsR = Object.keys(agg.runByMonth).sort();
    const runsInRange = (DATA.runs || []).filter(r => inRange(r.date, agg.rangeStart, agg.rangeEnd));

    const distancePts = runsInRange.map(r => ({t: parseDateOnly(dateOnly(r.date)).getTime(), v: r.distance || 0,
      payload: JSON.stringify({date: dateOnly(r.date), primary: `${(r.distance||0).toFixed(2)} km`, secondary: `${Math.round(r.duration||0)} min · ${fmtPace(r.pace||0)}`})}));
    const pacePts = runsInRange.filter(r => r.pace && r.distance >= 1)
      .map(r => ({t: parseDateOnly(dateOnly(r.date)).getTime(), v: r.pace,
                  payload: JSON.stringify({date: dateOnly(r.date), primary: fmtPace(r.pace), secondary: `${(r.distance||0).toFixed(2)} km`})}));

    // F. HR distribution (avg HR histogram)
    const hrBuckets = [{lo:0, hi:120, label:"<120", color:"#22d3ee"}, {lo:120, hi:140, label:"120-140 (Z2)", color:"#84cc16"}, {lo:140, hi:160, label:"140-160 (Z3)", color:"#fbbf24"}, {lo:160, hi:175, label:"160-175 (Z4)", color:"#f97316"}, {lo:175, hi:999, label:"175+ (Z5)", color:"#f43f5e"}];
    const hrCounts = hrBuckets.map(b => runsInRange.filter(r => (r.hr||0) >= b.lo && (r.hr||0) < b.hi).length);
    const hrLabels = hrBuckets.map(b => b.label);

    // G. Pace × Distance scatter
    const paceVsDistPts = runsInRange.filter(r => r.distance >= 1 && r.pace).map(r => ({
      x: r.distance, y: r.pace, color: COLORS.run, r: 4,
      payload: JSON.stringify({date: dateOnly(r.date), primary: `${r.distance.toFixed(2)} km @ ${fmtPace(r.pace)}`, secondary: `${Math.round(r.duration||0)} min · ${(r.hr||0).toFixed(0)} bpm`})
    }));

    // H. Source distribution donut
    const srcCounts = {};
    for (const r of runsInRange) { const s = r.source || 'Unknown'; srcCounts[s] = (srcCounts[s]||0) + 1; }
    const srcSlices = Object.entries(srcCounts).map(([label, value]) => {
      const colorMap = {'Apple Watch':'#a3a3a3', 'Nike Run Club':'#fb923c', 'Strava':'#fc4c02', 'Unknown':'#71717a'};
      return {label, value, color: colorMap[label] || '#888'};
    });

    // I. Day of week frequency
    const dowLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const dowCounts = [0,0,0,0,0,0,0];
    for (const r of runsInRange) {
      const d = parseDateOnly(dateOnly(r.date));
      const wd = d.getDay() === 0 ? 6 : d.getDay() - 1;
      dowCounts[wd]++;
    }

    // J. Best 5km/10km PR progression (rolling best per month)
    const months = monthsR;
    const best5kSeries = [], best10kSeries = [];
    let runningBest5k = 99, runningBest10k = 99;
    for (const m of months) {
      const ymRuns = runsInRange.filter(r => dateOnly(r.date).startsWith(m));
      let m5k = 99, m10k = 99;
      for (const r of ymRuns) {
        if (r.distance >= 5 && r.pace && r.pace < m5k) m5k = r.pace;
        if (r.distance >= 10 && r.pace && r.pace < m10k) m10k = r.pace;
      }
      const t = parseDateOnly(m + "-15").getTime();
      if (m5k < 99) {
        runningBest5k = Math.min(runningBest5k, m5k);
        best5kSeries.push({t, v: runningBest5k, payload: JSON.stringify({date:m, primary:`5K best: ${fmtPace(runningBest5k)}`})});
      }
      if (m10k < 99) {
        runningBest10k = Math.min(runningBest10k, m10k);
        best10kSeries.push({t, v: runningBest10k, payload: JSON.stringify({date:m, primary:`10K best: ${fmtPace(runningBest10k)}`})});
      }
    }

    return `
      <h2><span class="pill-run">RUNNING</span> Best Efforts</h2>
      ${runBestEfforts()}

      <div class="card">
        <h3>DISTANCE OVER TIME</h3>
        ${buildLineChart(distancePts, "km", COLORS.run, {decimals:1, yFmt: v => v.toFixed(1)+' km'})}
      </div>
      <div class="card">
        <h3>PACE PROGRESSION (min/km, lower = better)</h3>
        ${buildLineChart(pacePts, "min/km", COLORS.run, {decimals:2, yFmt: fmtPace})}
      </div>
      <div class="card">
        <h3>5K / 10K PR PROGRESSION (cumulative best)</h3>
        ${buildMultiLine({"5K best": best5kSeries, "10K best": best10kSeries}, {yFmt: fmtPace, colors:{"5K best":"#06b6d4", "10K best":"#fbbf24"}})}
      </div>
      <div class="card">
        <h3>MONTHLY DISTANCE</h3>
        ${buildMonthlyBars(monthsR, agg.runByMonth, COLORS.run, "run")}
      </div>
      <div class="grid grid-2" style="gap:12px;">
        <div class="card">
          <h3>PACE × DISTANCE</h3>
          ${buildScatter(paceVsDistPts, "distance (km)", "pace (min/km)", {color: COLORS.run, xFmt: v => v.toFixed(1)+' km', yFmt: fmtPace})}
        </div>
        <div class="card">
          <h3>HR ZONE DISTRIBUTION (avg HR per run)</h3>
          ${buildBarChart(hrLabels, hrCounts, COLORS.run, {fmt: v => v + ' runs'})}
        </div>
      </div>
      <div class="grid grid-2" style="gap:12px;">
        <div class="card">
          <h3>SOURCE BREAKDOWN</h3>
          ${buildDonut(srcSlices)}
        </div>
        <div class="card">
          <h3>DAY OF WEEK FREQUENCY</h3>
          ${buildBarChart(dowLabels, dowCounts, COLORS.run, {fmt: v => v + ' runs'})}
        </div>
      </div>
    `;
  }

  // === Lift mode ===
  function renderLiftMode() {
    const monthsL = Object.keys(agg.liftByMonth).sort();
    const allLiftsRaw = (DATA.lifts || []).filter(l => inRange(l.date, agg.rangeStart, agg.rangeEnd));
    // A. Body part filter
    const allLifts = liftBpFilter === 'ALL' ? allLiftsRaw : allLiftsRaw.filter(l => bodyPart(l.exercise || "") === liftBpFilter);

    // Filter UI (BP)
    const bpOptions = ["ALL","CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"];
    const bpFilterHtml = `
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
        <span class="label-mono">FILTER:</span>
        <select onchange="window.TRENDS_LIFT_BP=this.value; refresh();" style="background:var(--surface-2,#161616); color:var(--text); border:1px solid var(--border); padding:6px 10px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:11px;">
          ${bpOptions.map(bp => `<option value="${bp}" ${liftBpFilter===bp?'selected':''}>${bp === 'ALL' ? 'All body parts' : bp}</option>`).join("")}
        </select>
      </div>`;

    // Top 5 exercises by total volume
    const exVol = new Map();
    for (const l of allLifts) {
      const ex = l.exercise || "(unnamed)";
      exVol.set(ex, (exVol.get(ex)||0) + (l.weight||0)*(l.reps||0));
    }
    const top5 = [...exVol.entries()].sort((a,b) => b[1]-a[1]).slice(0, 5);
    const top5Html = top5.length ? top5.map(([name, vol]) => {
      const bp = bodyPart(name);
      const c = BP_COLORS[bp];
      const safeName = name.replace(/'/g, "\\'");
      return `<div class="card" style="margin:0; cursor:pointer;" onclick="window.TRENDS_LIFT_DRILL='${safeName}'; refresh(); document.getElementById('lift-drill-section')?.scrollIntoView({behavior:'smooth'});">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <h3 style="margin:0; font-size:11px; flex:1;">${name}</h3>
          <span style="background:${c}30; color:${c}; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-family:'JetBrains Mono', monospace; letter-spacing: 0.1em;">${bp}</span>
        </div>
        <div class="stat-big" style="font-size:18px; color:var(--lift); margin-top:6px;">${num(vol, 0)} kg</div>
        <div class="stat-label">total volume · click to drill down</div>
      </div>`;
    }).join("") : `<div style="color:var(--muted)">${t("noData")}</div>`;

    // Filter agg.liftByMonth based on bp filter (recompute volumes by month from filtered lifts)
    const filteredVolByMonth = {};
    const filteredSessionsByMonth = {};
    const filteredSetsByMonth = {};
    for (const m of monthsL) { filteredVolByMonth[m] = 0; filteredSessionsByMonth[m] = new Set(); filteredSetsByMonth[m] = 0; }
    for (const l of allLifts) {
      const m = dateOnly(l.date).slice(0, 7);
      if (filteredVolByMonth[m] === undefined) { filteredVolByMonth[m] = 0; filteredSessionsByMonth[m] = new Set(); filteredSetsByMonth[m] = 0; }
      filteredVolByMonth[m] += (l.weight||0) * (l.reps||0);
      filteredSessionsByMonth[m].add(dateOnly(l.date));
      filteredSetsByMonth[m]++;
    }
    const filteredMonths = Object.keys(filteredVolByMonth).sort();
    // Build a synthetic liftByMonth-like obj for buildMonthlyBars
    const fakeLiftByMonth = {};
    for (const m of filteredMonths) {
      fakeLiftByMonth[m] = {volume: filteredVolByMonth[m], sets: filteredSetsByMonth[m], sessions: filteredSessionsByMonth[m].size};
    }

    // Sessions monthly
    const sessionsBars = filteredMonths.length ? (() => {
      const cw = 800, ch = 160, padB = 24;
      const maxV = Math.max(1, ...filteredMonths.map(m => fakeLiftByMonth[m].sessions));
      const out = [];
      filteredMonths.forEach((m, i) => {
        const md = fakeLiftByMonth[m];
        const v = md.sessions;
        const x = (i + 0.5) * (cw / filteredMonths.length);
        const bw = (cw / filteredMonths.length) * 0.6;
        const bx = x - bw/2;
        const by = ch - padB - (v / maxV) * (ch - 40 - padB);
        const bh = (v / maxV) * (ch - 40 - padB);
        const payload = JSON.stringify({date: m, primary: `${v} sessions`, secondary: `${md.sets} sets · ${num(md.volume,0)} kg vol`});
        out.push(`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${COLORS.lift}" opacity="0.7" rx="2" class="hbar" data-payload="${payload.replace(/"/g,'&quot;')}"></rect>`);
        out.push(`<text x="${x.toFixed(1)}" y="${ch-6}" fill="var(--muted)" font-size="10" text-anchor="middle">${m.slice(5)}</text>`);
      });
      return `<svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">${out.join("")}</svg>`;
    })() : `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>`;

    // C. Body part stacked monthly volume (only when ALL filter)
    const bpStackOrder = ["CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"];
    const bpStacks = {};
    for (const m of monthsL) bpStacks[m] = {};
    for (const l of allLiftsRaw) {  // use raw, ignore bp filter
      const m = dateOnly(l.date).slice(0, 7);
      const bp = bodyPart(l.exercise || "");
      if (!bpStacks[m]) bpStacks[m] = {};
      bpStacks[m][bp] = (bpStacks[m][bp] || 0) + (l.weight||0) * (l.reps||0);
    }
    const allMonthsForStack = Object.keys(bpStacks).sort();

    // D. Rep range distribution
    const repRanges = [
      {lo:1, hi:5, label:"1-5 reps (Strength)", color:"#f43f5e"},
      {lo:6, hi:12, label:"6-12 reps (Hypertrophy)", color:"#FF1A8C"},
      {lo:13, hi:99, label:"13+ reps (Endurance)", color:"#a855f7"},
    ];
    const repCounts = repRanges.map(rr => allLifts.filter(l => (l.reps||0) >= rr.lo && (l.reps||0) <= rr.hi).length);
    const repSlices = repRanges.map((rr, i) => ({label: rr.label, value: repCounts[i], color: rr.color}));

    // E. PR timeline (each big7 PR event as a scatter point)
    const prEvents = [];
    const big7Order = ["SQUAT","BENCH","DEADLIFT","OHP","BB ROW","PULL-UP","DIP"];
    const big7BestSoFar = {};
    for (const k of big7Order) big7BestSoFar[k] = 0;
    const sortedLifts = [...(DATA.lifts || [])].sort((a,b) => dateOnly(a.date).localeCompare(dateOnly(b.date)));
    for (const l of sortedLifts) {
      if (!inRange(l.date, agg.rangeStart, agg.rangeEnd)) continue;
      const k = findBigMatch(l.exercise || "", BIG7_PATTERNS);
      if (!k) continue;
      if ((l.weight||0) > big7BestSoFar[k]) {
        big7BestSoFar[k] = l.weight;
        prEvents.push({
          x: parseDateOnly(dateOnly(l.date)).getTime(),
          y: l.weight,
          color: ["SQUAT","BENCH","DEADLIFT"].includes(k) ? "#fbbf24" : "#cbd5e1",
          r: 5,
          label: k,
          payload: JSON.stringify({date: dateOnly(l.date), primary:`${k} PR: ${l.weight.toFixed(1)} kg`, secondary: l.exercise})
        });
      }
    }

    // Drilldown section
    const allExNames = [...new Set(allLifts.map(l => l.exercise))].sort();
    const drillSection = (() => {
      const exName = liftDrillEx && allExNames.includes(liftDrillEx) ? liftDrillEx : (allExNames[0] || "");
      const drillLifts = allLifts.filter(l => l.exercise === exName);
      // max weight per session
      const maxByDate = new Map();
      const volByDate = new Map();
      for (const l of drillLifts) {
        const d = dateOnly(l.date);
        if (!maxByDate.has(d) || (l.weight||0) > maxByDate.get(d)) maxByDate.set(d, l.weight||0);
        volByDate.set(d, (volByDate.get(d)||0) + (l.weight||0)*(l.reps||0));
      }
      const maxPts = [...maxByDate.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([d,v]) => ({
        t: parseDateOnly(d).getTime(), v,
        payload: JSON.stringify({date:d, primary:`${v.toFixed(1)} kg max`, secondary: exName})
      }));
      const volPts = [...volByDate.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([d,v]) => ({
        t: parseDateOnly(d).getTime(), v,
        payload: JSON.stringify({date:d, primary:`${num(v,0)} kg vol`, secondary: exName})
      }));
      const selectorHtml = `<select onchange="window.TRENDS_LIFT_DRILL=this.value; refresh();" style="background:var(--surface-2,#161616); color:var(--text); border:1px solid var(--border); padding:6px 10px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:11px; min-width:240px;">
        ${allExNames.map(n => `<option value="${n.replace(/"/g,'&quot;')}" ${n === exName ? 'selected':''}>${n}</option>`).join("")}
      </select>`;
      return `
        <div id="lift-drill-section" class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:12px; flex-wrap:wrap;">
            <h3 style="margin:0;">EXERCISE DRILLDOWN — ${exName || '—'}</h3>
            ${selectorHtml}
          </div>
          ${maxPts.length < 2 ? `<div style="color:var(--muted); padding:20px;">${t("noData")}</div>` : `
          <div class="grid grid-2" style="gap:12px;">
            <div>
              <div class="label-mono" style="margin-bottom:4px;">MAX WEIGHT PER SESSION</div>
              ${buildLineChart(maxPts, "kg", COLORS.lift, {decimals:1, yFmt: v => v.toFixed(1)+' kg'})}
            </div>
            <div>
              <div class="label-mono" style="margin-bottom:4px;">VOLUME PER SESSION</div>
              ${buildLineChart(volPts, "kg", COLORS.lift, {decimals:0, yFmt: v => num(v,0)+' kg'})}
            </div>
          </div>`}
        </div>`;
    })();

    return `
      <h2><span class="pill-lift">LIFTING</span> Top 5 by Volume</h2>
      ${bpFilterHtml}
      <div class="grid grid-3" style="margin-bottom:12px;">${top5Html}</div>
      <div class="card">
        <h3>MONTHLY VOLUME${liftBpFilter !== 'ALL' ? ` (${liftBpFilter})` : ''}</h3>
        ${buildMonthlyBars(filteredMonths, fakeLiftByMonth, COLORS.lift, "lift")}
      </div>
      <div class="card">
        <h3>MONTHLY SESSIONS${liftBpFilter !== 'ALL' ? ` (${liftBpFilter})` : ''}</h3>
        ${sessionsBars}
      </div>
      ${liftBpFilter === 'ALL' ? `<div class="card">
        <h3>BODY PART STACKED VOLUME (monthly)</h3>
        ${buildStackedBars(allMonthsForStack, bpStacks, bpStackOrder, BP_COLORS)}
      </div>` : ''}
      <div class="grid grid-2" style="gap:12px;">
        <div class="card">
          <h3>REP RANGE DISTRIBUTION</h3>
          ${buildDonut(repSlices)}
        </div>
        <div class="card">
          <h3>PR TIMELINE (Big 7 PRs as set)</h3>
          ${buildScatter(prEvents, "date", "weight (kg)", {color: COLORS.lift, xFmt: v => isoDate(new Date(v)), yFmt: v => v.toFixed(0)+' kg'})}
        </div>
      </div>
      ${drillSection}
    `;
  }

  // === Compare mode ===
  function renderCompareMode() {
    const now = new Date();
    function monthRange(year, month) {
      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 0, 23, 59, 59);
      return [start, end];
    }
    const [thisStart, thisEnd] = monthRange(now.getFullYear(), now.getMonth());
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const [prevStart, prevEnd] = monthRange(lastMonth.getFullYear(), lastMonth.getMonth());
    const [yoyStart, yoyEnd] = monthRange(now.getFullYear() - 1, now.getMonth());

    function summarize(start, end) {
      const runs = (DATA.runs||[]).filter(r => inRange(r.date, start, end));
      const lifts = (DATA.lifts||[]).filter(l => inRange(l.date, start, end));
      const dist = runs.reduce((s,r) => s + (r.distance||0), 0);
      const dur = runs.reduce((s,r) => s + (r.duration||0), 0);
