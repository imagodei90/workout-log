<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">




<title>Workout Dashboard — DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root {
  --bg: #0a0a0a;
  --card: #111114;
  --card2: #18181b;
  --text: #fafafa;
  --muted: #71717a;
  --run: #fafafa;
  --run-dim: #1f1f23;
  --lift: #FF1A8C;
  --lift-dim: rgba(255, 26, 140, 0.18);
  --accent: #FF1A8C;
  --border: #1f1f23;
  --gold: #fbbf24;
  --silver: #cbd5e1;
}
.change-up { color: #84cc16; }
.change-down { color: #f43f5e; }
.change-flat { color: #71717a; }
.pr-card.big3 { border-color: rgba(251,191,36,0.5) !important; box-shadow: 0 0 0 1px rgba(251,191,36,0.15); }
.pr-card.big7 { border-color: rgba(203,213,225,0.4) !important; }
.pr-card.big3:hover { border-color: var(--gold) !important; }
.pr-card.big7:hover { border-color: var(--silver) !important; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Inter", -apple-system, "SF Pro Display", "Pretendard", sans-serif;
  font-feature-settings: "cv02", "cv03", "cv04";
  padding: 24px; max-width: 1200px; margin: 0 auto;
  min-height: 100vh;
}
h1 { font-size: 26px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.03em; }
h2 { font-size: 19px; font-weight: 500; margin: 20px 0 12px; letter-spacing: -0.02em; }
h3 { font-size: 12px; font-weight: 500; color: var(--muted);
     text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.subtitle { color: var(--muted); margin-bottom: 16px; font-size: 13px; }

.lang-toggle {
  display: inline-flex; gap: 0; margin-left: auto;
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
.lang-btn {
  background: transparent; color: var(--muted);
  border: none; padding: 6px 12px; font-size: 11px;
  cursor: pointer; font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.1em; transition: all 0.1s;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active { background: var(--accent); color: var(--bg); font-weight: 600; }

.controls {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  padding: 14px 16px; border-radius: 8px; margin-bottom: 20px;
}
.controls label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
}
.controls select, .controls input[type="date"] {
  background: var(--card2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 13px;
  font-family: inherit;
}
.controls select:focus, .controls input:focus {
  outline: none; border-color: var(--accent);
}
.controls input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.7);
}

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
.grid { display: grid; gap: 12px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  body { padding: 14px !important; }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .controls { flex-wrap: wrap; gap: 8px; }
  .controls label { flex: 1 1 48%; min-width: 140px; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; }
  .stat-big { font-size: 22px !important; }
  .card { padding: 14px; border-radius: 12px; }
}
@media (max-width: 540px) {
  body { padding: 12px !important; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; }
  .stat-big { font-size: 22px !important; }
  .card { padding: 12px; }
  /* Touch targets ≥ 38px */
  button, .btn, .lang-btn, select, input[type="date"] { min-height: 38px; }
  .preset, .preset-btn { min-height: 38px; padding: 8px 12px !important; }
  .map-canvas { height: 360px !important; }
  /* Body-part chips wrap instead of horizontal scroll */
  .bp-chip { white-space: normal !important; }
}
@media (max-width: 380px) {
  .map-canvas { height: 280px !important; }
}
.stat-big {
  font-family: "JetBrains Mono", "SF Mono", monospace;
  font-size: 30px; font-weight: 500; letter-spacing: -0.04em;
  font-feature-settings: "tnum";
}
.stat-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.pill-run, .pill-lift, .label-mono {
  font-family: "JetBrains Mono", "SF Mono", monospace;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.pill-run {
  background: var(--run-dim); color: var(--run);
  padding: 2px 10px; border-radius: 10px; font-size: 10px;
}
.pill-lift {
  background: var(--lift-dim); color: var(--lift);
  padding: 2px 10px; border-radius: 10px; font-size: 10px;
}
.label-mono {
  color: var(--text); font-size: 11px; font-weight: 600;
  display: block; margin-bottom: 10px;
}

details.conventions-toggle {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 18px; margin-bottom: 14px;
}
details.conventions-toggle > summary {
  cursor: pointer; user-select: none; list-style: none;
  color: var(--muted); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; font-family: "JetBrains Mono", monospace;
  display: flex; align-items: center; justify-content: space-between;
}
details.conventions-toggle > summary::-webkit-details-marker { display: none; }
details.conventions-toggle > summary::after {
  content: "+"; font-size: 16px; transition: transform 0.2s;
}
details.conventions-toggle[open] > summary::after { content: "−"; }
details.conventions-toggle[open] > .conv-body { margin-top: 16px; }

/* === Option A: Body Part Progress Grid === */
.bp-progress-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
}
@media (max-width: 540px) { .bp-progress-grid { grid-template-columns: 1fr 1fr; } }
.bp-progress-card {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px; cursor: pointer;
  transition: border-color 0.15s;
}
.bp-progress-card:hover, .bp-progress-card:active { border-color: var(--accent); }
.bp-progress-card .bp-name {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.1em; margin-bottom: 4px;
}
.bp-progress-card .bp-trend {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
}
.bp-progress-card .bp-meta {
  color: var(--muted); font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
}
.sparkline {
  display: inline-flex; align-items: flex-end; gap: 1px; height: 14px;
}
.sparkline span { width: 4px; background: currentColor; border-radius: 1px; }

/* === Option C: Stalled PRs === */
.stalled-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.stalled-row:last-child { border-bottom: none; }
.stalled-stars { color: #fbbf24; font-size: 10px; min-width: 50px; font-family: 'JetBrains Mono', monospace; }
.stalled-name { flex: 1; font-weight: 500; }
.stalled-days {
  background: rgba(244,63,94,0.15); color: #f43f5e;
  padding: 2px 6px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; white-space: nowrap;
}
.stalled-rec {
  color: var(--muted); font-size: 11px;
  font-family: 'JetBrains Mono', monospace; white-space: nowrap;
}

/* === Option D: PR Timeline === */
.pr-timeline-row { margin-bottom: 16px; }
.pr-row-name {
  font-size: 12px; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.pr-timeline-bar {
  position: relative; height: 22px;
  background: var(--card2); border-radius: 6px;
  border: 1px solid var(--border);
}
.pr-event {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  transition: transform 0.15s;
  z-index: 2;
}
.pr-event:hover { transform: translate(-50%, -50%) scale(1.5); z-index: 5; }
.pr-event-label {
  position: absolute;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  white-space: nowrap; pointer-events: none;
  font-weight: 500;
}
.pr-axis {
  display: flex; justify-content: space-between;
  color: var(--muted); font-size: 9px; padding: 2px 0;
  font-family: 'JetBrains Mono', monospace;
}

/* === Exercise row dropdown (Plan view) === */
.exercise-details {
  max-height: 0; overflow: hidden;
  transition: max-height 0.25s ease-out, padding 0.25s ease-out;
  padding: 0 4px;
}
.exercise-details.open {
  max-height: 2000px;
  padding: 10px 4px 14px;
}

/* === Option E: Periodization === */
.period-bars {
  display: flex; align-items: flex-end; gap: 3px; height: 80px;
  padding: 8px 4px 4px;
}
.period-bar {
  flex: 1; background: var(--lift); border-radius: 2px 2px 0 0;
  opacity: 0.85; position: relative; min-height: 2px;
}
.period-bar.deload { background: #fbbf24; opacity: 0.45; }

.hcell { cursor: pointer; transition: stroke 0.1s; }
.hcell:hover { stroke: var(--text); stroke-width: 1.5; }
.hbar { cursor: pointer; transition: opacity 0.1s, stroke-width 0.1s; }
.hbar:hover { opacity: 1; stroke: var(--text); stroke-width: 1.5; }
.hdot { cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; display: inline-block; }
.hdot:hover { transform: scale(1.5); box-shadow: 0 0 0 2px var(--text); z-index: 5; position: relative; }

/* Horizontal scroll wrapper with right-edge fade hint */
.hscroll {
  position: relative;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) transparent;
}
.hscroll::-webkit-scrollbar { height: 6px; }
.hscroll::-webkit-scrollbar-track { background: transparent; }
.hscroll::-webkit-scrollbar-thumb {
  background: var(--accent); border-radius: 3px; opacity: 0.6;
}
.hscroll-wrap {
  position: relative;
}
.hscroll-wrap::after {
  /* Right-edge fade indicator (only on mobile) — disappears when scrolled to end */
  content: "";
  position: absolute; right: 0; top: 0; bottom: 6px;
  width: 28px; pointer-events: none;
  background: linear-gradient(to right, transparent, var(--card));
  opacity: 0; transition: opacity 0.2s;
}
@media (max-width: 768px) {
  .hscroll-wrap::after { opacity: 1; }
  .hscroll-wrap.scrolled-end::after { opacity: 0; }
  /* Add right padding to inner scroll so last cells aren't hidden under the fade */
  .hscroll { padding-right: 32px; }
}
.scroll-hint {
  display: none;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted);
  letter-spacing: 0.1em; margin-top: 4px; text-align: center;
}
/* Dot grid track width: 1fr (auto-fit) on desktop, fixed 14px on mobile so it forces horizontal scroll */
:root { --dot-track: 1fr; }
@media (max-width: 768px) {
  .scroll-hint { display: block; }
  :root { --dot-track: 14px; }
  .dot-grid { width: max-content; }
}

@keyframes streakWave {
  0%   { box-shadow: 0 0 0 0 rgba(255, 26, 140, 0.55); }
  100% { box-shadow: 0 0 0 14px rgba(255, 26, 140, 0); }
}
.hdot.streak { animation: streakWave 3.5s ease-out infinite; }
.hdot.streak:hover { animation: none; }

#hovertip {
  position: fixed; pointer-events: none; opacity: 0;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; font-size: 13px; color: var(--text); z-index: 1000;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: opacity 0.1s;
  font-family: inherit; line-height: 1.4;
}

#customRange { display: flex; gap: 10px; }
#customRange.disabled { opacity: 0.5; pointer-events: none; }

.footer {
  margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 11px; text-align: center;
}

/* VO2 tier colors */
:root {
  --vo2-low: #ef4444; --vo2-below: #f59e0b;
  --vo2-above: #84cc16; --vo2-high: #22d3ee;
}

/* Body part filter chips */
.bp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.bp-chip {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 6px 12px; border-radius: 6px;
  font-size: 11px; font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.1em; cursor: pointer; transition: all 0.1s;
}
.bp-chip:hover { color: var(--text); border-color: var(--c, var(--text)); }
.bp-chip.active {
  background: var(--c, var(--text)); color: var(--bg);
  border-color: var(--c, var(--text)); font-weight: 600;
}
.bp-summary-card:hover { border-color: var(--accent) !important; }
.pr-card:hover { border-color: var(--accent) !important; }

/* Lift detail modal */
#lift-modal, #progression-modal, #bp-modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: none; z-index: 2000;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  align-items: flex-start; justify-content: center;
  padding: 60px 20px 20px 20px; overflow-y: auto;
}
#lift-modal.open, #progression-modal.open, #bp-modal.open { display: flex; }
#lift-modal .modal-card, #progression-modal .modal-card, #bp-modal .modal-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; max-width: 560px; width: 100%;
  padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#lift-modal .modal-header, #progression-modal .modal-header, #bp-modal .modal-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 4px;
}
#lift-modal h2, #progression-modal h2, #bp-modal h2 { margin-top: 6px; font-size: 20px; }
#lift-modal .modal-close, #progression-modal .modal-close, #bp-modal .modal-close {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-size: 18px; cursor: pointer; width: 36px; height: 36px;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
}
#lift-modal .modal-close, #progression-modal .modal-close, #bp-modal .modal-close:hover { color: var(--text); border-color: var(--accent); }
#lift-modal .modal-nav-btn, #progression-modal .modal-nav-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  font-size: 22px; cursor: pointer; width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; padding: 0; line-height: 1;
}
#lift-modal .modal-nav-btn, #progression-modal .modal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
#lift-modal .modal-nav-btn, #progression-modal .modal-nav-btn.disabled { opacity: 0.3; cursor: default; }
#lift-modal .modal-stats, #progression-modal .modal-stats, #bp-modal .modal-stats {
  color: var(--muted); font-size: 12px; padding: 8px 0 14px 0;
  border-bottom: 1px solid var(--border); margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
}
#lift-modal .exercise-block { margin-bottom: 16px; }
#lift-modal .exercise-name {
  color: var(--text); font-size: 13px; font-weight: 600;
  margin-bottom: 6px; letter-spacing: 0.02em;
}
#lift-modal .set-list {
  list-style: none; padding-left: 0; margin: 0;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--muted); counter-reset: setc;
}
#lift-modal .set-list li {
  padding: 3px 0 3px 24px; position: relative;
  counter-increment: setc;
}
#lift-modal .set-list li::before {
  content: counter(setc); position: absolute; left: 0;
  color: var(--lift); font-weight: 600;
}

/* Leaflet dark tweaks */
.leaflet-container { background: #0a0a0a !important; }
.leaflet-tooltip {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
}
.leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
  border-top-color: var(--border) !important;
}
.leaflet-control-attribution {
  background: rgba(0,0,0,0.5) !important; color: var(--muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a {
  background-color: var(--card) !important; color: var(--text) !important;
  border-color: var(--border) !important;
}
.leaflet-bar a:hover { background-color: var(--card2) !important; }

/* PR Exercise Search */
.ex-search-wrap { position: relative; }
.ex-search-input {
  width: 100%;
  background: var(--card); color: var(--text);
  border: 1px solid var(--lift); border-radius: 10px;
  padding: 12px 40px 12px 14px;
  font-size: 14px; font-family: -apple-system, sans-serif;
  outline: none;
}
.ex-search-input:focus { box-shadow: 0 0 0 3px rgba(255,26,140,0.15); }
.ex-search-input::placeholder { color: var(--muted); }
.ex-search-icon {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  color: var(--lift); font-size: 14px;
  user-select: none;
}
.ex-search-icon.clickable { cursor: pointer; }
.ex-search-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; max-height: 340px; overflow-y: auto;
  z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.ex-search-item {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-size: 13px;
}
.ex-search-item:hover, .ex-search-item.active { background: var(--card2); }
.ex-search-item:last-child { border-bottom: none; }
.ex-search-item .name { flex: 1; min-width: 0; }
.ex-search-item .name .match { color: var(--lift); font-weight: 600; }
.ex-search-item .meta {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
  white-space: nowrap;
}
.detail-title {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.detail-title .name {
  font-size: 18px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.detail-metrics {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px;
}
.metric-tile {
  background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px;
}
.metric-tile .lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.metric-tile .val { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--lift); font-weight: 600; margin-top: 4px; word-break: break-word; }
.metric-tile .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
@media (max-width: 560px) {
  .detail-metrics { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div style="background:#fbbf24; color:#000; padding:10px 14px; font-family:'JetBrains Mono', monospace; font-size:12px; text-align:center; border-radius:6px; margin-bottom:12px; line-height:1.5;">
      <b>📊 DEMO</b> — synthetic data only, no personal metrics.<br>
      This is a public preview of the dashboard's UI and features.
    </div>
<div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; gap:8px; flex-wrap:wrap;">
  <h1 data-i18n="title">운동 대시보드</h1>
  <div style="display:flex; align-items:center; gap:8px;">
    
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="ko">KO</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</div>
<p class="subtitle">78 runs · 2132 lift sets · 2026-08-30</p>

<div class="controls">
  <label><span data-i18n="view">보기</span>
    <select id="viewSelect">
      <option value="heatmap">Heatmap</option>

  const sod = (d) => { const r = new Date(d); r.setHours(0,0,0,0); return r; };
  switch(rangeKey) {

  }
  return [addDays(today, -365), today];
}

function inRange(dateStr, start, end) {
  const d = parseDateOnly(dateStr);
  return d >= start && d <= end;
}

// === Aggregation ===
function aggregate(runs, lifts, start, end) {
  const filteredRuns = runs.filter(r => inRange(r.date, start, end));
  const filteredLifts = lifts.filter(l => inRange(l.date, start, end));

  // Group runs by date for session-based counting (gap > 3h = separate session)
  const SESSION_GAP_MS = 3 * 3600 * 1000;
  const runsByDate = {};
  for (const r of filteredRuns) {
    const d = dateOnly(r.date);
    if (!runsByDate[d]) runsByDate[d] = [];
    runsByDate[d].push(r);
  }
  const runByDay = {};
  for (const [d, rs] of Object.entries(runsByDate)) {
    const sorted = rs.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    let sessions = 0, lastTime = null, dist = 0, dur = 0;
    for (const r of sorted) {
      const t = new Date(r.date);
      if (lastTime === null || (t - lastTime) > SESSION_GAP_MS) sessions++;
      lastTime = t;
      dist += r.distance || 0;
      dur += r.duration || 0;
    }
    runByDay[d] = {count: sessions, distance: dist, duration: dur};
  }

  const liftByDay = {};
  for (const l of filteredLifts) {
    const d = dateOnly(l.date);
    if (!liftByDay[d]) liftByDay[d] = {sets:0, volume:0, exercises:new Set()};
    liftByDay[d].sets++;
    liftByDay[d].volume += (l.weight || 0) * (l.reps || 0);
    if (l.exercise) liftByDay[d].exercises.add(l.exercise);
  }

  const runByMonth = {}, liftByMonth = {};
  // Monthly run counts: roll up session-deduped daily counts
  for (const [d, dayData] of Object.entries(runByDay)) {
    const ym = d.slice(0,7);
    if (!runByMonth[ym]) runByMonth[ym] = {count:0, distance:0, duration:0};
    runByMonth[ym].count += dayData.count;
    runByMonth[ym].distance += dayData.distance;
    runByMonth[ym].duration += dayData.duration;
  }
  for (const l of filteredLifts) {
    const ym = l.date.slice(0,7);
    if (!liftByMonth[ym]) liftByMonth[ym] = {sets:0, volume:0, sessions: new Set()};
    liftByMonth[ym].sets++;
    liftByMonth[ym].volume += (l.weight || 0) * (l.reps || 0);
    liftByMonth[ym].sessions.add(dateOnly(l.date));
  }
  for (const v of Object.values(liftByMonth)) v.sessions = v.sessions.size;

  // PRs
  const prByExercise = {};
  for (const l of filteredLifts) {
    if (!l.exercise) continue;
    if (!prByExercise[l.exercise]) prByExercise[l.exercise] = {maxWeight:0, maxDate:"", sessions:new Set()};
    const e = prByExercise[l.exercise];
    if ((l.weight || 0) > e.maxWeight) {
      e.maxWeight = l.weight || 0;
      e.maxDate = dateOnly(l.date);
    }
    e.sessions.add(dateOnly(l.date));
  }
  for (const v of Object.values(prByExercise)) v.sessions = v.sessions.size;

  // Streak
  const allDates = Array.from(new Set([...Object.keys(runByDay), ...Object.keys(liftByDay)])).sort();
  let currentStreak = 0;
  if (allDates.length) {
    const today = new Date();
    let d = new Date(today);
    const set = new Set(allDates);
    while (set.has(isoDate(d))) {
      currentStreak++;
      d = addDays(d, -1);
    }
    if (currentStreak === 0 && set.has(isoDate(addDays(today, -1)))) {
      d = addDays(today, -1);
      while (set.has(isoDate(d))) { currentStreak++; d = addDays(d, -1); }
    }
  }
  let bestStreak = 0, cur = 0, prev = null;
  for (const ds of allDates) {
    const d = parseDateOnly(ds);
    if (prev == null || (d - prev) === 86400000) cur++;
    else cur = 1;
    if (cur > bestStreak) bestStreak = cur;
    prev = d;
  }

  // Totals
  let totalDist=0, totalDur=0, totalCal=0;
  for (const r of filteredRuns) {
    totalDist += r.distance || 0;
    totalDur += r.duration || 0;
    totalCal += r.calories || 0;
  }
  let totalSets=0, totalVol=0;
  for (const l of filteredLifts) {
    totalSets++;
    totalVol += (l.weight || 0) * (l.reps || 0);
  }

  return {
    runByDay, liftByDay, runByMonth, liftByMonth, prByExercise,
    currentStreak, bestStreak,
    totalsRun: {count: Object.values(runByDay).reduce((s, d) => s + d.count, 0), distance: totalDist, duration: totalDur, calories: totalCal},
    totalsLift: {sets: totalSets, volume: totalVol, sessions: Object.keys(liftByDay).length},
    rangeStart: start, rangeEnd: end,
    runDays: Object.keys(runByDay).length,
    liftDays: Object.keys(liftByDay).length,
  };
}

// === View: Heatmap ===
function renderHeatmap(agg) {
  const start = agg.rangeStart, end = agg.rangeEnd;
  const days = Math.floor((end - start) / 86400000) + 1;
  const useYearStack = days > 400;
  const cell = 14, gap = 3;

  function buildOneRange(rangeStart, rangeEnd, byDay, color, kind, valueKey, maxVal) {
    let s = new Date(rangeStart);
    while (s.getDay() !== 1) s = addDays(s, -1); // Monday-start
    const cols = Math.ceil(((rangeEnd - s) / 86400000 + 1) / 7);
    const labelW = 16;
    const w = labelW + cols * (cell + gap);
    const h = 7 * (cell + gap) + 20;

    // Weekday labels (MTWTFSS) on the left
    const weekdayChars = ["M","T","W","T","F","S","S"];
    const wdayLabels = weekdayChars.map((ch, idx) =>
      `<text x="0" y="${idx*(cell+gap)+16+cell*0.75}" fill="${COLORS.muted}" font-size="9" font-family="JetBrains Mono, SF Mono, monospace" letter-spacing="0">${ch}</text>`
    ).join("");

    const rects = [];
    const monthLabels = [];
    let cur = new Date(s);
    let lastMonth = -1;
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < 7; r++) {
        if (cur > rangeEnd) { cur = addDays(cur, 1); continue; }
        if (cur < rangeStart) { cur = addDays(cur, 1); continue; }
        const iso = isoDate(cur);
        const data = byDay[iso] || {};
        const val = data[valueKey] || 0;
        let fillColor = "rgba(255,255,255,0.04)";
        let opacity = 1;
        if (val > 0) {
          fillColor = color;
          opacity = 0.3 + 0.7 * Math.min(val / maxVal, 1);
        }
        const wd = WEEKDAYS[cur.getDay() === 0 ? 6 : cur.getDay()-1];
        let primary, secondary;
        if (kind === "run") {
          primary = data.distance ? `${data.distance.toFixed(2)} km` : t("noRun");
          if (val > 0) {
            const dayPace = data.distance > 0 ? data.duration / data.distance : 0;
            secondary = `${data.count} ${t("runsUnit")} · ${Math.round(data.duration)} ${t("minUnit")} · ${fmtPace(dayPace)}`;
          } else { secondary = ""; }
        } else {
          primary = data.sets ? `${data.sets} ${t("setsUnit")}` : t("noLift");
          secondary = val > 0 ? `${num(data.volume, 0)} ${t("kgVolume")}` : "";
        }
        // Compute body part breakdown for lift cells (used by tooltip + click modal)
        let bodyParts = null;
        if (kind === "lift" && val > 0) {
          const dayLifts = (DATA.lifts || []).filter(l => dateOnly(l.date) === iso);
          const bpMap = new Map();
          for (const l of dayLifts) {
            const bp = bodyPart(l.exercise || "");
            const sub = subBodyPart(l.exercise || "", bp);
            if (!bpMap.has(bp)) bpMap.set(bp, {sets: 0, subs: new Map()});
            const e = bpMap.get(bp);
            e.sets++;
            if (sub) e.subs.set(sub, (e.subs.get(sub) || 0) + 1);
          }
          bodyParts = [...bpMap.entries()].sort((a,b) => b[1].sets - a[1].sets).map(([bp, info]) => ({
            bp, sets: info.sets,
            subs: [...info.subs.entries()].sort((a,b) => b[1]-a[1]).map(([s,c]) => ({sub:s, sets:c})),
          }));
        }
        const payloadObj = {date: `${iso} (${wd})`, primary, secondary};
        if (bodyParts) payloadObj.bodyParts = bodyParts;
        const payload = JSON.stringify(payloadObj).replace(/"/g, "&quot;");
        const liftAttr = (kind === "lift" && val > 0) ? ` data-lift-date="${iso}"` : "";
        rects.push(`<rect x="${labelW + c*(cell+gap)}" y="${r*(cell+gap)+16}" width="${cell}" height="${cell}" rx="3" fill="${fillColor}" opacity="${opacity.toFixed(2)}" class="hcell" data-payload="${payload}"${liftAttr}></rect>`);
        cur = addDays(cur, 1);
      }
      // month label
      if (cur <= rangeEnd && cur.getMonth() !== lastMonth && cur.getDate() <= 7) {
        monthLabels.push(`<text x="${labelW + c*(cell+gap)}" y="12" fill="${COLORS.muted}" font-size="10">${MONTH_NAMES[cur.getMonth()]}</text>`);
        lastMonth = cur.getMonth();
      }
    }
    return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${wdayLabels}${monthLabels.join("")}${rects.join("")}</svg>`;
  }

  function buildHeatmap(byDay, color, kind, valueKey, minStart) {
    const vals = Object.values(byDay).map(d => d[valueKey] || 0);
    const maxVal = Math.max(1, ...vals);
    const effStart = (minStart && minStart > start) ? minStart : start;
    if (effStart > end) return `<div style="color:var(--muted); font-size:12px; padding:12px;">${t("noData")}</div>`;
    const effUseYearStack = (end - effStart) / 86400000 > 400;
    if (effUseYearStack) {
      const startYear = effStart.getFullYear();
      const endYear = end.getFullYear();
      const out = [];
      for (let y = endYear; y >= startYear; y--) {
        const ys = new Date(Math.max(effStart, new Date(y, 0, 1)));
        const ye = new Date(Math.min(end, new Date(y, 11, 31, 23, 59, 59)));
        out.push(`<div style="margin-bottom:6px;"><div style="color:var(--muted); font-size:11px; margin-bottom:4px;">${y}</div>${buildOneRange(ys, ye, byDay, color, kind, valueKey, maxVal)}</div>`);
      }
      return out.join("");
    }
    return buildOneRange(effStart, end, byDay, color, kind, valueKey, maxVal);
  }

  const tr = agg.totalsRun, tl = agg.totalsLift;

  // Stats cards (merged from Habit view)
  const today = new Date(); today.setHours(23,59,59,999);
  // Last 7 days = yesterday backward (today excluded since may not be done yet)
  let week_done = 0;
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today, -i);
    if (d < start) break;
    const iso = isoDate(d);
    if ((agg.runByDay[iso] && agg.runByDay[iso].count > 0) || (agg.liftByDay[iso] && agg.liftByDay[iso].sets > 0)) week_done++;
  }
  const cleanDaysDone = new Set([...Object.keys(agg.runByDay), ...Object.keys(agg.liftByDay)]).size;
  const consistency = ((cleanDaysDone / Math.max(days,1)) * 100).toFixed(0);

  // Compute streak dates (most recent N consecutive activity days, oldest→newest)
  const streakDates = new Set();
  if (agg.currentStreak > 0) {
    const allActDates = new Set([...Object.keys(agg.runByDay), ...Object.keys(agg.liftByDay)]);
    let endD = new Date(today);
    if (!allActDates.has(isoDate(endD)) && allActDates.has(isoDate(addDays(endD, -1)))) {
      endD = addDays(endD, -1);
    }
    for (let k = 0; k < agg.currentStreak; k++) {
      streakDates.add(isoDate(addDays(endD, -k)));
    }
  }
  const streakIdxMap = new Map([...streakDates].sort().map((d, i) => [d, i]));
  const streakSize = streakIdxMap.size;

  // Combined activity dot grid (merged from Habit)
  const dotsHtml = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    if (d > end) break;
    const iso = isoDate(d);
    const wd = WEEKDAYS[d.getDay() === 0 ? 6 : d.getDay()-1];
    const r = agg.runByDay[iso], l = agg.liftByDay[iso];
    const hasR = r && r.count > 0, hasL = l && l.sets > 0;
    let color, primary, secondary;
    let extraStyle = "";
    if (hasR && hasL) {
      color = COLORS.lift; primary = t("runPlus");
      secondary = `${r.distance.toFixed(1)} km · ${l.sets} ${t("setsUnit")} (${num(l.volume, 0)} kg)`;
      extraStyle = "box-shadow: 0 0 0 2px var(--text);";
    } else if (hasR) {
      color = COLORS.run; primary = `${r.distance.toFixed(2)} km`;
      secondary = `${r.count} ${t("runsUnit")} · ${Math.round(r.duration)} ${t("minUnit")}`;
    } else if (hasL) {
      color = COLORS.lift; primary = `${l.sets} ${t("setsUnit")}`;
      secondary = `${num(l.volume, 0)} ${t("kgVolume")}`;
    } else {
      color = "rgba(255,255,255,0.04)"; primary = t("restDay"); secondary = "";
    }
    const payload = JSON.stringify({date: `${iso} (${wd})`, primary, secondary}).replace(/"/g, "&quot;");
    const liftAttr = hasL ? ` data-lift-date="${iso}"` : "";
    const inStreak = streakDates.has(iso);
    const streakCls = inStreak ? " streak" : "";
    const streakDelay = inStreak && streakSize > 1
      ? `animation-delay: ${Math.floor((streakIdxMap.get(iso) / (streakSize - 1)) * 3000)}ms;`
      : "";
    dotsHtml.push(`<div class="hdot${streakCls}" data-payload="${payload}"${liftAttr} style="width:14px; height:14px; border-radius:50%; background:${color}; ${extraStyle} ${streakDelay}"></div>`);
  }
  const cols = Math.min(53, Math.max(7, Math.ceil(Math.sqrt(days * 1.5))));

  return `
    <div class="grid grid-3">
      <div class="card"><h3>${t("currentStreak")}</h3><div class="stat-big" style="color:var(--accent);">${agg.currentStreak}<span style="font-size:14px; color:var(--muted)"> ${t("daysShort")}</span></div><div class="stat-label">${t("consecutive")}</div></div>
      <div class="card"><h3>${t("bestStreak")}</h3><div class="stat-big">${agg.bestStreak}<span style="font-size:14px; color:var(--muted)"> ${t("daysShort")}</span></div><div class="stat-label">${t("longest")}</div></div>
      <div class="card"><h3>${t("last7days")}</h3><div class="stat-big">${week_done}<span style="font-size:14px; color:var(--muted)"> / 7</span></div><div class="stat-label">${t("recent")}</div></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
        <h2 style="margin:0;">Dashboard <span style="color:var(--muted); font-weight:400; font-size:13px; font-family:'JetBrains Mono', monospace; margin-left:4px;">${days} days</span></h2>
        <p style="color:var(--muted); font-size:11px; margin:0; font-family:'JetBrains Mono', monospace;">
          consistency <span style="color:var(--accent);">${consistency}%</span> (${cleanDaysDone}/${days})
        </p>
      </div>
      <p style="color:var(--muted); font-size:11px; margin-bottom:10px; font-family:'JetBrains Mono', monospace;">
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.run};border-radius:50%;margin-right:4px;vertical-align:middle;"></span> Running
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.lift};border-radius:50%;margin:0 4px 0 12px;vertical-align:middle;"></span> Lifting
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.lift};border-radius:50%;box-shadow:0 0 0 2px var(--text);margin:0 4px 0 14px;vertical-align:middle;"></span> Both
      </p>
      <div class="hscroll-wrap"><div class="hscroll"><div class="dot-grid" style="display:grid; grid-template-columns:repeat(${cols}, var(--dot-track,1fr)); gap:3px;">${dotsHtml.join("")}</div></div></div>
      <div class="scroll-hint">&larr; swipe to see more &rarr;</div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
        <div><span class="pill-run">RUNNING</span><span style="color:var(--muted); font-size:11px; margin-left:8px; font-family: 'JetBrains Mono', monospace;">since ${RUN_TRACKED_SINCE}</span><h2 style="margin-top:4px;">${t("intensityHeatmap")}</h2></div>
        <div style="text-align:right;">
          <div class="stat-big" style="font-size:26px; color:var(--run);">${tr.distance.toFixed(0)}<span style="font-size:14px; color:var(--muted)"> km</span></div>
          <div class="stat-label">${tr.count} ${t("runsUnit")} · ${num(tr.duration, 0)} ${t("minUnit")}</div>
        </div>
      </div>
      <div class="hscroll-wrap"><div class="hscroll">${buildHeatmap(agg.runByDay, COLORS.run, "run", "distance", parseDateOnly(RUN_TRACKED_SINCE))}</div></div>
      <div class="scroll-hint">&larr; swipe to see more &rarr;</div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
        <div><span class="pill-lift">LIFTING</span><span style="color:var(--muted); font-size:11px; margin-left:8px; font-family: 'JetBrains Mono', monospace;">since ${LIFT_TRACKED_SINCE}</span><h2 style="margin-top:4px;">${t("intensityHeatmap")}</h2></div>
        <div style="text-align:right;">
          <div class="stat-big" style="font-size:26px; color:var(--lift);">${tl.sessions}<span style="font-size:14px; color:var(--muted)"> ${t("sessions").toLowerCase()}</span></div>
          <div class="stat-label">${tl.sets} ${t("setsUnit")} · ${num(tl.volume, 0)} kg</div>
        </div>
      </div>
      <div class="hscroll-wrap"><div class="hscroll">${buildHeatmap(agg.liftByDay, COLORS.lift, "lift", "sets")}</div></div>
      <div class="scroll-hint">&larr; swipe to see more &rarr;</div>
    </div>`;
}

// === View: Strava ===
function renderStrava(agg) {
  const tr = agg.totalsRun, tl = agg.totalsLift;
  const days = Math.floor((agg.rangeEnd - agg.rangeStart) / 86400000) + 1;
  const monthsR = Object.keys(agg.runByMonth).sort().slice(-12);
  const monthsL = Object.keys(agg.liftByMonth).sort().slice(-12);
  const cw = 800, ch = 180;

  function bars(months, byMonth, color, kind) {
    if (!months.length) return `<p style="color:var(--muted)">${t("noData")}</p>`;
    const maxV = Math.max(1, ...months.map(m => kind==="run" ? byMonth[m].distance : byMonth[m].volume));
    const out = [];
    months.forEach((m, i) => {
      const md = byMonth[m];
      const v = kind==="run" ? md.distance : md.volume;
      const x = (i + 0.5) * (cw / months.length);
      const bw = (cw / months.length) * 0.6;
      const bx = x - bw / 2;
      const by = ch - 20 - (v / maxV) * (ch - 50);
      const bh = (v / maxV) * (ch - 50);
      const primary = kind === "run" ? `${v.toFixed(1)} km` : `${num(v, 0)} kg volume`;
      const secondary = kind === "run" ? `${md.count} runs · ${Math.round(md.duration)} min` : `${md.sets} sets · ${md.sessions} sessions`;
      const payload = JSON.stringify({date: m, primary, secondary}).replace(/"/g, "&quot;");
      out.push(`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" opacity="0.7" rx="2" class="hbar" data-payload="${payload}"></rect>`);
      out.push(`<text x="${x.toFixed(1)}" y="${ch-4}" fill="${COLORS.muted}" font-size="10" text-anchor="middle">${m.slice(5)}</text>`);
    });
    return `<svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
  }

  return `
    <h2><span class="pill-run">RUNNING</span> ${t("periodTotal")}</h2>
    <div class="grid grid-3">
      <div class="card"><h3>${t("distance")}</h3><div class="stat-big">${tr.distance.toFixed(1)}<span style="font-size:14px; color:var(--muted)"> km</span></div><div class="stat-label">${days}${t("periodDays")}</div></div>
      <div class="card"><h3>${t("runCount")}</h3><div class="stat-big">${tr.count}</div><div class="stat-label">${num(tr.duration, 0)} ${t("minUnit")}</div></div>
      <div class="card"><h3>${t("totalCalories")}</h3><div class="stat-big">${num(tr.calories, 0)}<span style="font-size:14px; color:var(--muted)"> kcal</span></div><div class="stat-label">${tr.count > 0 ? (tr.calories/tr.count).toFixed(0) : 0} kcal/run</div></div>
    </div>
    <div class="card"><h3>${t("monthlyDistance")}</h3>${bars(monthsR, agg.runByMonth, COLORS.run, "run")}</div>

    <h2><span class="pill-lift">LIFTING</span> ${t("periodTotal")}</h2>
    <div class="grid grid-3">
      <div class="card"><h3>${t("volume")}</h3><div class="stat-big">${num(tl.volume, 0)}<span style="font-size:14px; color:var(--muted)"> kg</span></div></div>
      <div class="card"><h3>${t("sessions")}</h3><div class="stat-big">${tl.sessions}</div></div>
      <div class="card"><h3>${t("totalSets")}</h3><div class="stat-big">${tl.sets}</div></div>
    </div>
    <div class="card"><h3>${t("monthlyVolume")}</h3>${bars(monthsL, agg.liftByMonth, COLORS.lift, "lift")}</div>`;
}

// === View: Hevy ===
// Body part inference (order matters — first match wins)
const BODY_PART_RULES = [
  // CORE first (so "leg raise" / "hip raise" don't get caught by LEGS)
  [/plank|wheel rollout|knee touch|heel touch|knee up|mountain climb|hollow hold|crunch|dead bug|hanging leg raise|captain.?s chair|lying leg hip raise|^abs|bicycle|air bike/i, "CORE"],
  // LEGS — RDL/stiff-leg variants explicit so they don't fall into BACK via 'deadlift'
  [/squat|lunge|leg curl|leg extension|hamstring|hip thrust|hip abductor|hip adductor|thigh adductor|thigh abductor|calf|^deadlift|leg press|^lunge|romanian|stiff.?leg/i, "LEGS"],
  // SHOULDERS pre-match (must come BEFORE BACK 'row' pattern so rear-delt-style rows → SHOULDERS, not BACK)
  [/upright row|rear delt/i, "SHOULDERS"],
  // BACK — shrug/RMPT/rack pull + lower back extension + traditional back
  [/shrug|rmpt|rack pull|back extension|hyperextension/i, "BACK"],
  [/pull.?up|chin.?up|pulldown|^row|row$| row | row,|\blat |t.?bar|deadlift/i, "BACK"],
  // SHOULDERS (added face pull, front raise, external rotation)
  [/lateral raise|rear delt|overhead press|behind neck|y.?raise|arnold|upright row|shoulder press|face pull|front raise|external rotation|reverse fly/i, "SHOULDERS"],
  // ARMS (added pushdown for Reverse Grip Pushdown)
  [/tricep|bicep|hammer curl|kickback|preacher|pushdown/i, "ARMS"],
  // CHEST (added dips, cable squeeze, all fly variants)
  [/bench press|push up|chest|\bfly\b|crossover|decline press|incline.*press|chest.*press|^dip|^dips|cable dip|machine.*dip|assisted.*dip|cable squeeze|pullover/i, "CHEST"],
  // Fallback
  [/curl|extension/i, "ARMS"],
];
const BP_COLORS = {
  CHEST: "#FF1A8C", BACK: "#22d3ee", ARMS: "#a855f7",
  SHOULDERS: "#f59e0b", LEGS: "#84cc16", CORE: "#ec4899", OTHER: "#71717a",
};
// Sub-part classification within primary body part
const SUB_PART_RULES = {
  SHOULDERS: [
    [/face pull|rear delt|reverse fly|upright row/i, "REAR"],
    [/lateral raise|side raise/i, "LATERAL"],
    [/overhead press|shoulder press|behind neck|y.?raise|front raise|^ohp|arnold|military/i, "FRONT"],
  ],
  BACK: [
    [/shrug|rmpt|rack pull|^deadlift|conventional deadlift|sumo deadlift/i, "THICKNESS"],
    [/straight.?arm pulldown|straight.?arm lat/i, "WIDTH"],
    [/iso.?lateral row|low row|lever low|underhand.*row|cable row.*low|^bb row|barbell row|seated row|bent.?over row|pendlay/i, "LOWER"],
    [/pull.?up|chin.?up|pulldown|wide.*grip|lat.*pulldown/i, "WIDTH"],
    [/^row|t.?bar/i, "THICKNESS"],
  ],
  CHEST: [
    [/incline/i, "UPPER"],
    [/decline|^dip|^dips|cable dip|machine.*dip|assisted.*dip/i, "LOWER"],
    [/bench press|flat|push up|push.?up|fly|crossover|chest press|squeeze|pullover|cable squeeze/i, "MID"],
  ],
  LEGS: [
    [/hip thrust|hip abductor|hip adductor|thigh adductor|thigh abductor|glute|bulgarian|split squat/i, "GLUTES"],
    [/leg curl|romanian|^rdl|stiff.?leg|hamstring/i, "HAMS"],
    [/calf/i, "CALVES"],
    [/squat|lunge|leg extension|leg press/i, "QUADS"],
  ],
  ARMS: [
    [/reverse curl|brachio|wrist|forearm/i, "FOREARM"],
    [/tricep|kickback|pushdown|skull|^extension|tricep extension/i, "TRICEPS"],
    [/bicep|curl|hammer|preacher/i, "BICEPS"],
  ],
};
const SUB_COLORS = {
  "SHOULDERS/LATERAL": "#f59e0b", "SHOULDERS/FRONT": "#fbbf24", "SHOULDERS/REAR": "#d97706",
  "BACK/WIDTH": "#22d3ee", "BACK/THICKNESS": "#0891b2", "BACK/LOWER": "#155e75",
  "CHEST/UPPER": "#FF1A8C", "CHEST/MID": "#ec4899", "CHEST/LOWER": "#be185d",
  "LEGS/GLUTES": "#a3e635", "LEGS/HAMS": "#84cc16", "LEGS/QUADS": "#65a30d", "LEGS/CALVES": "#4d7c0f",
  "ARMS/BICEPS": "#c084fc", "ARMS/TRICEPS": "#a855f7", "ARMS/FOREARM": "#7e22ce",
};
function bodyPart(name) {
  if (!name) return "OTHER";
  for (const [r, p] of BODY_PART_RULES) if (r.test(name)) return p;
  return "OTHER";
}
function subBodyPart(name, primary) {
  if (!name || !primary || !SUB_PART_RULES[primary]) return null;
  for (const [r, sub] of SUB_PART_RULES[primary]) if (r.test(name)) return sub;
  return null;
}
function subColor(primary, sub) {
  if (sub && SUB_COLORS[primary + "/" + sub]) return SUB_COLORS[primary + "/" + sub];
  return BP_COLORS[primary] || BP_COLORS.OTHER;
}

function setBpFilter(bp) {
  // bp can be "ALL" / "BIG3" / "BIG7" / "<PRIMARY>" / "<PRIMARY>/<SUB>"
  const isSub = bp && bp.includes("/");
  const primary = isSub ? bp.split("/")[0] : bp;
  const sub = isSub ? bp.split("/")[1] : null;

  document.querySelectorAll(".bp-chip").forEach(b => b.classList.toggle("active", b.dataset.bp === bp));

  // Show/hide sub-chip row for currently selected primary
  document.querySelectorAll(".sub-chip-row").forEach(row => {
    row.style.display = row.dataset.parent === primary ? "flex" : "none";
  });

  document.querySelectorAll(".pr-card").forEach(c => {
    let show;
    if (bp === "ALL") show = true;
    else if (bp === "BIG3") show = c.dataset.isbig3 === "true";
    else if (bp === "BIG7") show = c.dataset.isbig7 === "true";
    else if (isSub) show = c.dataset.bp === primary && c.dataset.sub === sub;
    else show = c.dataset.bp === primary;
    c.style.display = show ? "" : "none";
  });
}

function showExerciseModal(name) {
  const lifts = (DATA.lifts || []).filter(l => l.exercise === name);
  if (lifts.length === 0) return;
  // Sort by date asc, then by order
  lifts.sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.order ?? 0) - (b.order ?? 0);
  });
  const sessions = new Set(lifts.map(l => dateOnly(l.date)));
  let totalVol = 0, maxW = 0, maxDate = "";
  for (const l of lifts) {
    const v = (l.weight || 0) * (l.reps || 0);
    totalVol += v;
    if ((l.weight || 0) > maxW) { maxW = l.weight || 0; maxDate = dateOnly(l.date); }
  }
  const bp = bodyPart(name);
  const c = BP_COLORS[bp];

  // Build PR progression: max weight per session
  const byDate = new Map();
  for (const l of lifts) {
    const d = dateOnly(l.date);
    if (!byDate.has(d) || (l.weight || 0) > byDate.get(d)) byDate.set(d, l.weight || 0);
  }
  const progression = [...byDate.entries()].sort((a,b) => a[0].localeCompare(b[0]));

  // Mini progression chart (SVG)
  let chartHtml = "";
  if (progression.length >= 2) {
    const w = 480, h = 100, padX = 30, padY = 15;
    const minV = 0;
    const maxV = Math.max(...progression.map(p => p[1]), 1);
    const minT = parseDateOnly(progression[0][0]).getTime();
    const maxT = parseDateOnly(progression[progression.length - 1][0]).getTime();
    const tRng = maxT - minT || 1;
    const xS = t => padX + (t - minT) / tRng * (w - 2 * padX);
    const yS = v => h - padY - v / maxV * (h - 2 * padY);
    const pts = progression.map(([d, v]) => `${xS(parseDateOnly(d).getTime()).toFixed(1)},${yS(v).toFixed(1)}`).join(" L");
    const dots = progression.map(([d, v]) => `<circle cx="${xS(parseDateOnly(d).getTime()).toFixed(1)}" cy="${yS(v).toFixed(1)}" r="2.5" fill="${c}"/>`).join("");
    chartHtml = `
      <div style="margin: 12px 0 8px 0;">
        <div style="color: var(--muted); font-size: 11px; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace;">PR PROGRESSION</div>
        <svg width="${w}" height="${h}">
          <text x="0" y="${padY+4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">${maxV.toFixed(0)}</text>
          <text x="0" y="${h-padY+4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">0</text>
          <path d="M${pts}" stroke="${c}" stroke-width="1.5" fill="none"/>
          ${dots}
          <text x="${padX}" y="${h-2}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">${progression[0][0]}</text>
          <text x="${w-padX}" y="${h-2}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono, monospace">${progression[progression.length-1][0]}</text>
        </svg>
      </div>`;
  }

  // Recent sessions list (last 5)
  const recentDates = [...new Set(lifts.map(l => dateOnly(l.date)))].sort().slice(-5).reverse();
  let recentHtml = "";
  for (const d of recentDates) {
    const sessionSets = lifts.filter(l => dateOnly(l.date) === d);
    recentHtml += `<div class="exercise-block">
      <div class="exercise-name"><span class="lift-date-link" data-lift-date="${d}" style="border-bottom: 1px dotted ${c}; color: ${c};">${d}</span></div>
      <ul class="set-list">`;
    for (const s of sessionSets) {
      const wStr = (!s.weight || s.weight === 0) ? "BW" : `${s.weight} kg`;
      recentHtml += `<li>${wStr} × ${s.reps} reps</li>`;
    }
    recentHtml += `</ul></div>`;
  }

  let html = `
    <div class="modal-header">
      <div>
        <span style="background:${c}30; color:${c}; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-family:'JetBrains Mono', monospace; letter-spacing: 0.1em;">${bp}</span>
        <h2>${name}</h2>
      </div>
      <button class="modal-close" onclick="closeLiftModal()">×</button>
    </div>
    <div class="modal-stats">
      ${sessions.size} sessions · ${lifts.length} sets · ${num(totalVol, 0)} kg total volume · PR ${maxW.toFixed(1)} kg (${maxDate})
    </div>
    ${chartHtml}
    <div style="color: var(--muted); font-size: 11px; margin: 8px 0 4px 0; font-family: 'JetBrains Mono', monospace;">RECENT SESSIONS</div>
    ${recentHtml}`;

  document.getElementById("lift-modal-content").innerHTML = html;
  document.getElementById("lift-modal").classList.add("open");
  bindTooltips();
}

function renderHevy(agg) {
  const dayLifts = (DATA.lifts || []).filter(l => inRange(l.date, agg.rangeStart, agg.rangeEnd));

  // Per-exercise stats
  const exStats = new Map();
  for (const l of dayLifts) {
    const ex = l.exercise || "(unnamed)";
    if (!exStats.has(ex)) exStats.set(ex, {sets: 0, volume: 0, maxWeight: 0, maxDate: "", sessions: new Set(), bp: bodyPart(ex)});
    const e = exStats.get(ex);
    e.sets++;
    e.volume += (l.weight || 0) * (l.reps || 0);
    if ((l.weight || 0) > e.maxWeight) { e.maxWeight = l.weight || 0; e.maxDate = dateOnly(l.date); }
    e.sessions.add(dateOnly(l.date));
  }
  for (const e of exStats.values()) e.sessions = e.sessions.size;

  // Body part summary
  const bpSummary = {};
  for (const bp of ["CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"]) bpSummary[bp] = {sessions: new Set(), sets: 0, volume: 0, exercises: 0};
  for (const [ex, info] of exStats) {
    const s = bpSummary[info.bp];
    s.exercises++;
    s.sets += info.sets;
    s.volume += info.volume;
  }
  for (const l of dayLifts) bpSummary[bodyPart(l.exercise || "")].sessions.add(dateOnly(l.date));
  for (const bp of Object.values(bpSummary)) bp.sessions = bp.sessions.size;

  // Body part summary cards
  const bpOrder = ["CHEST","BACK","ARMS","SHOULDERS","LEGS","CORE","OTHER"];
  const visibleBps = bpOrder.filter(bp => bpSummary[bp].sets > 0);
  const bpCards = visibleBps.map(bp => {
    const s = bpSummary[bp];
    const c = BP_COLORS[bp];
    return `<div class="card bp-summary-card" style="margin:0; cursor:pointer; border-color: ${c}40;" onclick="setBpFilter('${bp}')">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="label-mono" style="color:${c}; margin:0;">${bp}</span>
        <span style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${s.exercises} ex</span>
      </div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:500; color:var(--text);">${s.sessions} sessions</div>
      <div style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${s.sets} sets · ${num(s.volume, 0)} kg</div>
    </div>`;
  }).join("");

  // Filter chips
  const chipsHtml = ["ALL", ...visibleBps].map(bp => {
    const c = bp === "ALL" ? "var(--text)" : BP_COLORS[bp];
    return `<button class="bp-chip${bp === 'ALL' ? ' active' : ''}" data-bp="${bp}" onclick="setBpFilter('${bp}')" style="--c: ${c};">${bp}</button>`;
  }).join("");

  // Exercise cards (sorted by sets desc, all visible by default)
  const exList = [...exStats.entries()].sort((a, b) => b[1].sets - a[1].sets);
  const exCards = exList.length === 0
    ? `<div class="card"><p style="color:var(--muted)">${t("noPrData")}</p></div>`
    : exList.map(([name, info]) => {
        const c = BP_COLORS[info.bp];
        const wStr = info.maxWeight > 0 ? `${info.maxWeight.toFixed(1)} kg` : "BW";
        const safeName = name.replace(/'/g, "\\'");
        return `<div class="card pr-card" style="margin:0; cursor:pointer;" data-bp="${info.bp}" onclick="showExerciseModal('${safeName}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <h3 style="flex:1; margin:0;">${name}</h3>
            <span style="background:${c}30; color:${c}; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-family:'JetBrains Mono', monospace; letter-spacing: 0.1em; white-space: nowrap;">${info.bp}</span>
          </div>
          <div class="stat-big" style="font-size:22px; margin-top:6px;">${wStr}</div>
          <div class="stat-label">${info.sets} sets · ${info.sessions} sessions · ${num(info.volume, 0)} kg vol</div>
        </div>`;
      }).join("");

  const tr = agg.totalsRun;
  const days = Math.floor((agg.rangeEnd - agg.rangeStart) / 86400000) + 1;

  // === Options A, C, D: enhanced PR sections (with safety) ===
  const today = new Date(); today.setHours(0,0,0,0);
  const priorities = (DATA.exercise_priorities || {}).exercises || [];
  let bpProgress = {}, stalled = [], prTimelines = [];
  try { bpProgress = computeBodyPartProgress(DATA.lifts || [], today, 12); }
  catch (e) { console.error('[renderPR] bpProgress failed:', e); }
  try { stalled = findStalledPRs(DATA.lifts || [], priorities, today, 60); }
  catch (e) { console.error('[renderPR] stalled failed:', e); }
  try {
    prTimelines = priorities
      .filter(ep => (ep.priority || 0) >= 4)
      .map(ep => buildPRTimeline(DATA.lifts || [], ep, today))
      .filter(t => t && t.events && t.events.length >= 2)
      .sort((a, b) => {
        if (a.stalled !== b.stalled) return a.stalled ? -1 : 1;
        return b.events.length - a.events.length;
      });
  } catch (e) { console.error('[renderPR] timelines failed:', e); }
  console.log('[renderPR] sections:', {bpCount: Object.keys(bpProgress).length, stalled: stalled.length, timelines: prTimelines.length});

  // Option A: Body Part Progress Grid
  const bpProgressHtml = (() => {
    const cards = ['SHOULDERS','BACK','CHEST','ARMS','LEGS','CORE'].map(bp => {
      const s = bpProgress[bp];
      if (!s) return '';
      const c = BP_COLORS[bp] || 'var(--muted)';
      const deltaPct = s.deltaPct;
      let deltaIcon = '➡', deltaColor = 'var(--muted)';
      let deltaLabel = `${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(0)}%`;
      if (deltaPct >= 10) { deltaIcon = '↑'; deltaColor = '#84cc16'; }
      else if (deltaPct >= 3) { deltaIcon = '↗'; deltaColor = '#84cc16'; }
      else if (deltaPct <= -5) { deltaIcon = '↓'; deltaColor = '#f43f5e'; }
      else if (Math.abs(deltaPct) < 3 && s.recentVol > 0) { deltaIcon = '⏸'; deltaColor = '#fbbf24'; deltaLabel = 'flat'; }
      const maxSpark = Math.max(...s.sparkline, 1);
      const sparkBars = s.sparkline.map(v => `<span style="height:${Math.max(2, (v / maxSpark) * 14).toFixed(0)}px"></span>`).join('');
      const sessionWarn = s.sessionsPerWk < 1.5 && s.recentVol > 0 ? ' ⚠' : '';
      const warnBorder = (deltaPct < -3 || (s.recentPRs === 0 && s.sessionsPerWk >= 1)) ? 'border-color: rgba(244,63,94,0.35);' : '';
      return `<div class="bp-progress-card" style="${warnBorder}" onclick="window.showBodyPartDrilldown('${bp}')">
        <div class="bp-name" style="color:${c};">${bp}</div>
        <div class="bp-trend" style="color:${deltaColor};">${deltaIcon} ${deltaLabel}
          <span class="sparkline" style="color:${deltaColor}; margin-left:4px;">${sparkBars}</span>
        </div>
        <div class="bp-meta">${s.recentPRs} PR${s.recentPRs !== 1 ? 's' : ''} · ${s.sessionsPerWk.toFixed(1)}/wk${sessionWarn}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="label-mono" style="margin-bottom:10px;">📊 BODY PART PROGRESS — last 12 weeks</div>
      <div class="bp-progress-grid">${cards}</div>
      <div style="color:var(--muted); font-size:10px; margin-top:8px; font-family:'JetBrains Mono', monospace;">Tap a card → drilldown</div>
    </div>`;
  })();

  // Option C: Stalled PRs panel
  const stalledHtml = stalled.length > 0 ? (() => {
    const rows = stalled.slice(0, 10).map(s => {
      const subBadge = s.sub_part ? `<span style="background:rgba(113,113,122,0.2); color:var(--muted); padding:1px 5px; border-radius:4px; font-size:8px; font-family:'JetBrains Mono', monospace; margin-left:4px;">${s.sub_part}</span>` : '';
      return `<div class="stalled-row">
        <span class="stalled-stars">${'★'.repeat(s.priority)}</span>
        <span class="stalled-name">${s.name}${subBadge}</span>
        <span class="stalled-rec">${s.maxW > 0 ? s.maxW.toFixed(1)+'kg' : 'BW'} × ${s.maxWReps}</span>
        <span class="stalled-days">${s.daysSincePR}d</span>
      </div>`;
    }).join('');
    return `<div class="card" style="border-color: rgba(251,191,36,0.30); background: rgba(251,191,36,0.04);">
      <div class="label-mono" style="color:#fbbf24; margin-bottom:10px;">⏸ STALLED PRs — 60+ days no new PR</div>
      ${rows}
      <div style="color:#fbbf24; font-size:11px; margin-top:10px; padding-top:8px; border-top:1px dashed rgba(251,191,36,0.3); font-family:'JetBrains Mono', monospace;">
        → Variation 시도 (Cable / 1.5 rep / drop set / deload)
      </div>
    </div>`;
  })() : '';

  // Option D: PR Timeline (per priority exercise, last 12 months scale)
  const oneYrAgo = new Date(today); oneYrAgo.setFullYear(oneYrAgo.getFullYear() - 1);
  const timelineHtml = prTimelines.length > 0 ? (() => {
    const yrSpan = today.getTime() - oneYrAgo.getTime();
    const rows = prTimelines.slice(0, 8).map(t => {
      const c = BP_COLORS[t.bp] || '#FF1A8C';
      // Position each event horizontally based on date (% of last year)
      const dots = t.events.map(e => {
        const dt = parseDateOnly(e.date);
        const pos = Math.max(0, Math.min(100, (dt - oneYrAgo) / yrSpan * 100));
        const isLast = e === t.events[t.events.length - 1];
        const dotColor = isLast && t.stalled ? '#fbbf24' : (isLast ? '#84cc16' : c);
        return `<div class="pr-event" style="left:${pos.toFixed(1)}%; background:${dotColor};" title="${e.date} — ${e.weight}kg × ${e.reps}"></div>`;
      }).join('');
      const lastEvent = t.events[t.events.length - 1];
      const statusBadge = t.stalled
        ? `<span style="color:#fbbf24; font-size:10px;">⏸ ${t.daysSinceLast}d</span>`
        : `<span style="color:#84cc16; font-size:10px;">↑ ${t.daysSinceLast}d</span>`;
      return `<div class="pr-timeline-row">
        <div class="pr-row-name">
          <span style="display:flex; align-items:center; gap:5px;">
            <span class="bp-chip" style="background:${c}25; color:${c};">${t.bp}</span>
            <span>${t.name}</span>
          </span>
          ${statusBadge}
        </div>
        <div class="pr-timeline-bar">${dots}</div>
        <div class="pr-axis">
          <span>1 yr ago</span>
          <span>6 mo</span>
          <span>3 mo</span>
          <span>now (${lastEvent.weight}kg×${lastEvent.reps})</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="label-mono" style="margin-bottom:10px;">📈 PR TIMELINE — priority exercises (last 1 year)</div>
      ${rows}
    </div>`;
  })() : '';

  return `
    ${bpProgressHtml}
    ${stalledHtml}
    ${timelineHtml}

    <h2><span class="pill-lift">LIFTING</span> Body Part Summary</h2>
    <div class="grid grid-3">${bpCards}</div>

    <h2>Exercises</h2>
    <div class="bp-chips">${chipsHtml}</div>
    <div class="grid grid-3">${exCards}</div>

    <h2><span class="pill-run">RUNNING</span> ${t("stats")}</h2>
    <div class="card">
      <div class="grid grid-3">
        <div><h3>${t("longestDistance")}</h3><div class="stat-big" style="font-size:22px; color:var(--run);">
          ${(() => { let mx=0; for (const r of DATA.runs) if (inRange(r.date, agg.rangeStart, agg.rangeEnd) && (r.distance||0)>mx) mx=r.distance; return mx.toFixed(2); })()} km
        </div></div>
        <div><h3>${t("fastestPace")}</h3><div class="stat-big" style="font-size:22px; color:var(--run);">
          ${(() => { let mn=99; for (const r of DATA.runs) if (inRange(r.date, agg.rangeStart, agg.rangeEnd) && r.pace && r.distance>=3 && r.pace<mn) mn=r.pace; return mn===99 ? "-" : fmtPace(mn); })()}
        </div><div class="stat-label">${t("threeKmPlus")}</div></div>
        <div><h3>${t("totalDistance")}</h3><div class="stat-big" style="font-size:22px; color:var(--run);">${tr.distance.toFixed(0)} km</div><div class="stat-label">${days}${t("periodDays")}</div></div>
      </div>
    </div>`;
}

// === Big 3 / Big 7 patterns (v3) ===
const BIG3_PATTERNS = [
  {key: "SQUAT",    regex: /\b(back\s*squat|squat)\b/i, exclude: /front|bulgarian|goblet|sumo|split|hack|smith|machine/i},
  {key: "BENCH",    regex: /\bbench\s*press\b/i,         exclude: /incline|decline|close.?grip|dumbbell|^db\b|smith|machine/i},
  {key: "DEADLIFT", regex: /\bdeadlift\b/i,              exclude: /romanian|^rdl\b|stiff|sumo|trap.?bar/i},
];
const BIG7_PATTERNS = [
  ...BIG3_PATTERNS,
  {key: "OHP",     regex: /\b(overhead\s*press|military\s*press|standing\s*press|^ohp$|barbell\s*shoulder\s*press)\b/i, exclude: /db|dumbbell|seated/i},
  {key: "BB ROW",  regex: /\b(barbell\s*row|^bb\s*row|bent.?over\s*row|pendlay\s*row)\b/i},
  {key: "PULL-UP", regex: /\b(pull.?up|chin.?up)\b/i},
  {key: "DIP",     regex: /\b(^dip|^dips|weighted\s*dip|parallel\s*dip)\b/i, exclude: /tricep dip/i},
];
// === PR/Trends enhancement helpers (Options A, C, D, E) ===

// Option A: per-body-part 12-week progress stats
function computeBodyPartProgress(lifts, today, weeks = 12) {
  const bps = ['SHOULDERS', 'BACK', 'CHEST', 'ARMS', 'LEGS', 'CORE'];
  const weeksAgo = (n) => { const d = new Date(today); d.setDate(d.getDate() - n*7); return d; };
  const cutoffRecent = weeksAgo(weeks);
  const cutoffPrior = weeksAgo(weeks*2);
  const out = {};
  for (const bp of bps) {
    const all = lifts.filter(l => bodyPart(l.exercise || '') === bp);
    const recent = all.filter(l => parseDateOnly(dateOnly(l.date)) >= cutoffRecent);
    const prior = all.filter(l => {
      const d = parseDateOnly(dateOnly(l.date));
      return d >= cutoffPrior && d < cutoffRecent;
    });
    const recentVol = recent.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
    const priorVol = prior.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
    const deltaPct = priorVol > 0 ? ((recentVol - priorVol) / priorVol * 100) : (recentVol > 0 ? 100 : 0);
    const recentSessions = new Set(recent.map(l => dateOnly(l.date))).size;
    const sessionsPerWk = recentSessions / weeks;

    // PRs in last 12wk (new max weight by exercise)
    const byEx = new Map();
    for (const l of all) {
      const ex = l.exercise || '(unnamed)';
      if (!byEx.has(ex)) byEx.set(ex, []);
      byEx.get(ex).push(l);
    }
    let recentPRs = 0;
    for (const [ex, sets] of byEx) {
      sets.sort((a,b) => a.date.localeCompare(b.date));
      let runMax = 0;
      for (const s of sets) {
        const w = s.weight || 0;
        if (w > runMax) {
          runMax = w;
          if (parseDateOnly(dateOnly(s.date)) >= cutoffRecent) recentPRs++;
        }
      }
    }

    // Sparkline: weekly volume last 8 weeks
    const sparkline = [];
    for (let i = 7; i >= 0; i--) {
      const wkStart = weeksAgo(i+1);
      const wkEnd = weeksAgo(i);
      const wkLifts = all.filter(l => {
        const d = parseDateOnly(dateOnly(l.date));
        return d >= wkStart && d < wkEnd;
      });
      sparkline.push(wkLifts.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0));
    }

    out[bp] = { recentVol, priorVol, deltaPct, sessions: recentSessions, sessionsPerWk, recentPRs, sparkline };
  }
  return out;
}

// Option C: priority exercises with no new PR in N+ days
function findStalledPRs(lifts, priorities, today, daysThreshold = 60) {
  const out = [];
  for (const ep of priorities) {
    if ((ep.priority || 0) < 3) continue;
    const matches = lifts.filter(l => matchAnyJS(l.exercise || '', ep.patterns || []));
    if (matches.length === 0) continue;
    let maxW = 0, maxWReps = 0, maxWDate = null;
    for (const l of matches) {
      const w = l.weight || 0, r = l.reps || 0;
      if (w > maxW || (w === maxW && r > maxWReps)) {
        maxW = w; maxWReps = r; maxWDate = dateOnly(l.date);
      }
    }
    if (!maxWDate) continue;
    const daysSincePR = Math.floor((today - parseDateOnly(maxWDate)) / 86400000);
    if (daysSincePR >= daysThreshold) {
      out.push({ name: ep.name, priority: ep.priority, bp: ep.body_part, sub_part: ep.sub_part || null, maxW, maxWReps, daysSincePR });
    }
  }
  out.sort((a, b) => b.priority - a.priority || b.daysSincePR - a.daysSincePR);
  return out;
}

// Option D: PR-setting events per priority exercise, for timeline visual
function buildPRTimeline(lifts, ep, today) {
  const matches = lifts.filter(l => matchAnyJS(l.exercise || '', ep.patterns || []));
  if (matches.length === 0) return null;
  matches.sort((a,b) => a.date.localeCompare(b.date));
  const events = [];
  let runMax = 0;
  for (const l of matches) {
    const w = l.weight || 0;
    if (w > runMax) {
      runMax = w;
      events.push({ date: dateOnly(l.date), weight: w, reps: l.reps || 0 });
    }
  }
  if (events.length === 0) return null;
  const lastEvent = events[events.length - 1];
  const daysSinceLast = Math.floor((today - parseDateOnly(lastEvent.date)) / 86400000);
  return { name: ep.name, bp: ep.body_part, sub_part: ep.sub_part || null, events, daysSinceLast, stalled: daysSinceLast >= 60 };
}

// Option E: weekly total volume + deload pattern detection
function computeWeeklyVolume(lifts, today, weeks = 16) {
  const out = [];
  const weeksAgo = (n) => { const d = new Date(today); d.setDate(d.getDate() - n*7); return d; };
  for (let i = weeks-1; i >= 0; i--) {
    const wkStart = weeksAgo(i+1);
    const wkEnd = weeksAgo(i);
    const wk = lifts.filter(l => {
      const d = parseDateOnly(dateOnly(l.date));
      return d >= wkStart && d < wkEnd;
    });
    const vol = wk.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
    out.push({ weekIdx: weeks - i, vol, isDeload: false });
  }
  // Detect deloads: weeks where volume < 70% of previous week
  for (let i = 1; i < out.length; i++) {
    if (out[i-1].vol > 1000 && out[i].vol < out[i-1].vol * 0.7) {
      out[i].isDeload = true;
    }
  }
  return out;
}

function matchAnyJS(name, patterns) {
  if (!name) return false;
  for (const p of patterns) {
    try { if (new RegExp(p, 'i').test(name)) return true; } catch (e) {}
  }
  return false;
}

// === Big 3 / Big 7 patterns (v3) ===

function findBigMatch(name, patterns) {
  if (!name) return null;
  for (const p of patterns) {
    if (p.exclude && p.exclude.test(name)) continue;
    if (p.regex.test(name)) return p.key;
  }
  return null;
}

function _prSearchGetExercises() {

function _prSearchBestBrief(name) {
  const sets = (DATA.lifts || []).filter(l => l.exercise === name);
  if (sets.length === 0) return '';
  const maxW = Math.max(0, ...sets.map(s => s.weight || 0));
  const maxDur = Math.max(0, ...sets.map(s => s.duration_sec || 0));
  const maxReps = Math.max(0, ...sets.map(s => s.reps || 0));
  const isTimeBased = maxW === 0 && maxReps === 0 && maxDur > 0;
  if (isTimeBased) {
    const m = Math.floor(maxDur/60), s = maxDur%60;
    return m > 0 ? `${m}:${String(s).padStart(2,'0')} PR` : `${s}s PR`;
  }
  if (maxW > 0) return `${maxW.toFixed(1)}kg PR`;
  return `${maxReps} reps PR`;
}

window.prSearchKeydown = function(ev, inp) {
  const listEl = document.getElementById('ex-search-list');
  if (!listEl || listEl.style.display === 'none') {
    if (ev.key === 'Escape') inp.blur();
    return;
  }
  const items = listEl.querySelectorAll('.ex-search-item[data-name]');
  if (items.length === 0) return;
  let h = window.PR_SEARCH_HIGHLIGHT || 0;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); h = Math.min(h + 1, items.length - 1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); h = Math.max(h - 1, 0); }
  else if (ev.key === 'Enter') { ev.preventDefault(); window.prSearchSelect(items[h].dataset.name); return; }
  else if (ev.key === 'Escape') { ev.preventDefault(); listEl.style.display = 'none'; inp.blur(); return; }
  else return;
  items.forEach(el => el.classList.remove('active'));
  items[h].classList.add('active');
  items[h].scrollIntoView({block: 'nearest'});
  window.PR_SEARCH_HIGHLIGHT = h;
};

function _prSearchBuildDetail(name) {
  const sets = (DATA.lifts || []).filter(l => l.exercise === name);
  if (sets.length === 0) {
    return `<div class="card" style="border-color: var(--lift);"><p style="color:var(--muted);">해당 종목 데이터 없음</p></div>`;
  }
  const bp = bodyPart(name);
  const sub = subBodyPart(name, bp);
  const c = BP_COLORS[bp] || 'var(--muted)';
  const sessionsCount = new Set(sets.map(s => dateOnly(s.date))).size;

  const maxW = Math.max(0, ...sets.map(s => s.weight || 0));
  const maxReps = Math.max(0, ...sets.map(s => s.reps || 0));
  const maxDur = Math.max(0, ...sets.map(s => s.duration_sec || 0));
  const isTimeBased = maxW === 0 && maxReps === 0 && maxDur > 0;
  const isBW = maxW === 0 && !isTimeBased;

  const today = new Date(); today.setHours(0,0,0,0);
  const _daysAgo = (d) => {
    const diff = Math.floor((today - parseDateOnly(d)) / 86400000);
    if (diff === 0) return 'today';
    if (diff === 1) return '1d ago';
    return `${diff}d ago`;
  };
  const _fmtDur = (sec) => { const m=Math.floor(sec/60), s=sec%60; return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`; };

  // Max Weight / Duration tile
  let mwTile;
  if (isTimeBased) {
    let bestDur = 0, bestDate = '';
    for (const s of sets) {
      const dur = s.duration_sec || 0;
      const d = dateOnly(s.date);
      if (dur > bestDur || (dur === bestDur && d > bestDate)) { bestDur = dur; bestDate = d; }
    }
    mwTile = `<div class="metric-tile"><div class="lbl">Max Duration</div><div class="val">${_fmtDur(bestDur)} hold</div><div class="sub">${bestDate.slice(5)} (${_daysAgo(bestDate)})</div></div>`;
  } else {
    let bestW = 0, bestR = 0, bestDate = '';
    for (const s of sets) {
      const w = s.weight || 0, r = s.reps || 0;
      const d = dateOnly(s.date);
      if (w > bestW || (w === bestW && r > bestR) || (w === bestW && r === bestR && d > bestDate)) { bestW = w; bestR = r; bestDate = d; }
    }
    const wStr = bestW > 0 ? `${_fmtKg(bestW)} × ${bestR}` : `BW × ${bestR}`;
    mwTile = `<div class="metric-tile"><div class="lbl">Max Weight</div><div class="val">${wStr}</div><div class="sub">${bestDate.slice(5)} (${_daysAgo(bestDate)})</div></div>`;
  }

  // Single Set Volume tile
  let svTile;
  if (isTimeBased) {
    svTile = `<div class="metric-tile" style="opacity: 0.4;"><div class="lbl">Single Set Vol</div><div class="val">—</div><div class="sub">time-based</div></div>`;
  } else {
    let bestSetVol = 0, bestSetW = 0, bestSetR = 0, bestSetDate = '';
    for (const s of sets) {
      const w = s.weight || 0, r = s.reps || 0;
      const v = isBW ? r : (w * r);
      const d = dateOnly(s.date);
      if (v > bestSetVol || (v === bestSetVol && d > bestSetDate)) { bestSetVol = v; bestSetW = w; bestSetR = r; bestSetDate = d; }
    }
    const vStr = isBW ? `BW × ${bestSetR} reps` : `${_fmtKg(bestSetW)} × ${bestSetR} = ${_fmtNum(bestSetVol)}kg`;
    svTile = `<div class="metric-tile"><div class="lbl">Single Set Vol</div><div class="val">${vStr}</div><div class="sub">${bestSetDate.slice(5)} (${_daysAgo(bestSetDate)})</div></div>`;
  }

  // Session Volume tile
  let ssTile;
  if (isTimeBased) {
    ssTile = `<div class="metric-tile" style="opacity: 0.4;"><div class="lbl">Session Vol</div><div class="val">—</div><div class="sub">time-based</div></div>`;
  } else {
    const sessMap = new Map();
    for (const s of sets) {
      const d = dateOnly(s.date);
      const v = isBW ? (s.reps || 0) : ((s.weight || 0) * (s.reps || 0));
      if (!sessMap.has(d)) sessMap.set(d, {vol: 0, sets: 0});
      const e = sessMap.get(d);
      e.vol += v; e.sets++;
    }
    let bestSess = null, bestSessDate = '';
    for (const [d, e] of sessMap) {
      if (!bestSess || e.vol > bestSess.vol || (e.vol === bestSess.vol && d > bestSessDate)) { bestSess = e; bestSessDate = d; }
    }
    const vStr = isBW ? `${bestSess.sets} sets · ${_fmtNum(bestSess.vol)} reps` : `${bestSess.sets} sets · ${_fmtNum(bestSess.vol)}kg total`;
    ssTile = `<div class="metric-tile"><div class="lbl">Session Vol</div><div class="val">${vStr}</div><div class="sub">${bestSessDate.slice(5)} (${_daysAgo(bestSessDate)})</div></div>`;
  }

  // Reuse chart + last 5 sessions from buildPRDetailsHtml (all-time)
  const _oldPeriod = window.PR_PERIOD_DAYS;
  window.PR_PERIOD_DAYS = 9999;
  let chartAndSessions = '';
  try { chartAndSessions = buildPRDetailsHtml(name); }
  catch (e) { chartAndSessions = ''; }
  window.PR_PERIOD_DAYS = _oldPeriod;

  const subBadge = sub ? `<span class="bp-badge" style="background:${subColor(bp, sub)}20; color:${subColor(bp, sub)}; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em;">${sub}</span>` : '';

  return `
    <div class="card" style="border-color: var(--lift); border-width: 1px;">
      <div class="detail-title">
        <div class="name">
          ${_esc(name)}
          <span class="bp-badge" style="background: ${c}30; color: ${c}; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em;">${bp}</span>
          ${subBadge}
        </div>
        <span class="label-mono">${sets.length} sets · ${sessionsCount} sessions</span>
      </div>
      <div class="detail-metrics">
        ${mwTile}
        ${svTile}
        ${ssTile}
      </div>
      ${chartAndSessions}
    </div>
  `;
}

function buildPRDetailsHtml(name) {
  const lifts = (DATA.lifts || []).filter(l => l.exercise === name)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (lifts.length === 0) {
    return '<div style="padding:14px 16px; color:var(--muted); font-size:12px;">데이터 없음</div>';
  }
  const bp = bodyPart(name);
  const c = BP_COLORS[bp] || 'var(--muted)';
  const periodDays = window.PR_PERIOD_DAYS || 90;
  const isAllTime = periodDays >= 9999;
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = isAllTime ? new Date(0) : (() => { const c = new Date(today); c.setDate(c.getDate() - periodDays); return c; })();
  const periodLabel = isAllTime ? '전체 기간' : periodDays === 365 ? '지난 1년' : periodDays === 180 ? '지난 6개월' : `지난 ${periodDays}일`;
  const liftsInPeriod = isAllTime ? lifts : lifts.filter(l => parseDateOnly(dateOnly(l.date)) >= cutoff);
  const byDate = new Map();
  for (const l of liftsInPeriod) {
    const d = dateOnly(l.date);
    if (!byDate.has(d) || (l.weight || 0) > byDate.get(d)) byDate.set(d, l.weight || 0);
  }
  const prog = [...byDate.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  let chartHtml = '';
  if (prog.length >= 2) {
    const w = 800, h = 90, padL = 32, padR = 32, padT = 10, padB = 18;
    const maxV = Math.max(...prog.map(p => p[1]), 1);
    const firstSessionT = parseDateOnly(prog[0][0]).getTime();
    const xMin = isAllTime ? firstSessionT : cutoff.getTime();
    const xMax = today.getTime();
    const tRng = xMax - xMin || 1;
    const xS = t => padL + (t - xMin) / tRng * (w - padL - padR);
    const yS = v => h - padB - v / maxV * (h - padT - padB);
    const pts = prog.map(([d, v]) => `${xS(parseDateOnly(d).getTime()).toFixed(1)},${yS(v).toFixed(1)}`).join(' L');
    const dots = prog.map(([d, v]) => `<circle cx="${xS(parseDateOnly(d).getTime()).toFixed(1)}" cy="${yS(v).toFixed(1)}" r="2.5" fill="${c}"/>`).join('');
    const leftLabel = isAllTime ? prog[0][0] : `${periodDays}d 전`;
    chartHtml = `
      <div style="margin: 6px 0 12px;">
        <div class="label-mono" style="margin-bottom:6px;">PR 진행 (${periodLabel} · max weight per session)</div>
        <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; max-height:90px; display:block;">
          <text x="0" y="${padT+4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">${maxV.toFixed(0)}</text>
          <text x="0" y="${h-padB+4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">0</text>
          <path d="M${pts}" stroke="${c}" stroke-width="1.5" fill="none"/>
          ${dots}
          <text x="${padL}" y="${h-4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">${leftLabel}</text>
          <text x="${w-padR}" y="${h-4}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono, monospace">오늘</text>
        </svg>
      </div>`;
  } else if (prog.length === 1) {
    chartHtml = `<div style="margin: 6px 0 12px; color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${periodLabel} 내 세션 1개 — 진행 그래프 표시 불가</div>`;
  } else {
