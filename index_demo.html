      const vol = lifts.reduce((s,l) => s + (l.weight||0)*(l.reps||0), 0);
      const sess = new Set(lifts.map(l => dateOnly(l.date))).size;
      return {runs: runs.length, distance: dist, duration: dur, sets: lifts.length, sessions: sess, volume: vol};
    }
    const cur = summarize(thisStart, thisEnd);
    const prev = summarize(prevStart, prevEnd);
    const yoy = summarize(yoyStart, yoyEnd);

    function diff(a, b) {
      if (b === 0) return a > 0 ? "+∞" : "—";
      const pct = ((a - b) / b * 100).toFixed(0);
      const cls = a > b ? "change-up" : (a < b ? "change-down" : "change-flat");
      const sign = a > b ? "↑ +" : (a < b ? "↓ " : "= ");
      return `<span class="${cls}" style="font-family:'JetBrains Mono', monospace; font-size:10px;">${sign}${pct}%</span>`;
    }

    function compareCard(label, curVal, prevVal, fmt) {
      return `<div class="card" style="margin:0;">
        <h3>${label}</h3>
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
          <div>
            <div class="stat-big" style="font-size:22px;">${fmt(curVal)}</div>
            <div class="stat-label">this month</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:14px;">${fmt(prevVal)}</div>
            <div class="stat-label">prev</div>
            <div>${diff(curVal, prevVal)}</div>
          </div>
        </div>
      </div>`;
    }
    function yoyCard(label, curVal, yoyVal, fmt) {
      return `<div class="card" style="margin:0;">
        <h3>${label}</h3>
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
          <div>
            <div class="stat-big" style="font-size:22px;">${fmt(curVal)}</div>
            <div class="stat-label">this year</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:14px;">${fmt(yoyVal)}</div>
            <div class="stat-label">last year</div>
            <div>${diff(curVal, yoyVal)}</div>
          </div>
        </div>
      </div>`;
    }

    const fmtKm = v => v.toFixed(1)+' km';
    const fmtMin = v => Math.round(v)+' min';
    const fmtCount = v => v.toString();
    const fmtVol = v => num(v, 0)+' kg';

    const thisLabel = `${MONTH_NAMES[thisStart.getMonth()]} ${thisStart.getFullYear()}`;
    const prevLabel = `${MONTH_NAMES[prevStart.getMonth()]} ${prevStart.getFullYear()}`;
    const yoyLabel = `${MONTH_NAMES[yoyStart.getMonth()]} ${yoyStart.getFullYear()}`;

    return `
      <h2><span class="pill-run">THIS MONTH</span> vs <span class="pill-lift">PREV MONTH</span></h2>
      <p style="color:var(--muted); font-size:11px; margin-bottom:12px; font-family:'JetBrains Mono', monospace;">${thisLabel} vs ${prevLabel}</p>
      <div class="grid grid-3" style="margin-bottom:16px;">
        ${compareCard('RUNS', cur.runs, prev.runs, fmtCount)}
        ${compareCard('DISTANCE', cur.distance, prev.distance, fmtKm)}
        ${compareCard('DURATION', cur.duration, prev.duration, fmtMin)}
        ${compareCard('LIFT SESSIONS', cur.sessions, prev.sessions, fmtCount)}
        ${compareCard('LIFT SETS', cur.sets, prev.sets, fmtCount)}
        ${compareCard('VOLUME', cur.volume, prev.volume, fmtVol)}
      </div>

      <h2>YEAR-OVER-YEAR</h2>
      <p style="color:var(--muted); font-size:11px; margin-bottom:12px; font-family:'JetBrains Mono', monospace;">${thisLabel} vs ${yoyLabel}</p>
      <div class="grid grid-3">
        ${yoyCard('RUNS', cur.runs, yoy.runs, fmtCount)}
        ${yoyCard('DISTANCE', cur.distance, yoy.distance, fmtKm)}
        ${yoyCard('DURATION', cur.duration, yoy.duration, fmtMin)}
        ${yoyCard('LIFT SESSIONS', cur.sessions, yoy.sessions, fmtCount)}
        ${yoyCard('LIFT SETS', cur.sets, yoy.sets, fmtCount)}
        ${yoyCard('VOLUME', cur.volume, yoy.volume, fmtVol)}
      </div>
    `;
  }

  // Toggle UI
  const toggleHtml = `
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <span class="label-mono" style="margin:0;">VIEW:</span>
      <div style="display:inline-flex; background:var(--surface-2,#161616); border:1px solid var(--border); border-radius:8px; padding:2px;">
        <button onclick="window.TRENDS_MODE='run'; refresh();" style="background:${mode==='run'?'var(--run)':'transparent'}; color:${mode==='run'?'#000':'var(--muted)'}; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;">RUN</button>
        <button onclick="window.TRENDS_MODE='lift'; refresh();" style="background:${mode==='lift'?'var(--lift)':'transparent'}; color:${mode==='lift'?'#fff':'var(--muted)'}; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;">LIFT</button>
        <button onclick="window.TRENDS_MODE='compare'; refresh();" style="background:${mode==='compare'?'var(--accent)':'transparent'}; color:${mode==='compare'?'#fff':'var(--muted)'}; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;">COMPARE</button>
      </div>
    </div>
  `;

  let body;
  if (mode === 'run') body = renderRunMode();
  else if (mode === 'lift') body = renderLiftMode();
  else body = renderCompareMode();

  // Show periodization at top only in lift mode (or compare)
  const periodSection = (mode === 'lift' || mode === 'compare') ? periodHtml : '';

  return `
    ${toggleHtml}
    ${periodSection}
    ${body}
  `;
}

// === View: Plan (Athletic Lean Physique) ===
function renderPlan(agg) {
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);
  const sevenAgo = addDays(todayStart, -7);
  const allLifts = DATA.lifts || [];
  const allRuns = DATA.runs || [];
  const priorities = (DATA.exercise_priorities || {}).exercises || [];

  // Latest body composition
  const inbodySorted = [...(DATA.inbody || [])].sort((a, b) => a.date.localeCompare(b.date));
  const latestInbody = inbodySorted[inbodySorted.length - 1] || {};
  const smm = latestInbody.smm || 0;
  const bf = latestInbody.bodyFat || 0;
  const weight = latestInbody.weight || 0;
  const targetSMM = 40, targetBF = 10;
  const smmProgress = smm > 0 ? Math.max(0, Math.min(100, ((smm - 35) / (targetSMM - 35)) * 100)) : 0;
  const bfProgress = bf > 0 ? Math.max(0, Math.min(100, ((20 - bf) / (20 - targetBF)) * 100)) : 0;

  // Compute per-exercise stats
  function matchAny(name, patterns) {
    if (!name) return false;
    for (const p of patterns) {
      try { if (new RegExp(p, 'i').test(name)) return true; } catch (e) {}
    }
    return false;
  }
  // Substitute weight: same (body_part, sub_part) as priority exercise but
  // different specific exercise gets 70% credit. Same body_part different sub_part: 30%.
  const SUBST_SAME_SUB = 0.7;
  const SUBST_SAME_BP = 0.3;

  const stats = priorities.map(ep => {
    // Exact (regex) matches
    const exactMatches = allLifts.filter(l => matchAny(l.exercise || '', ep.patterns));
    const exactDates = [...new Set(exactMatches.map(l => dateOnly(l.date)))].sort();
    const lastExact = exactDates.length > 0 ? exactDates[exactDates.length - 1] : null;
    const daysSinceExact = lastExact ? Math.floor((todayStart - parseDateOnly(lastExact)) / 86400000) : 999;
    const exactRecent7 = exactDates.filter(d => parseDateOnly(d) >= sevenAgo).length;

    // Substitute matches: same body_part+sub_part but NOT exact regex match
    let substSameSubRecent7 = 0;
    let substSameBpRecent7 = 0;
    let lastSubstSameSubDate = null;
    let lastSubstSameBpDate = null;
    const targetBp = ep.body_part, targetSub = ep.sub_part || null;
    const substSeenDates = new Set();
    for (const l of allLifts) {
      if (matchAny(l.exercise || '', ep.patterns)) continue;  // not a substitute (exact)
      const liftBp = bodyPart(l.exercise || '');
      if (liftBp !== targetBp) continue;
      const liftSub = subBodyPart(l.exercise || '', liftBp);
      const d = dateOnly(l.date);
      if (substSeenDates.has(d)) continue;
      substSeenDates.add(d);
      const dt = parseDateOnly(d);
      const isSameSub = targetSub && liftSub === targetSub;
      const isRecent = dt >= sevenAgo;
      if (isSameSub) {
        if (isRecent) substSameSubRecent7++;
        if (!lastSubstSameSubDate || d > lastSubstSameSubDate) lastSubstSameSubDate = d;
      } else {
        if (isRecent) substSameBpRecent7++;
        if (!lastSubstSameBpDate || d > lastSubstSameBpDate) lastSubstSameBpDate = d;
      }
    }
    const daysSinceSubstSameSub = lastSubstSameSubDate ? Math.floor((todayStart - parseDateOnly(lastSubstSameSubDate)) / 86400000) : 999;
    const daysSinceSubstSameBp = lastSubstSameBpDate ? Math.floor((todayStart - parseDateOnly(lastSubstSameBpDate)) / 86400000) : 999;

    // Effective freq (weighted): exact + 0.7 × subst_same_sub + 0.3 × subst_same_bp
    const effectiveFreq = exactRecent7
      + SUBST_SAME_SUB * substSameSubRecent7
      + SUBST_SAME_BP * substSameBpRecent7;

    // Effective daysSince: ONLY same-sub substitutes reset the timer cleanly.
    // Same-bp partial work (e.g., push-up for Incline Press) does NOT reset daysSince
    // — prevents the system saying "you did it today" when you only did a different sub-part.
    const daysSince = Math.min(daysSinceExact, daysSinceSubstSameSub);

    const thisWeekFreq = Math.round(effectiveFreq * 10) / 10;  // rounded for display
    const deficit = ep.priority * Math.min(daysSince, 7) * Math.max(ep.target_freq - effectiveFreq, 1);

    // Keep backward-compat references for UI:
    const sessionDates = exactDates;
    const last = lastExact;

    // Suggested prescription from recent sets (use exact matches only for prescription)
    const recentSets = exactMatches
      .filter(l => parseDateOnly(dateOnly(l.date)) >= addDays(todayStart, -30))
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 12);
    let suggWeight = 0, suggReps = 12, suggSets = 3, isTime = false, suggDuration = 0;
    if (recentSets.length > 0) {
      const weights = recentSets.map(l => l.weight || 0).filter(w => w > 0);
      const reps = recentSets.map(l => l.reps || 0).filter(r => r > 0);
      const durations = recentSets.map(l => l.duration_sec || 0).filter(d => d > 0);
      if (durations.length > 0) {
        isTime = true;
        suggDuration = Math.round(durations.reduce((s, d) => s + d, 0) / durations.length);
      } else {
        if (weights.length > 0) suggWeight = Math.round(weights.reduce((s, w) => s + w, 0) / weights.length * 2) / 2;
        if (reps.length > 0) suggReps = Math.round(reps.reduce((s, r) => s + r, 0) / reps.length);
      }
      // Common set count for this exercise across recent sessions
      const bySession = {};
      for (const l of recentSets) {
        const d = dateOnly(l.date);
        bySession[d] = (bySession[d] || 0) + 1;
      }
      const setsArr = Object.values(bySession);
      if (setsArr.length > 0) suggSets = Math.round(setsArr.reduce((s, n) => s + n, 0) / setsArr.length);
    }
    return { ...ep, lastDate: last, daysSince, thisWeekFreq, deficit,
             exactRecent7, substSameSubRecent7, substSameBpRecent7,
             suggWeight, suggReps, suggSets, isTime, suggDuration };
  });

  // NEW: group ALL exercises by tier (priority value), sort within tier by daysSince DESC.
  // User picks which to do — no auto-pick of "top 6 recommended".
  const tierGroups = {};  // priority value -> [exercises]
  for (const s of stats) {
    if (!tierGroups[s.priority]) tierGroups[s.priority] = [];
    tierGroups[s.priority].push(s);
  }
  for (const p of Object.keys(tierGroups)) {
    tierGroups[p].sort((a, b) => b.daysSince - a.daysSince);  // most overdue first
  }
  const tierLabels = {
    5: { label: 'V-taper / Frame Critical', emoji: '🥇' },
    4: { label: 'Detail / Proportion', emoji: '🥈' },
    3: { label: 'Maintenance / Posture', emoji: '🥉' },
    2: { label: 'Niche / Optional', emoji: '' },
    1: { label: 'De-emphasize', emoji: '⚠️' },
  };

  // Quick Pick: top 5 by deficit score (priority >= 3, exclude trained today)
  // Brings back the "actionable now" answer without losing the full library below
  const quickEligible = stats.filter(s => s.priority >= 3 && s.daysSince >= 1);
  quickEligible.sort((a, b) => b.deficit - a.deficit);
  const quickPicks = quickEligible.slice(0, 5);

  // Use first Quick Pick for TODAY cell highlight color (fallback to most overdue Tier 1)
  const todayHighlightBP = (quickPicks[0]?.body_part
    || (tierGroups[5] && tierGroups[5][0] ? tierGroups[5][0].body_part : 'OTHER'));
  const todayPicks = quickPicks;  // for legacy references (attention block, calendar)

  // 7-day calendar
  const calCells = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(todayStart, -i);
    const iso = isoDate(d);
    const isToday = i === 0;
    const dayLifts = allLifts.filter(l => dateOnly(l.date) === iso);
    const dayRuns = allRuns.filter(r => dateOnly(r.date) === iso);
    const sets = dayLifts.length;
    const km = dayRuns.reduce((s, r) => s + (r.distance || 0), 0);
    // Primary body part by set count
    const bpCounts = {};
    for (const l of dayLifts) {
      const bp = bodyPart(l.exercise || '');
      bpCounts[bp] = (bpCounts[bp] || 0) + 1;
    }
    const primaryBP = Object.entries(bpCounts).sort((a, b) => b[1] - a[1])[0]?.[0];
    calCells.push({ iso, dayOfWeek: WEEKDAYS[d.getDay() === 0 ? 6 : d.getDay() - 1],
                    dayNum: d.getDate(), monthNum: d.getMonth() + 1,
                    sets, km, primaryBP, isToday });
  }

  function bpColor(bp) { return BP_COLORS[bp] || 'var(--muted)'; }
  function bpLabel(bp) { return bp ? bp : 'rest'; }

  // Calendar HTML
  const calendarHtml = `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="label-mono">📅 THIS WEEK</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);">
          ${calCells[0].monthNum}/${calCells[0].dayNum} – ${calCells[6].monthNum}/${calCells[6].dayNum}, ${todayStart.getFullYear()}
        </div>
      </div>
      <div id="this-week-scroll" style="overflow-x:auto; -webkit-overflow-scrolling:touch; padding-top:10px;">
        <div style="display:grid; grid-template-columns:repeat(7, minmax(96px, 1fr)); gap:8px; min-width:100%;">
          ${calCells.map(c => {
            const c2 = c.primaryBP ? bpColor(c.primaryBP) : 'var(--surface-2)';
            const todayStyle = c.isToday
              ? `border: 2px solid ${bpColor(todayHighlightBP)}; position:relative; background: var(--surface);`
              : `border: 1px solid var(--border); background: var(--surface-2);`;
            const todayBadge = c.isToday
              ? `<div style="position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:${bpColor(todayHighlightBP)}; color:#000; padding:1px 6px; border-radius:4px; font-size:8px; font-family:'JetBrains Mono', monospace;">TODAY</div>`
              : '';
            const bpHtml = c.primaryBP
              ? `<span style="background:${c2}30; color:${c2}; padding:2px 6px; border-radius:6px; font-size:9px; font-family:'JetBrains Mono', monospace; letter-spacing:0.05em;">${bpLabel(c.primaryBP)}</span>`
              : (c.isToday
                  ? `<span style="background:${bpColor(todayHighlightBP)}30; color:${bpColor(todayHighlightBP)}; padding:2px 6px; border-radius:6px; font-size:9px; font-family:'JetBrains Mono', monospace;">${todayHighlightBP}</span>`
                  : `<span style="color:var(--muted); font-size:11px;">rest</span>`);
            const cardioHtml = c.km > 0 ? `<div style="font-size:9px; color:var(--run); margin-top:4px;">+ ${c.km.toFixed(1)}km</div>` : '';
            const setsHtml = c.sets > 0 ? `<div style="font-size:10px; color:var(--muted); margin-top:4px;">${c.sets} sets</div>` : '';
            const todayLabelHtml = c.isToday ? `<div style="font-size:10px; color:${bpColor(todayHighlightBP)}; margin-top:4px;">recommended</div>` : '';
            const todayAttr = c.isToday ? ' data-today-cell="1"' : '';
            const clickAttr = c.sets > 0 ? ` data-lift-date="${c.iso}" style="cursor:pointer; border-radius:8px; padding:14px 8px; text-align:center; ${todayStyle}"` : ` style="border-radius:8px; padding:14px 8px; text-align:center; ${todayStyle}"`;
            return `<div${todayAttr}${clickAttr}>
              ${todayBadge}
              <div style="font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace;">${c.dayOfWeek} ${c.monthNum}/${c.dayNum}</div>
              <div style="margin:8px 0;">${bpHtml}</div>
              ${setsHtml}${cardioHtml}${todayLabelHtml}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;

  // Today's workout cards
  // Render one exercise row (compact, used in tier list)
  function renderExerciseRow(p) {
    const c = bpColor(p.body_part);
    let prescription;
    if (p.isTime) {
      const mm = Math.floor(p.suggDuration / 60);
      const ss = p.suggDuration % 60;
      prescription = `${mm}:${ss.toString().padStart(2,'0')} × ${p.suggSets}`;
    } else if (p.suggWeight > 0) {
      prescription = `${p.suggWeight}kg × ${p.suggReps} (${p.suggSets} sets)`;
    } else {
      prescription = `BW × ${p.suggReps} (${p.suggSets} sets)`;
    }
    const substParts = [];
    if (p.substSameSubRecent7 > 0) substParts.push(`+${p.substSameSubRecent7} sub`);
    if (p.substSameBpRecent7 > 0) substParts.push(`+${p.substSameBpRecent7} bp`);
    const substNote = substParts.length > 0 ? ` <span style="color:var(--gold);">(${substParts.join(', ')})</span>` : '';
    const lastInfo = p.lastDate
      ? `${p.exactRecent7}/${p.target_freq} this wk${substNote}`
      : (p.substSameSubRecent7 + p.substSameBpRecent7 > 0
          ? `0/${p.target_freq} exact${substNote}`
          : `0/${p.target_freq} (never)`);

    // daysSince badge with color intensity by urgency
    let dsColor, dsBg;
    if (p.daysSince >= 999) { dsColor = 'var(--muted)'; dsBg = 'rgba(113,113,122,0.15)'; }
    else if (p.daysSince >= 7) { dsColor = '#f43f5e'; dsBg = 'rgba(244,63,94,0.15)'; }
    else if (p.daysSince >= 4) { dsColor = '#fbbf24'; dsBg = 'rgba(251,191,36,0.15)'; }
    else if (p.daysSince >= 1) { dsColor = '#a3e635'; dsBg = 'rgba(163,230,53,0.12)'; }
    else { dsColor = 'var(--muted)'; dsBg = 'rgba(113,113,122,0.10)'; }
    const dsLabel = p.daysSince >= 999 ? 'never' : (p.daysSince === 0 ? 'today' : `${p.daysSince}d ago`);

    const subColorPlan = p.sub_part ? (SUB_COLORS[p.body_part + "/" + p.sub_part] || c) : c;
    const subBadge = p.sub_part
      ? `<span style="background:${subColorPlan}20; color:${subColorPlan}; padding:1px 5px; border-radius:5px; font-size:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.08em;">${p.sub_part}</span>`
      : '';

    const priIdx = priorities.findIndex(e => e.name === p.name);
    return `<div>
      <div class="exercise-row" data-pri-idx="${priIdx}" style="display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; -webkit-tap-highlight-color: rgba(255,26,140,0.2);">
        <div style="flex:1; min-width:0;">
          <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-bottom:3px;">
            <span style="background:${c}25; color:${c}; padding:1px 6px; border-radius:5px; font-size:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.08em;">${p.body_part}</span>
            ${subBadge}
          </div>
          <div style="font-size:13px; line-height:1.3;">${p.name} <span class="exercise-chevron" style="color:var(--muted); font-size:10px; transition:transform 0.2s;">▾</span></div>
          <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px; margin-top:2px;">${prescription} · ${lastInfo}</div>
        </div>
        <div style="background:${dsBg}; color:${dsColor}; padding:5px 8px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:500; white-space:nowrap; flex-shrink:0;">${dsLabel}</div>
      </div>
      <div class="exercise-details" data-for-idx="${priIdx}"></div>
    </div>`;
  }

  // Quick Pick HTML — top 5 deficit-driven picks at the top for fast decisions
  const quickPicksEstMin = quickPicks.length * 8;
  const quickPicksBPs = [...new Set(quickPicks.map(p => p.body_part))];
  const quickPicksHtml = quickPicks.length > 0 ? `
    <div class="card" style="background:linear-gradient(135deg, rgba(245,158,11,0.08), rgba(255,26,140,0.04)); border-color:rgba(245,158,11,0.30); margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          <div class="label-mono" style="color:#fbbf24;">🎯 QUICK PICK — deficit-driven</div>
          <div style="font-size:11px; color:var(--muted); margin-top:4px;">
            ${quickPicksBPs.map(bp => {
              const c = bpColor(bp);
              return `<span style="background:${c}20; color:${c}; padding:1px 6px; border-radius:5px; font-size:9px; font-family:'JetBrains Mono', monospace; margin-right:4px;">${bp}</span>`;
            }).join('')}
          </div>
        </div>
        <div style="text-align:right;">
          <div class="stat-label">EST. TIME</div>
          <div style="font-family:'JetBrains Mono', monospace; font-size:16px;">~${quickPicksEstMin}min</div>
        </div>
      </div>
      ${quickPicks.map((p, i) => {
        const c = bpColor(p.body_part);
        let prescription;
        if (p.isTime) {
          const mm = Math.floor(p.suggDuration / 60);
          const ss = p.suggDuration % 60;
          prescription = `${mm}:${ss.toString().padStart(2,'0')} × ${p.suggSets}`;
        } else if (p.suggWeight > 0) {
          prescription = `${p.suggWeight}kg × ${p.suggReps} (${p.suggSets} sets)`;
        } else {
          prescription = `BW × ${p.suggReps} (${p.suggSets} sets)`;
        }
        const subColorPlan = p.sub_part ? (SUB_COLORS[p.body_part + "/" + p.sub_part] || c) : c;
        const subBadge = p.sub_part
          ? `<span style="background:${subColorPlan}20; color:${subColorPlan}; padding:1px 5px; border-radius:5px; font-size:8px; font-family:'JetBrains Mono', monospace;">${p.sub_part}</span>`
          : '';
        const qIdx = priorities.findIndex(e => e.name === p.name);
        return `<div>
          <div class="exercise-row" data-pri-idx="${qIdx}" style="display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px dashed var(--border); cursor:pointer; -webkit-tap-highlight-color: rgba(255,26,140,0.2);">
            <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px; width:18px;">${i+1}.</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
                <span style="background:${c}25; color:${c}; padding:1px 5px; border-radius:4px; font-size:8px; font-family:'JetBrains Mono', monospace;">${p.body_part}</span>
                ${subBadge}
                <span style="font-size:13px;">${p.name}</span>
                <span class="exercise-chevron" style="color:var(--muted); font-size:10px; transition:transform 0.2s;">▾</span>
              </div>
              <div style="font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:10px; margin-top:2px;">${prescription} · ${p.daysSince}d ago</div>
            </div>
          </div>
          <div class="exercise-details" data-for-idx="${qIdx}"></div>
        </div>`;
      }).join('')}
      <div style="margin-top:10px; padding-top:8px; border-top:1px solid var(--border); font-size:10px; color:var(--muted); text-align:center; font-family:'JetBrains Mono', monospace;">
        ↓ or pick your own from the library below
      </div>
    </div>
  ` : '';

  // Build tier-grouped exercise list (replaces old "Today's Workout — recommended")
  const tiersToShow = [5, 4, 3, 2];
  const tierListHtml = `
    <div class="card" style="background:linear-gradient(135deg, rgba(255,26,140,0.04), transparent); border-color:rgba(255,26,140,0.20); margin-bottom:12px;">
      <div style="margin-bottom:14px;">
        <div class="label-mono" style="color:var(--accent);">EXERCISE LIBRARY — pick your own</div>
        <div style="font-size:14px; font-weight:600; margin-top:4px;">Sorted by last-done within tier</div>
        <div style="font-size:11px; color:var(--muted); margin-top:2px; font-family:'JetBrains Mono', monospace;">
          <span style="color:#f43f5e;">●</span> 7+ days &nbsp; <span style="color:#fbbf24;">●</span> 4-6 days &nbsp; <span style="color:#a3e635;">●</span> 1-3 days &nbsp; <span style="color:var(--muted);">●</span> today/never
        </div>
      </div>
      ${tiersToShow.map(tier => {
        const items = tierGroups[tier] || [];
        if (items.length === 0) return '';
        const info = tierLabels[tier] || { label: '', emoji: '' };
        const stars = '⭐'.repeat(tier);
        return `<div style="margin-bottom:18px;">
          <div style="display:flex; gap:8px; align-items:center; margin:0 0 8px; padding:0 0 6px; border-bottom:1px dashed var(--border);">
            <span style="font-size:14px;">${info.emoji}</span>
            <div>
              <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text); letter-spacing:0.08em;">TIER ${6-tier} · ${stars}</div>
              <div style="font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace;">${info.label}</div>
            </div>
            <div style="margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted);">${items.length} exercises</div>
          </div>
          ${items.map(renderExerciseRow).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
  // Keep variable name for compatibility downstream: Quick Pick + Tier Library
  const todayWorkoutHtml = quickPicksHtml + tierListHtml;

  // Goal + Attention
  const sevenAgoStart = addDays(todayStart, -7);
  const week7Lifts = allLifts.filter(l => parseDateOnly(dateOnly(l.date)) >= sevenAgoStart);
  const week7Runs = allRuns.filter(r => parseDateOnly(dateOnly(r.date)) >= sevenAgoStart);
  const runsThisWeek = new Set(week7Runs.map(r => dateOnly(r.date))).size;

  // Attention items
  const attention = [];
  // Overdue priority 5 exercises
  const overdueT1 = stats.filter(s => s.priority === 5 && s.daysSince >= 4).sort((a,b) => b.daysSince - a.daysSince);
  for (const o of overdueT1.slice(0, 3)) {
    attention.push({ level: 'red', text: `${o.name} — ${o.daysSince}일 안 함 (priority 5)` });
  }
  // Body fat trend (compare latest 30d body fat readings)
  const recentBF = (DATA.body?.bodyFat || []).filter(d => parseDateOnly(d.date) >= addDays(todayStart, -30));
  if (recentBF.length >= 2) {
    const sorted = [...recentBF].sort((a,b) => a.date.localeCompare(b.date));
    const trend = sorted[sorted.length-1].value - sorted[0].value;
    if (trend > 0.5) attention.push({ level: 'orange', text: `Body fat trend +${trend.toFixed(1)}%p last 30d` });
    else if (trend < -0.5) attention.push({ level: 'green', text: `Body fat trend ${trend.toFixed(1)}%p last 30d ✓` });
  }
  // Run frequency
  if (runsThisWeek >= 3) attention.push({ level: 'green', text: `Run frequency on track (${runsThisWeek}/week)` });
  else if (runsThisWeek < 2) attention.push({ level: 'orange', text: `Cardio ${runsThisWeek}/week — increase to 3+` });

  const goalAttentionHtml = `
    <div class="grid grid-2" style="gap:12px;">
      <div class="card" style="background:linear-gradient(135deg, rgba(251,191,36,0.04), transparent); border-color:rgba(251,191,36,0.2);">
        <div class="label-mono" style="color:var(--gold,#fbbf24);">🎯 PHYSIQUE PROGRESS</div>
        <div style="margin:14px 0; font-family:'JetBrains Mono', monospace; font-size:12px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span>SMM <span style="color:var(--text);">${smm.toFixed(1)}</span> → <span style="color:var(--gold,#fbbf24);">${targetSMM} kg</span></span>
            <span style="color:var(--gold,#fbbf24);">${smmProgress.toFixed(0)}%</span>
          </div>
          <div style="background:var(--surface-2); height:6px; border-radius:3px; overflow:hidden; margin-bottom:10px;">
            <div style="height:100%; width:${smmProgress.toFixed(0)}%; background:var(--gold,#fbbf24);"></div>
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span>BF <span style="color:var(--text);">${bf.toFixed(1)}</span> → <span style="color:var(--gold,#fbbf24);">${targetBF}%</span></span>
            <span style="color:var(--gold,#fbbf24);">${bfProgress.toFixed(0)}%</span>
          </div>
          <div style="background:var(--surface-2); height:6px; border-radius:3px; overflow:hidden;">
            <div style="height:100%; width:${bfProgress.toFixed(0)}%; background:var(--gold,#fbbf24);"></div>
          </div>
          <div style="margin-top:10px; font-size:11px; color:var(--muted);">
            Latest InBody: ${latestInbody.date || '—'} · ${weight.toFixed(1)} kg
          </div>
        </div>
      </div>
      <div class="card">
        <div class="label-mono">⚠️ ATTENTION</div>
        <div style="font-size:11px; line-height:1.9; margin-top:10px;">
          ${attention.length === 0 ? '<div style="color:var(--muted);">All on track</div>' :
            attention.map(a => {
              const color = a.level === 'red' ? '#f43f5e' : a.level === 'orange' ? '#f97316' : '#84cc16';
              const icon = a.level === 'red' ? '⚠' : a.level === 'orange' ? '↗' : '✓';
              return `<div style="color:${color};">${icon} ${a.text}</div>`;
            }).join('')}
        </div>
      </div>
    </div>
  `;

  return `
    ${calendarHtml}
    ${todayWorkoutHtml}
    ${goalAttentionHtml}
  `;
}

// === View: Habit ===
function renderHabit(agg) {
  const start = agg.rangeStart, end = agg.rangeEnd;
  const days = Math.floor((end - start) / 86400000) + 1;
  const dotsHtml = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    if (d > end) break;
    const iso = isoDate(d);
    const wd = WEEKDAYS[d.getDay() === 0 ? 6 : d.getDay()-1];
    const r = agg.runByDay[iso], l = agg.liftByDay[iso];
    const hasR = r && r.count > 0, hasL = l && l.sets > 0;
    let color, primary, secondary;
    let extraStyle = "";
    if (hasR && hasL) {
      color = COLORS.lift; primary = t("runPlus");
      secondary = `${r.distance.toFixed(1)} km · ${l.sets} ${t("setsUnit")} (${num(l.volume, 0)} kg)`;
      extraStyle = "box-shadow: 0 0 0 2px var(--text);";
    } else if (hasR) {
      color = COLORS.run; primary = `${r.distance.toFixed(2)} km`;
      secondary = `${r.count} ${t("runsUnit")} · ${Math.round(r.duration)} ${t("minUnit")}`;
    } else if (hasL) {
      color = COLORS.lift; primary = `${l.sets} ${t("setsUnit")}`;
      secondary = `${num(l.volume, 0)} ${t("kgVolume")}`;
    } else {
      color = "rgba(255,255,255,0.04)"; primary = t("restDay"); secondary = "";
    }
    const payload = JSON.stringify({date: `${iso} (${wd})`, primary, secondary}).replace(/"/g, "&quot;");
    const liftAttr = hasL ? ` data-lift-date="${iso}"` : "";
    dotsHtml.push(`<div class="hdot" data-payload="${payload}"${liftAttr} style="width:14px; height:14px; border-radius:50%; background:${color}; ${extraStyle}"></div>`);
  }

  const daysDone = agg.runDays + agg.liftDays - new Set([...Object.keys(agg.runByDay).filter(d => agg.liftByDay[d])]).size;
  const cleanDaysDone = new Set([...Object.keys(agg.runByDay), ...Object.keys(agg.liftByDay)]).size;
  const consistency = ((cleanDaysDone / Math.max(days,1)) * 100).toFixed(0);

  // Last 7 days within range
  const today = new Date(); today.setHours(23,59,59,999);
  let week_done = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(today, -i);
    if (d < start) break;
    const iso = isoDate(d);
    if ((agg.runByDay[iso] && agg.runByDay[iso].count > 0) || (agg.liftByDay[iso] && agg.liftByDay[iso].sets > 0)) week_done++;
  }

  // grid columns: scale based on count
  const cols = Math.min(53, Math.max(7, Math.ceil(Math.sqrt(days * 1.5))));

  return `
    <div class="grid grid-3">
      <div class="card"><h3>현재 streak</h3><div class="stat-big" style="color:var(--accent);">${agg.currentStreak}<span style="font-size:14px; color:var(--muted)"> days</span></div><div class="stat-label">연속 운동 일수</div></div>
      <div class="card"><h3>최고 streak</h3><div class="stat-big">${agg.bestStreak}<span style="font-size:14px; color:var(--muted)"> days</span></div><div class="stat-label">기간 내 최장</div></div>
      <div class="card"><h3>지난 7일</h3><div class="stat-big">${week_done}<span style="font-size:14px; color:var(--muted)"> / 7</span></div><div class="stat-label">최근 일주일</div></div>
    </div>
    <div class="card">
      <h3>${days}일 기간 (${isoDate(start)} ~ ${isoDate(end)})</h3>
      <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.run};border-radius:50%;margin-right:4px;"></span> Running
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.lift};border-radius:50%;margin:0 4px 0 8px;"></span> Lifting
        <span style="display:inline-block;width:10px;height:10px;background:${COLORS.lift};border-radius:50%;box-shadow:0 0 0 2px var(--text);margin:0 4px 0 12px;"></span> Both
      </p>
      <div style="display:grid; grid-template-columns:repeat(${cols}, 1fr); gap:3px;">${dotsHtml.join("")}</div>
      <p style="color:var(--muted); margin-top:14px; font-size:13px;">일관성: <strong style="color:var(--accent)">${consistency}%</strong> (${cleanDaysDone}/${days} 일)</p>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3><span class="pill-run">RUNNING</span> 기간 내</h3><div class="stat-big" style="color:var(--run);">${agg.totalsRun.distance.toFixed(1)}<span style="font-size:14px; color:var(--muted)"> km</span></div><div class="stat-label">${agg.totalsRun.count} runs</div></div>
      <div class="card"><h3><span class="pill-lift">LIFTING</span> 기간 내</h3><div class="stat-big" style="color:var(--lift);">${agg.totalsLift.sessions}<span style="font-size:14px; color:var(--muted)"> 일</span></div><div class="stat-label">${num(agg.totalsLift.volume, 0)} kg volume</div></div>
    </div>`;
}

// === Main render dispatcher ===
// VO2 Max norms for 35yo male — current age (born 1990-10-19, today ~2026)
const VO2_THRESHOLDS = { low: 35, below: 43, above: 48, top10: 51 };
function vo2Percentile(v) {
  if (v < 30) return 5;
  if (v < 35) return 15;
  if (v < 38) return 25;
  if (v < 43) return 50;
  if (v < 47) return 70;
  if (v < 50) return 80;
  if (v < 53) return 90;
  return 95;
}
function vo2Tier(v) {
  if (v < VO2_THRESHOLDS.low) return "Low";
  if (v < VO2_THRESHOLDS.below) return "Below Avg";
  if (v < VO2_THRESHOLDS.above) return "Above Avg";
  return "High";
}

function vo2ChartWithBands(points, w, h) {
  if (!points.length) return `<p style="color:var(--muted)">no data</p>`;
  w = w || 800; h = h || 200;
  const padX = 40, padTop = 20, padBot = 24;
  const minV = 25, maxV = Math.max(55, ...points.map(p => p.value) , VO2_THRESHOLDS.top10 + 2);
  const minT = parseDateOnly(points[0].date).getTime();
  const maxT = parseDateOnly(points[points.length-1].date).getTime();
  const tRng = (maxT - minT) || 1;
  const xS = t => padX + (t - minT) / tRng * (w - 2*padX);
  const yS = v => h - padBot - (v - minV) / (maxV - minV) * (h - padTop - padBot);

  const bands = [];
  const bandDefs = [
    [minV, VO2_THRESHOLDS.low, "var(--vo2-low)", 0.10],
    [VO2_THRESHOLDS.low, VO2_THRESHOLDS.below, "var(--vo2-below)", 0.10],
    [VO2_THRESHOLDS.below, VO2_THRESHOLDS.above, "var(--vo2-above)", 0.13],
    [VO2_THRESHOLDS.above, maxV, "var(--vo2-high)", 0.10],
  ];
  for (const [s, e, c, op] of bandDefs) {
    const y1 = yS(e), y2 = yS(s);
    bands.push(`<rect x="${padX}" y="${y1.toFixed(1)}" width="${w-2*padX}" height="${(y2-y1).toFixed(1)}" fill="${c}" opacity="${op}"/>`);
  }
  // Threshold dotted lines + Y labels
  for (const tk of [VO2_THRESHOLDS.low, VO2_THRESHOLDS.below, VO2_THRESHOLDS.above]) {
    const y = yS(tk);
    bands.push(`<line x1="${padX}" y1="${y.toFixed(1)}" x2="${w-padX}" y2="${y.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="2,3" stroke-width="0.5" opacity="0.5"/>`);
    bands.push(`<text x="${padX-4}" y="${y.toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono, monospace">${tk}</text>`);
  }
  // Goal line at top10
  const goalY = yS(VO2_THRESHOLDS.top10);
  bands.push(`<line x1="${padX}" y1="${goalY.toFixed(1)}" x2="${w-padX}" y2="${goalY.toFixed(1)}" stroke="var(--accent)" stroke-dasharray="6,3" stroke-width="1.5" opacity="0.8"/>`);
  bands.push(`<text x="${w-padX}" y="${(goalY-4).toFixed(1)}" fill="var(--accent)" font-size="10" text-anchor="end" font-family="JetBrains Mono, monospace">GOAL · ${VO2_THRESHOLDS.top10} (top 10%)</text>`);

  // Line + dots
  const linePts = [];
  const dots = [];
  points.forEach(p => {
    const x = xS(parseDateOnly(p.date).getTime());
    const y = yS(p.value);
    linePts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    const payload = JSON.stringify({date: p.date, primary: `${p.value.toFixed(1)} mL/min·kg`, secondary: `${vo2Tier(p.value)} · ${vo2Percentile(p.value)}th pct`}).replace(/"/g, "&quot;");
    dots.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="var(--text)" class="hcell" data-payload="${payload}"></circle>`);
  });
  const linePath = `<path d="M${linePts.join("L")}" stroke="var(--text)" stroke-width="1.5" fill="none" opacity="0.9"/>`;

  // X labels
  const xLabels = `
    <text x="${padX}" y="${h-4}" fill="var(--muted)" font-size="9" text-anchor="start" font-family="JetBrains Mono, monospace">${points[0].date}</text>
    <text x="${w-padX}" y="${h-4}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono, monospace">${points[points.length-1].date}</text>`;

  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bands.join("")}${linePath}${dots.join("")}${xLabels}</svg>`;
}

function renderBody(agg) {
  const body = DATA.body || {};
  const start = agg.rangeStart, end = agg.rangeEnd;
  const inRng = arr => (arr || []).filter(d => {
    const dt = parseDateOnly(d.date);
    return dt >= start && dt <= end;
  });
  // Skeletal Muscle Mass: InBody readings only
  const smmData = (DATA.inbody || [])
    .filter(r => r.smm !== undefined && r.smm !== null)
    .map(r => ({date: r.date, value: r.smm, source: r.device || "InBody"}))
    .sort((a, b) => a.date.localeCompare(b.date));

  // Visceral fat from InBody readings only
  const visceralData = (DATA.inbody || [])
    .filter(r => r.visceralFat !== undefined && r.visceralFat !== null)
    .map(r => ({date: r.date, value: r.visceralFat, source: "InBody"}))
    .sort((a, b) => a.date.localeCompare(b.date));

  const series = {
    weight: { data: inRng(body.weight), label: t("weight"), unit: "kg", color: COLORS.run, betterDown: false },
    bodyFat: { data: inRng(body.bodyFat), label: t("bodyFatPct"), unit: "%", color: COLORS.lift, betterDown: true },
    leanMass: { data: inRng(smmData), label: t("leanMass"), unit: "kg", color: COLORS.accent, betterDown: false },
    vo2max: { data: inRng(body.vo2max), label: t("vo2max"), unit: "mL/min·kg", color: "#22d3ee", betterDown: false },
    visceral: { data: inRng(visceralData), label: t("visceralFat"), unit: "lvl", color: "#a855f7", betterDown: true },
  };

  function lineChart(points, color, fixedMin, fixedMax) {
    if (!points.length) return `<p style="color:var(--muted); padding:20px 0;">${t("noBodyData")}</p>`;
    const w = 800, h = 160, padX = 40, padTop = 16, padBot = 24;
    const minV = fixedMin !== undefined ? fixedMin : Math.min(...points.map(p => p.value));
    const maxV = fixedMax !== undefined ? fixedMax : Math.max(...points.map(p => p.value));
    const range = (maxV - minV) || 1;
    const minT = parseDateOnly(points[0].date).getTime();
    const maxT = parseDateOnly(points[points.length-1].date).getTime();
    const tRange = (maxT - minT) || 1;
    const xS = t => padX + (t - minT) / tRange * (w - 2*padX);
    const yS = v => h - padBot - (v - minV) / range * (h - padTop - padBot);

    const pathD = points.map((p, i) => {
      const x = xS(parseDateOnly(p.date).getTime());
      const y = yS(p.value);
      return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");

    const dots = points.map(p => {
      const x = xS(parseDateOnly(p.date).getTime());
      const y = yS(p.value);
      const payload = JSON.stringify({date: p.date, primary: `${p.value.toFixed(1)}`, secondary: p.source || ""}).replace(/"/g, "&quot;");
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" class="hcell" data-payload="${payload}"></circle>`;
    }).join("");

    // Y axis labels: min and max
    const yMinLabel = `<text x="0" y="${(h-padBot+4).toFixed(1)}" fill="${COLORS.muted}" font-size="9" font-family="JetBrains Mono, monospace">${minV.toFixed(1)}</text>`;
    const yMaxLabel = `<text x="0" y="${(padTop+4).toFixed(1)}" fill="${COLORS.muted}" font-size="9" font-family="JetBrains Mono, monospace">${maxV.toFixed(1)}</text>`;

    // X axis labels: first and last date
    const firstDate = `<text x="${padX}" y="${h-4}" fill="${COLORS.muted}" font-size="9" text-anchor="start">${points[0].date}</text>`;
    const lastDate = `<text x="${w-padX}" y="${h-4}" fill="${COLORS.muted}" font-size="9" text-anchor="end">${points[points.length-1].date}</text>`;

    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="${pathD}" stroke="${color}" stroke-width="1.5" fill="none" opacity="0.9"/>
      ${dots}${yMinLabel}${yMaxLabel}${firstDate}${lastDate}
    </svg>`;
  }

  function changeIndicator(points, betterDown) {
    if (points.length < 2) return "";
    const first = points[0].value;
    const last = points[points.length-1].value;
    const diff = last - first;
    if (Math.abs(diff) < 0.01) return `<span style="color:var(--muted);">±0</span>`;
    const isPositive = diff > 0;
    const isGood = betterDown ? !isPositive : isPositive;
    const color = isGood ? COLORS.accent : "#f87171";
    const sign = isPositive ? "+" : "";
    return `<span style="color:${color}; font-family:'JetBrains Mono', monospace;">${sign}${diff.toFixed(1)}</span>`;
  }

  function smallCard(s) {
    if (s.data.length === 0) {
      return `<div class="card"><h3>${s.label}</h3><div class="stat-big" style="color:var(--muted); font-size:24px;">—</div></div>`;
    }
    const latest = s.data[s.data.length - 1];
    let extraLine = "";
    if (s === series.vo2max) {
      const pct = vo2Percentile(latest.value);
      const tier = vo2Tier(latest.value);
      extraLine = `<div class="stat-label" style="color:var(--accent);">${tier} · ${pct}th pct · 35yo M</div>`;
    }
    return `<div class="card">
      <h3>${s.label}</h3>
      <div class="stat-big" style="color:${s.color}; font-size:26px;">${latest.value.toFixed(1)}<span style="font-size:13px; color:var(--muted)"> ${s.unit}</span></div>
      ${extraLine}
      <div class="stat-label">${t("latest")} ${latest.date} · ${changeIndicator(s.data, s.betterDown)} ${s.unit}</div>
    </div>`;
  }

  function chartCard(s) {
    const isVo2 = s === series.vo2max;
    let headerExtra = "";
    if (isVo2 && s.data.length > 0) {
      const latest = s.data[s.data.length - 1];
      const goalDiff = VO2_THRESHOLDS.top10 - latest.value;
      headerExtra = `<span style="color:var(--accent); font-size:11px; font-family:'JetBrains Mono', monospace;">→ ${VO2_THRESHOLDS.top10} (${goalDiff > 0 ? "+" : ""}${goalDiff.toFixed(1)})</span>`;
    } else {
      headerExtra = `<span style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${s.data.length} pts</span>`;
    }
    const chartHtml = isVo2 ? vo2ChartWithBands(s.data) : lineChart(s.data, s.color);
    return `<div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="margin:0;">${s.label}</h3>
        ${headerExtra}
      </div>
      <div style="overflow-x:auto;">${chartHtml}</div>
    </div>`;
  }

  // Hero: muscle mass card with embedded chart
  const m = series.leanMass;
  let heroHtml = "";
  if (m.data.length > 0) {
    const latest = m.data[m.data.length-1];
    const earliest = m.data[0];
    const diff = latest.value - earliest.value;
    const diffSign = diff > 0 ? "+" : "";
    const diffColor = diff > 0 ? COLORS.accent : "#f87171";
    heroHtml = `
      <div class="card" style="background: linear-gradient(135deg, var(--card) 0%, ${COLORS.lift}10 100%); border-color: ${COLORS.accent}40;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div>
            <span class="label-mono" style="color:var(--accent);">${m.label}</span>
            <div style="font-family:'JetBrains Mono', monospace; font-size:48px; font-weight:500; letter-spacing:-0.04em; color:var(--accent); line-height:1; margin-top:4px;">
              ${latest.value.toFixed(1)}<span style="font-size:18px; color:var(--muted)"> kg</span>
            </div>
            <div class="stat-label" style="margin-top:8px;">
              ${earliest.date} → ${latest.date} ·
              <span style="color:${diffColor}; font-family:'JetBrains Mono', monospace;">${diffSign}${diff.toFixed(1)} kg</span>
            </div>
          </div>
        </div>
        <div style="overflow-x:auto;">${lineChart(m.data, COLORS.accent)}</div>
      </div>`;
  } else {
    heroHtml = `<div class="card"><h3>${m.label}</h3><p style="color:var(--muted)">${t("noBodyData")}</p></div>`;
  }

  // Smaller cards for the rest
  const smallSeries = [series.bodyFat, series.weight, series.vo2max, series.visceral];
  const smallCards = smallSeries.map(smallCard).join("");
  const smallCharts = smallSeries.map(chartCard).join("");

  return `
    <h2>${t("bodyComp")}</h2>
    ${heroHtml}
    <div class="grid grid-4">${smallCards}</div>
    ${smallCharts}`;
}

function renderMap(agg) {
  const allRoutes = DATA.routes || [];
  const routes = allRoutes.filter(r => {
    const d = parseDateOnly(r.date);
    return d >= agg.rangeStart && d <= agg.rangeEnd;
  });
  let totalKm = 0;
  for (const r of DATA.runs) {
    if (inRange(r.date, agg.rangeStart, agg.rangeEnd) && r.distance) totalKm += r.distance;
  }

  const html = `
    <h2><span class="pill-run">RUNNING</span> ${t("runMap")}</h2>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
        <div>
          <div style="color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace;">${routes.length} ${t("routes")} · ${totalKm.toFixed(0)} km</div>
        </div>
      </div>
      <div id="map" class="map-canvas" style="height:560px; border-radius:8px; background:#0a0a0a;"></div>
      ${routes.length === 0 ? `<p style="color:var(--muted); margin-top:12px;">${t("noRoutes")}</p>` : ""}
    </div>`;

  setTimeout(() => {
    if (window._mapInstance) {
      try { window._mapInstance.remove(); } catch(e) {}
      window._mapInstance = null;
    }
    const mapEl = document.getElementById("map");
    if (!mapEl || routes.length === 0) return;
    const map = L.map("map", {
      zoomControl: true,
      attributionControl: false,
      worldCopyJump: true,
    }).setView([37.5, 127.0], 12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      minZoom: 2,
      subdomains: "abcd",
    }).addTo(map);
    L.control.attribution({position: "bottomright"}).addAttribution("© OSM · CARTO").addTo(map);

    const allPoints = [];
    routes.forEach(r => {
      if (!r.points || r.points.length < 2) return;
      const polyline = L.polyline(r.points, {
        color: COLORS.lift,
        weight: 2.5,
        opacity: 0.55,
        smoothFactor: 1,
      }).addTo(map);
      polyline.bindTooltip(`<b>${r.date}</b>`, {sticky: true, className: "leaflet-tip"});
      polyline.on("mouseover", () => polyline.setStyle({weight: 4, opacity: 1, color: COLORS.accent}));
      polyline.on("mouseout", () => polyline.setStyle({weight: 2.5, opacity: 0.55, color: COLORS.lift}));
      allPoints.push(...r.points);
    });
    if (allPoints.length > 0) {
      try {
        map.fitBounds(L.latLngBounds(allPoints), {padding: [20, 20]});
      } catch(e) {}
    }
    window._mapInstance = map;
  }, 100);

  return html;
}

const VIEWS = IS_V3
  ? { heatmap: renderHeatmap, plan: renderPlan, pr: renderPR, trends: renderTrends, body: renderBody, map: renderMap }
  : { heatmap: renderHeatmap, strava: renderStrava, hevy: renderHevy, body: renderBody, map: renderMap };

function bindTooltips() {
  const tip = document.getElementById("hovertip");
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;

  function buildTooltipHTML(data, hasLiftDetails) {
    let html = `<div style="font-weight:600; margin-bottom:2px;">${data.date}</div>`;
    if (data.primary) html += `<div style="color:#a3e635;">${data.primary}</div>`;
    if (data.secondary) html += `<div style="color:#7a8499; font-size:11px; margin-top:2px;">${data.secondary}</div>`;
    if (data.bodyParts && data.bodyParts.length > 0) {
      if (data.bodyParts.length >= 4) {
        html += `<div style="color:var(--muted); font-size:10px; margin-top:3px; font-family:'JetBrains Mono', monospace;">MIXED · ${data.bodyParts.length} parts</div>`;
      } else {
        const bpLine = data.bodyParts.map(b => {
          const c = BP_COLORS[b.bp] || "var(--muted)";
          const subStr = b.subs && b.subs.length > 0 ? ` (${b.subs.map(s => s.sub).join('/')})` : '';
          return `<span style="color:${c};">${b.bp}${subStr}</span>`;
        }).join('<span style="color:var(--muted);"> + </span>');
        html += `<div style="font-size:10px; margin-top:3px; font-family:'JetBrains Mono', monospace;">${bpLine}</div>`;
      }
    }
    if (isTouch && hasLiftDetails) {
      html += `<div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); font-size:10px; color:var(--accent); font-family:'JetBrains Mono', monospace;">Tap again for details &rsaquo;</div>`;
    }
    return html;
  }

  function positionTip(targetEl, clientX, clientY) {
    const rect = targetEl.getBoundingClientRect();
    let x = clientX !== undefined ? clientX + 14 : rect.left + rect.width / 2;
    let y = clientY !== undefined ? clientY - 10 : rect.bottom + 8;
    // Clamp to viewport (small margin)
    const tipW = tip.offsetWidth || 220;
    const tipH = tip.offsetHeight || 80;
    x = Math.max(8, Math.min(window.innerWidth - tipW - 8, x));
    y = Math.max(8, Math.min(window.innerHeight - tipH - 8, y));
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }

  let activeCell = null;
  function showTip(el, clientX, clientY) {
    try {
      const data = JSON.parse(el.getAttribute("data-payload"));
      tip.innerHTML = buildTooltipHTML(data, el.hasAttribute("data-lift-date"));
      tip.style.opacity = "1";
      positionTip(el, clientX, clientY);
    } catch (err) {}
  }
  function hideTip() {
    tip.style.opacity = "0";
    activeCell = null;
  }

  document.querySelectorAll("[data-payload]").forEach(el => {
    if (isTouch) {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const isLift = el.hasAttribute("data-lift-date");
        if (isLift && activeCell === el) {
          // Second tap on a lift cell → open modal
          hideTip();
          showLiftModal(el.getAttribute("data-lift-date"));
          return;
        }
        activeCell = el;
        showTip(el);
      });
    } else {
      el.addEventListener("mouseenter", (e) => showTip(el, e.clientX, e.clientY));
      el.addEventListener("mousemove", (e) => {
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 10) + "px";
      });
      el.addEventListener("mouseleave", hideTip);
    }
  });

  // Desktop lift cells: direct click opens modal (existing behavior)
  if (!isTouch) {
    document.querySelectorAll("[data-lift-date]").forEach(el => {
      el.style.cursor = "pointer";
      el.addEventListener("click", () => {
        hideTip();
        showLiftModal(el.getAttribute("data-lift-date"));
      });
    });
  } else {
    document.querySelectorAll("[data-lift-date]").forEach(el => { el.style.cursor = "pointer"; });
    // Tap outside any cell or tooltip dismisses tooltip
    document.addEventListener("click", (e) => {
      if (!e.target.closest("[data-payload]") && !e.target.closest("#hovertip")) {
        hideTip();
      }
    });
  }
}

// Find prev/next dates that have lift data (for modal swipe nav)
function findAdjacentLiftDate(date, direction) {
  const allDates = [...new Set((DATA.lifts || []).map(l => dateOnly(l.date)))].sort();
  const idx = allDates.indexOf(date);
  if (idx === -1) return null;
  const nextIdx = idx + direction;
  return (nextIdx >= 0 && nextIdx < allDates.length) ? allDates[nextIdx] : null;
}

window._currentModalDate = null;

function showLiftModal(date) {
  const dayLifts = (DATA.lifts || []).filter(l => dateOnly(l.date) === date);
  if (dayLifts.length === 0) return;
  window._currentModalDate = date;
  // Sort by Order (if present) so original Fleek paste order is preserved
  dayLifts.sort((a, b) => {
    if (a.order != null && b.order != null) return a.order - b.order;
    if (a.order != null) return -1;
    if (b.order != null) return 1;
    if (a.exercise !== b.exercise) return (a.exercise || "").localeCompare(b.exercise || "");
    return (a.set_n || 0) - (b.set_n || 0);
  });
  const byExercise = new Map();
  for (const l of dayLifts) {
    const ex = l.exercise || "(unnamed)";
    if (!byExercise.has(ex)) byExercise.set(ex, []);
    byExercise.get(ex).push(l);
  }
  let totalSets = 0, totalVolume = 0;
  for (const sets of byExercise.values()) {
    totalSets += sets.length;
    for (const s of sets) totalVolume += (s.weight || 0) * (s.reps || 0);
  }
  const dt = parseDateOnly(date);
  const wd = WEEKDAYS[dt.getDay() === 0 ? 6 : dt.getDay() - 1];
  // Body part summary
  const bpMap = new Map();
  for (const l of dayLifts) {
    const bp = bodyPart(l.exercise || "");
    const sub = subBodyPart(l.exercise || "", bp);
    if (!bpMap.has(bp)) bpMap.set(bp, {sets: 0, volume: 0, subs: new Map()});
    const e = bpMap.get(bp);
    e.sets++;
    e.volume += (l.weight || 0) * (l.reps || 0);
    if (sub) {
      if (!e.subs.has(sub)) e.subs.set(sub, {sets: 0});
      e.subs.get(sub).sets++;
    }
  }
  const bpSorted = [...bpMap.entries()].sort((a, b) => b[1].sets - a[1].sets);
  const bpCardsHtml = bpSorted.map(([bp, info]) => {
    const c = BP_COLORS[bp] || "var(--muted)";
    const subPart = info.subs.size > 0
      ? [...info.subs.entries()].sort((a, b) => b[1].sets - a[1].sets).map(([s, si]) => {
          const sc = SUB_COLORS[bp + "/" + s] || c;
          return `<span style="color:${sc};">${s} ${si.sets}</span>`;
        }).join('<span style="color:var(--muted);"> · </span>')
      : '';
    return `<div style="background:${c}1a; border:1px solid ${c}40; border-radius:8px; padding:8px 12px; min-width:120px;">
      <div style="font-family:'JetBrains Mono', monospace; font-size:10px; color:${c}; letter-spacing:0.1em;">${bp}</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--text); margin-top:2px;">${info.sets} sets</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--muted); margin-top:2px;">${num(info.volume, 0)} kg vol</div>
      ${subPart ? `<div style="font-family:'JetBrains Mono', monospace; font-size:9px; margin-top:4px;">${subPart}</div>` : ''}
    </div>`;
  }).join("");
  const prevDate = findAdjacentLiftDate(date, -1);
  const nextDate = findAdjacentLiftDate(date, +1);
  const prevBtn = prevDate ? `<button class="modal-nav-btn" onclick="showLiftModal('${prevDate}')" aria-label="Previous">‹</button>` : `<span class="modal-nav-btn disabled">‹</span>`;
  const nextBtn = nextDate ? `<button class="modal-nav-btn" onclick="showLiftModal('${nextDate}')" aria-label="Next">›</button>` : `<span class="modal-nav-btn disabled">›</span>`;
  let html = `
    <div class="modal-header">
      <div style="display:flex; align-items:center; gap:8px; flex:1;">
        ${prevBtn}
        <div style="flex:1;"><span class="pill-lift">LIFTING</span><h2>${date} (${wd})</h2></div>
        ${nextBtn}
      </div>
      <button class="modal-close" onclick="closeLiftModal()">×</button>
    </div>
    <div class="modal-stats">${byExercise.size} exercises · ${totalSets} sets · ${num(totalVolume, 0)} kg volume</div>
    ${bpCardsHtml ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 16px; padding-bottom:12px; border-bottom:1px solid var(--border);">${bpCardsHtml}</div>` : ''}`;
  for (const [ex, sets] of byExercise) {
    html += `<div class="exercise-block"><div class="exercise-name">${ex}</div><ul class="set-list">`;
    for (const s of sets) {
      const wStr = (!s.weight || s.weight === 0) ? "BW" : `${s.weight} kg`;
      html += `<li>${wStr} × ${s.reps} reps</li>`;
    }
    html += `</ul></div>`;
  }
  document.getElementById("lift-modal-content").innerHTML = html;
  document.getElementById("lift-modal").classList.add("open");
}

function closeLiftModal() {
  document.getElementById("lift-modal").classList.remove("open");
}

// === Progression Modal: per-exercise overload tracking ===
// Epley 1RM formula: weight * (1 + reps/30)
function estOneRM(weight, reps) {
  if (!weight || weight <= 0) return 0;
  return weight * (1 + (reps || 0) / 30);
}

function matchAnyJS(name, patterns) {
  if (!name) return false;
  for (const p of patterns) {
    try { if (new RegExp(p, 'i').test(name)) return true; } catch (e) {}
  }
  return false;
}

window.showProgressionByName = function(name) {
  const priorities = (DATA.exercise_priorities || {}).exercises || [];
  const ep = priorities.find(e => e.name === name);
  if (!ep) { console.warn('priority not found:', name); return; }
  showProgressionModal(ep);
};

// Reliable index-based lookup (no escaping issues)
window.showProgressionByIdx = function(idx) {
  const priorities = (DATA.exercise_priorities || {}).exercises || [];
  const ep = priorities[idx];
  if (!ep) { console.warn('priority idx out of range:', idx); return; }
  showProgressionModal(ep);
};

// === Inline accordion: build details HTML for exercise row dropdown ===
function buildExerciseDetailsHtml(ep) {
  const matches = (DATA.lifts || []).filter(l => matchAnyJS(l.exercise || '', ep.patterns || []));
  const bpC = BP_COLORS[ep.body_part] || '#FF1A8C';

  // Alignment box (always show, even with no history)
  const aestheticHtml = (ep.aesthetic_role || '')
    .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text);">$1</strong>');
  const stars = '⭐'.repeat(ep.priority || 0);
  const alignmentBox = ep.aesthetic_role ? `
    <div style="background: linear-gradient(135deg, rgba(251,191,36,0.08), transparent); border: 1px solid rgba(251,191,36,0.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
        <div class="label-mono" style="color:#fbbf24; font-size:9px;">🎯 ATHLETIC LEAN PHYSIQUE</div>
        <div style="font-size:10px; color:#fbbf24; font-family:'JetBrains Mono', monospace;">${stars} · ${ep.target_freq || 1}×/wk</div>
      </div>
      <div style="font-size:11px; color:var(--muted); line-height:1.5;">${aestheticHtml}</div>
    </div>` : '';

  if (matches.length === 0) {
    return alignmentBox + `<div style="padding:14px; text-align:center; color:var(--muted); font-size:11px;">No matching workout history yet.</div>`;
  }

  // Group by date
  const byDate = new Map();
  for (const l of matches) {
    const d = dateOnly(l.date);
    if (!byDate.has(d)) byDate.set(d, {maxW:0, maxWReps:0, vol:0, sets:0, best1RM:0});
    const e = byDate.get(d);
    const w = l.weight || 0, r = l.reps || 0;
    if (w > e.maxW) { e.maxW = w; e.maxWReps = r; }
    e.vol += w * r;
    e.sets++;
    const e1rm = estOneRM(w, r);
    if (e1rm > e.best1RM) e.best1RM = e1rm;
  }
  const sortedDates = [...byDate.keys()].sort();
  const sixMonthsAgo = addDays(new Date(), -180);
  const chartDates = sortedDates.filter(d => parseDateOnly(d) >= sixMonthsAgo);
  const finalDates = chartDates.length >= 2 ? chartDates : sortedDates;

  const weightPts = finalDates.map(d => {
    const e = byDate.get(d);
    return {
      t: parseDateOnly(d).getTime(), v: e.maxW,
      payload: JSON.stringify({date:d, primary:`${e.maxW.toFixed(1)} kg × ${e.maxWReps} reps`, secondary: ep.name})
    };
  }).filter(p => p.v > 0);
  const oneRMPts = finalDates.map(d => {
    const e = byDate.get(d);
    return {
      t: parseDateOnly(d).getTime(), v: e.best1RM,
      payload: JSON.stringify({date:d, primary:`${e.best1RM.toFixed(1)} kg (est)`, secondary: ep.name})
    };
  }).filter(p => p.v > 0);

  // 4-week vs prior 4-week delta
  const now = new Date();
  const win4w = addDays(now, -28);
  const win8w = addDays(now, -56);
  function avgInRange(pts, startD, endD) {
    const inRange = pts.filter(p => p.t >= startD.getTime() && p.t < endD.getTime());
    if (inRange.length === 0) return null;
    return inRange.reduce((s,p) => s+p.v, 0) / inRange.length;
  }
  const wRecent = avgInRange(weightPts, win4w, now);
  const wPrior  = avgInRange(weightPts, win8w, win4w);
  const oRecent = avgInRange(oneRMPts, win4w, now);
  const oPrior  = avgInRange(oneRMPts, win8w, win4w);

  function deltaBox(label, recent, prior, unit) {
    if (recent === null || prior === null || prior === 0) {
      return `<div style="background:var(--surface-2); padding:8px; border-radius:6px; flex:1; min-width:120px;">
        <div class="stat-label" style="font-size:9px;">${label}</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--muted);">—</div>
      </div>`;
    }
    const delta = recent - prior;
    const pct = (delta / prior) * 100;
    let col = 'var(--muted)', arrow = '➡';
    if (pct >= 5) { col = '#84cc16'; arrow = '📈'; }
    else if (pct >= 1) { col = '#a3e635'; arrow = '↗'; }
    else if (pct <= -5) { col = '#f43f5e'; arrow = '📉'; }
    else if (pct <= -2) { col = '#f43f5e'; arrow = '⬇'; }
    return `<div style="background:var(--surface-2); padding:8px; border-radius:6px; flex:1; min-width:120px;">
      <div class="stat-label" style="font-size:9px;">${label}</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:14px; color:${col};">
        ${arrow} ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%
      </div>
      <div style="font-size:9px; color:var(--muted); font-family:'JetBrains Mono', monospace;">
        ${recent.toFixed(1)}${unit} vs ${prior.toFixed(1)}${unit}
      </div>
    </div>`;
  }

  // Plateau + next suggestion
  const last6wPts = weightPts.filter(p => p.t >= addDays(now, -42).getTime());
  const allTimeMax = weightPts.length > 0 ? Math.max(...weightPts.map(p => p.v)) : 0;
  const recentMax = last6wPts.length > 0 ? Math.max(...last6wPts.map(p => p.v)) : 0;
  const plateau = (last6wPts.length >= 4) && (recentMax < allTimeMax * 0.98);
  const plateauNote = plateau
    ? `<div style="background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.30); padding:8px 10px; border-radius:6px; margin-top:8px; font-size:11px;">
        <span style="color:#fbbf24;">⏸ Plateau</span> — 최근 6주 top max(${recentMax.toFixed(1)}kg) < all-time max(${allTimeMax.toFixed(1)}kg). variation/deload 고려.
      </div>` : '';

  let nextSuggest = '';
  const lastEntry = weightPts.length > 0 ? weightPts[weightPts.length-1] : null;
  if (lastEntry && lastEntry.v > 0 && !plateau) {
    const lastDateIso = dateOnly(new Date(lastEntry.t).toISOString().slice(0,10));
    const lastData = byDate.get(lastDateIso);
    const lastW = lastEntry.v;
    const lastR = lastData?.maxWReps || 0;
    if (lastR >= 10) {
      const nextW = Math.round((lastW + 2.5) * 2) / 2;
      nextSuggest = `<div style="background:rgba(132,204,22,0.08); border:1px solid rgba(132,204,22,0.30); padding:8px 10px; border-radius:6px; margin-top:8px; font-size:11px;">
        <span style="color:#a3e635;">📈 Next session</span> — try <strong>${nextW}kg × ${Math.max(8, lastR-2)}</strong> (last: ${lastW}kg × ${lastR})
      </div>`;
    } else {
      nextSuggest = `<div style="background:rgba(132,204,22,0.08); border:1px solid rgba(132,204,22,0.30); padding:8px 10px; border-radius:6px; margin-top:8px; font-size:11px;">
        <span style="color:#a3e635;">📈 Next session</span> — keep <strong>${lastW}kg</strong>, aim for ${lastR + 1}+ reps (last: ${lastR})
      </div>`;
    }
  }

  // Mini sparkline (inline SVG) — proportional scaling, no distortion
  function miniSparkline(pts, color) {
    if (pts.length < 2) return '';
    const w = 800, h = 90, padL = 32, padR = 32, padT = 10, padB = 18;
    const ys = pts.map(p => p.v);
    const yMin = Math.min(...ys), yMax = Math.max(...ys), yRng = (yMax - yMin) || 1;
    const xMin = pts[0].t, xMax = pts[pts.length-1].t, xRng = (xMax - xMin) || 1;
    const sx = t => padL + (t - xMin) / xRng * (w - padL - padR);
    const sy = v => h - padB - (v - yMin) / yRng * (h - padT - padB);
    const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join(' ');
    const dots = pts.map(p => `<circle cx="${sx(p.t).toFixed(1)}" cy="${sy(p.v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
    const lastV = pts[pts.length-1].v.toFixed(1);
    const firstV = pts[0].v.toFixed(1);
    const midY = sy((yMin + yMax) / 2);
    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; max-height:90px; display:block;">
      <line x1="${padL}" y1="${(h-padB).toFixed(1)}" x2="${(w-padR).toFixed(1)}" y2="${(h-padB).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <path d="${path}" stroke="${color}" stroke-width="2" fill="none" stroke-linejoin="round"/>
      ${dots}
      <text x="${padL-4}" y="${(sy(yMax)+3).toFixed(1)}" fill="var(--muted)" font-size="10" font-family="JetBrains Mono, monospace" text-anchor="end">${yMax.toFixed(1)}</text>
      <text x="${padL-4}" y="${(sy(yMin)+3).toFixed(1)}" fill="var(--muted)" font-size="10" font-family="JetBrains Mono, monospace" text-anchor="end">${yMin.toFixed(1)}</text>
      <text x="${padL}" y="${(h-2).toFixed(0)}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">${firstV}</text>
      <text x="${(w-padR).toFixed(0)}" y="${(h-2).toFixed(0)}" fill="${color}" font-size="10" font-family="JetBrains Mono, monospace" text-anchor="end" font-weight="600">${lastV}</text>
    </svg>`;
  }

  return `${alignmentBox}
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
      ${deltaBox('TOP WEIGHT (4wk)', wRecent, wPrior, ' kg')}
      ${deltaBox('EST. 1RM (4wk)', oRecent, oPrior, ' kg')}
    </div>
    ${plateauNote}${nextSuggest}
    ${weightPts.length >= 2 ? `<div style="margin-top:10px;">
      <div class="label-mono" style="margin-bottom:2px; font-size:9px;">TOP SET WEIGHT (${weightPts.length} sessions)</div>
      ${miniSparkline(weightPts, bpC)}
    </div>` : ''}
    ${oneRMPts.length >= 2 ? `<div style="margin-top:8px;">
      <div class="label-mono" style="margin-bottom:2px; font-size:9px;">ESTIMATED 1RM (Epley)</div>
      ${miniSparkline(oneRMPts, bpC)}
    </div>` : ''}
    <div style="margin-top:8px; padding-top:6px; border-top:1px dashed var(--border); font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace;">
      All-time max: ${allTimeMax.toFixed(1)} kg · ${matches.length} sets · ${byDate.size} sessions
    </div>`;
}

// Toggle a SPECIFIC details element (the one immediately after the clicked row only)
window.toggleExerciseDetailsForRow = function(row) {
  const priorities = (DATA.exercise_priorities || {}).exercises || [];
  const idx = parseInt(row.dataset.priIdx);
  const ep = priorities[idx];
  if (!ep) return;
  const details = row.nextElementSibling;
  if (!details || !details.classList.contains('exercise-details')) return;
  const isOpen = details.classList.contains('open');
  if (isOpen) {
    details.classList.remove('open');
  } else {
    if (!details.dataset.loaded) {
      try {
        details.innerHTML = buildExerciseDetailsHtml(ep);
        details.dataset.loaded = '1';
      } catch (e) {
        console.error('details build failed:', e);
        details.innerHTML = '<div style="padding:10px; color:var(--muted);">Error loading details</div>';
      }
    }
    details.classList.add('open');
  }
  const chev = row.querySelector('.exercise-chevron');
  if (chev) chev.style.transform = details.classList.contains('open') ? 'rotate(180deg)' : '';
};

// Legacy idx-based version: opens ALL matching (still used elsewhere if needed). Now redirects to per-row variant.
window.toggleExerciseDetails = function(idx) {
  const rows = document.querySelectorAll(`.exercise-row[data-pri-idx="${idx}"]`);
  if (rows.length > 0) window.toggleExerciseDetailsForRow(rows[0]);
};

// Event delegation: toggles ONLY the details immediately after the clicked row
// (so Quick Pick and Library entries open independently even when they share the same exercise)
document.addEventListener("click", (e) => {
  const row = e.target.closest && e.target.closest(".exercise-row[data-pri-idx]");
  if (!row) return;
  window.toggleExerciseDetailsForRow(row);
});

function showProgressionModal(ep) {
  const matches = (DATA.lifts || []).filter(l => matchAnyJS(l.exercise || '', ep.patterns || []));
  if (matches.length === 0) {
    document.getElementById("progression-modal-content").innerHTML = `
      <div class="modal-header">
        <div><span class="pill-lift" style="background:${(BP_COLORS[ep.body_part]||'#FF1A8C')}30; color:${BP_COLORS[ep.body_part]||'#FF1A8C'};">${ep.body_part}</span><h2>${ep.name}</h2></div>
        <button class="modal-close" onclick="closeProgressionModal()">×</button>
      </div>
      ${ep.aesthetic_role ? `
      <div style="background: linear-gradient(135deg, rgba(251,191,36,0.08), transparent); border: 1px solid rgba(251,191,36,0.25); border-radius: 8px; padding: 12px; margin: 12px 0;">
        <div class="label-mono" style="color:#fbbf24; margin-bottom:6px;">🎯 ATHLETIC LEAN PHYSIQUE — alignment</div>
        <div style="font-size:12px; color:var(--muted); line-height:1.5;">${ep.aesthetic_role.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text);">$1</strong>')}</div>
      </div>` : ''}
      <div style="padding:30px 0; text-align:center; color:var(--muted);">No matching workout history yet.</div>`;
    document.getElementById("progression-modal").classList.add("open");
    return;
  }

  // Group by date: per-session top set (max weight) + total volume + best 1RM estimate
  const byDate = new Map();  // iso -> {maxW, maxWReps, vol, sets:[], best1RM}
  for (const l of matches) {
    const d = dateOnly(l.date);
    if (!byDate.has(d)) byDate.set(d, {maxW:0, maxWReps:0, vol:0, sets:0, best1RM:0});
    const e = byDate.get(d);
    const w = l.weight || 0;
    const r = l.reps || 0;
    if (w > e.maxW) { e.maxW = w; e.maxWReps = r; }
    e.vol += w * r;
    e.sets++;
    const e1rm = estOneRM(w, r);
    if (e1rm > e.best1RM) e.best1RM = e1rm;
  }
  const sortedDates = [...byDate.keys()].sort();

  // Limit to last 6 months for chart density
  const sixMonthsAgo = addDays(new Date(), -180);
  const chartDates = sortedDates.filter(d => parseDateOnly(d) >= sixMonthsAgo);
  const finalDates = chartDates.length >= 2 ? chartDates : sortedDates;  // fallback to all if < 2 recent

  // Chart points
  const weightPts = finalDates.map(d => {
    const e = byDate.get(d);
    return {
      t: parseDateOnly(d).getTime(), v: e.maxW,
      payload: JSON.stringify({date:d, primary:`${e.maxW.toFixed(1)} kg × ${e.maxWReps} reps`, secondary: ep.name})
    };
  }).filter(p => p.v > 0);
  const oneRMPts = finalDates.map(d => {
    const e = byDate.get(d);
    return {
      t: parseDateOnly(d).getTime(), v: e.best1RM,
      payload: JSON.stringify({date:d, primary:`${e.best1RM.toFixed(1)} kg (est)`, secondary: ep.name})
    };
  }).filter(p => p.v > 0);
  const volPts = finalDates.map(d => {
    const e = byDate.get(d);
    return {
      t: parseDateOnly(d).getTime(), v: e.vol,
      payload: JSON.stringify({date:d, primary:`${num(e.vol,0)} kg total`, secondary: ep.name})
    };
  });

  // Stats: 4-week vs prior 4-week deltas (based on top set weight + 1RM)
  const now = new Date();
  const win4w = addDays(now, -28);
  const win8w = addDays(now, -56);
  function avgInRange(pts, startD, endD) {
    const inRange = pts.filter(p => p.t >= startD.getTime() && p.t < endD.getTime());
    if (inRange.length === 0) return null;
    return inRange.reduce((s,p) => s+p.v, 0) / inRange.length;
  }
  const wRecent = avgInRange(weightPts, win4w, now);
  const wPrior  = avgInRange(weightPts, win8w, win4w);
  const oRecent = avgInRange(oneRMPts, win4w, now);
  const oPrior  = avgInRange(oneRMPts, win8w, win4w);

  function deltaBox(label, recent, prior, unit) {
    if (recent === null || prior === null || prior === 0) {
      return `<div style="background:var(--surface-2); padding:10px; border-radius:8px; flex:1; min-width:130px;">
        <div class="stat-label">${label}</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--muted);">—</div>
        <div style="font-size:10px; color:var(--muted);">insufficient data</div>
      </div>`;
    }
    const delta = recent - prior;
    const pct = (delta / prior) * 100;
    let col = 'var(--muted)', arrow = '➡️';
    if (pct >= 5) { col = '#a3e635'; arrow = '📈'; }
    else if (pct >= 1) { col = '#a3e635'; arrow = '↗'; }
    else if (pct <= -2) { col = '#f43f5e'; arrow = '📉'; }
    else if (pct <= -5) { col = '#f43f5e'; arrow = '⬇'; }
    return `<div style="background:var(--surface-2); padding:10px; border-radius:8px; flex:1; min-width:130px;">
      <div class="stat-label">${label}</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:18px; color:${col};">
        ${arrow} ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%
      </div>
      <div style="font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace;">
        ${recent.toFixed(1)}${unit} vs ${prior.toFixed(1)}${unit}
      </div>
    </div>`;
  }

  // Plateau detection: last 6 weeks all-time max didn't improve
  const last6wPts = weightPts.filter(p => p.t >= addDays(now, -42).getTime());
  const allTimeMax = weightPts.length > 0 ? Math.max(...weightPts.map(p => p.v)) : 0;
  const recentMax = last6wPts.length > 0 ? Math.max(...last6wPts.map(p => p.v)) : 0;
  const plateau = (last6wPts.length >= 4) && (recentMax < allTimeMax * 0.98);
  const plateauNote = plateau
    ? `<div style="background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.30); padding:10px; border-radius:8px; margin-top:10px; font-size:12px;">
        <span style="color:#fbbf24;">⏸ Plateau</span> — 최근 6주간 top max(${recentMax.toFixed(1)}kg)가 all-time max(${allTimeMax.toFixed(1)}kg) 도달 못 함. <span style="color:var(--muted);">Variation/deload 고려.</span>
      </div>` : '';

  // Next progression suggestion
  let nextSuggest = '';
  const lastEntry = weightPts.length > 0 ? weightPts[weightPts.length-1] : null;
  if (lastEntry && lastEntry.v > 0) {
    const lastData = byDate.get(dateOnly(new Date(lastEntry.t).toISOString().slice(0,10))) || null;
    // Suggest 2.5kg jump if reps >= 10, else stay same weight aiming for +1 rep
    const lastW = lastEntry.v;
    const lastR = lastData?.maxWReps || 0;
    if (!plateau && lastR >= 10) {
      const nextW = Math.round((lastW + 2.5) * 2) / 2;
      nextSuggest = `<div style="background:rgba(132,204,22,0.08); border:1px solid rgba(132,204,22,0.30); padding:10px; border-radius:8px; margin-top:8px; font-size:12px;">
        <span style="color:#a3e635;">📈 Next session</span> — try <strong>${nextW}kg × ${Math.max(8, lastR-2)}</strong> (last: ${lastW}kg × ${lastR})
      </div>`;
    } else if (!plateau) {
      nextSuggest = `<div style="background:rgba(132,204,22,0.08); border:1px solid rgba(132,204,22,0.30); padding:10px; border-radius:8px; margin-top:8px; font-size:12px;">
        <span style="color:#a3e635;">📈 Next session</span> — keep <strong>${lastW}kg</strong>, aim for ${lastR + 1}+ reps (last: ${lastR})
      </div>`;
    }
  }

  const bpC = BP_COLORS[ep.body_part] || '#FF1A8C';
  const subC = ep.sub_part ? (SUB_COLORS[ep.body_part + "/" + ep.sub_part] || bpC) : bpC;
  const subBadgeP = ep.sub_part
    ? `<span style="background:${subC}25; color:${subC}; padding:1px 6px; border-radius:5px; font-size:9px; font-family:'JetBrains Mono', monospace; margin-left:5px;">${ep.sub_part}</span>`
    : '';

  // Athletic Lean Physique alignment note (from priority data)
  const stars = '⭐'.repeat(ep.priority || 0);
  const aestheticRole = ep.aesthetic_role || '';
  // Strip **bold** markdown for display, then re-apply via <strong>
  const aestheticHtml = aestheticRole
    .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text);">$1</strong>')
    .replace(/"/g, '&quot;');
  const alignmentNote = aestheticRole ? `
