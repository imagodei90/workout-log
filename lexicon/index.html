<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0a0a0a">
<title>Lexicon Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --card: #111114; --card2: #18181b; --surface: #111; --surface-2: #161616;
    --border: #1f1f23; --text: #fafafa; --muted: #71717a;
    --accent: #FF1A8C; --gold: #fbbf24; --lime: #84cc16; --red: #f43f5e;
    --sky: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 20px 20px 132px; max-width: 680px; margin: 0 auto; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; }
  .nav-links { display: flex; gap: 4px; background: var(--surface-2); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
  .nav-link {
    padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--muted); text-decoration: none; border-radius: 6px; letter-spacing: 0.05em;
  }
  .nav-link.active { background: var(--surface); color: var(--text); }

  .sec { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .sec .n { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: var(--accent); white-space: nowrap; }
  .sec .line { flex: 1; height: 1px; background: var(--border); }
  .sec .r { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }

  /* 검색 · 필터 */
  .tools { display: grid; gap: 9px; margin-bottom: 14px; }
  .search {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; padding: 11px 13px;
    -webkit-appearance: none;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .chip.active { color: #0a0a0a; background: var(--c, var(--accent)); border-color: transparent; font-weight: 500; }
  .chip .ct { opacity: 0.6; margin-left: 5px; }


  /* ── ENRICH / RETIRE ──────────────────────────────────────
     상태는 행 왼쪽 2px 띠로만 말한다. 1,589행이라 배지를 붙이면 목록이 시끄럽다.
     .item 이 grid 라 ::before 가 셀을 하나 먹을 수 있는데, absolute 면 배치에서 빠진다. */
  .item { position: relative; }
  .item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent;
  }
  .item.enrich::before { background: var(--sky); }
  .item.retire::before { background: var(--lime); }
  .item.retire .term {
    color: #3f3f46; text-decoration: line-through; text-decoration-color: #3f3f46;
  }
  /* 재생 중인 행 아래로만 펼친다 */
  .draw { display: none; }
  .draw.open {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 0 14px 12px 51px; border-top: none; background: var(--card2);
  }
  .draw button {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .draw button.on { color: #0a0a0a; font-weight: 600; border-color: transparent; }
  .draw button.enrich.on { background: var(--sky); }
  .draw button.retire.on { background: var(--lime); }
  .draw .hint { font-size: 10px; color: #3f3f46; font-family: 'JetBrains Mono', monospace; }
  /* 표시한 날 — 플래그가 붙은 행에만 나온다. 폭이 좁으면 term 이 줄어 자리를 내준다. */
  .fdt { font-size: 9px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  /* 목록 */
  .list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .item {
    display: grid; grid-template-columns: 26px 1fr auto; gap: 11px; align-items: center;
    padding: 11px 14px; cursor: pointer; border-top: 1px solid var(--border);
  }
  .item:first-child { border-top: none; }
  .item:active { background: var(--card2); }
  .item.on { background: var(--card2); }
  .item.on .term { color: var(--accent); }
  .item .ix {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted);
    text-align: right; font-variant-numeric: tabular-nums;
    padding: 6px 2px; margin: -6px -2px;   /* 들음 토글 — 손가락으로 누를 여유 */
  }
  .term { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.done .term { color: var(--muted); }
  .item.done .ix { color: var(--lime); }
  .item.done .ix::before { content: '\2713'; font-size: 10px; }
  .item.done .ix span { display: none; }
  .meta { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .src { padding: 2px 6px; border-radius: 4px; font-size: 9px; letter-spacing: 0.05em; background: var(--surface-2); }
  .dur { font-variant-numeric: tabular-nums; }
  .more {
    text-align: center; padding: 13px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted); cursor: pointer; border-top: 1px solid var(--border);
  }
  .empty { padding: 34px 14px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  /* 학습 상태 */
  .prog { height: 3px; background: var(--card2); border-radius: 2px; overflow: hidden; margin: 14px 0 8px; }
  .prog > i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 2px; transition: width .3s; }
  .foot {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
  }
  .foot b { color: var(--lime); font-weight: 500; }
  .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
  .foot a:active { color: var(--text); }
  .foot .sp { flex: 1; }

  /* 하단 플레이어 */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(12,12,14,0.94); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(11px + env(safe-area-inset-bottom));
  }
  .player .inner { max-width: 680px; margin: 0 auto; }
  .player.off { display: none; }
  .pt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .pt .now { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt .tm { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .seek { width: 100%; height: 4px; background: var(--card2); border-radius: 2px; cursor: pointer; margin-bottom: 10px; }
  .seek > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ctl button {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; line-height: 1;
  }
  .ctl button.on { color: var(--accent); border-color: var(--accent); }
  .ctl .play { width: 54px; color: var(--text); background: var(--surface); font-size: 13px; padding: 10px 0; }
  .ctl .sp { margin-left: auto; }
  .ctl .rep { margin-right: auto; }

  /* ── nav — 현재 페이지 이름이 곧 메뉴 버튼 ──────────────────
     위치 표시와 이동 메뉴가 한 칸을 같이 쓴다. 페이지가 늘어도 펼친 폭은 세 칸 고정. */
  .nav-links { display: flex; gap: 4px; background: var(--surface-2, #161616);
    border: 1px solid var(--border); border-radius: 8px; padding: 2px; position: relative; }
  .nav-link { padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--muted); text-decoration: none; border-radius: 6px; letter-spacing: 0.05em;
    white-space: nowrap; }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { background: var(--surface, #111); color: var(--text); }
  .nav-menu { position: relative; }
  .nav-menu > summary { list-style: none; cursor: pointer; display: inline-flex;
    align-items: center; gap: 5px; padding: 6px 12px; font-size: 11px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; border-radius: 6px;
    background: var(--surface, #111); color: var(--text); white-space: nowrap; }
  .nav-menu > summary::-webkit-details-marker { display: none; }
  .nav-menu > summary::after { content: '▾'; font-size: 9px; opacity: 0.6; }
  .nav-pop { position: absolute; top: calc(100% + 6px); left: 0; min-width: 152px; z-index: 60;
    background: var(--surface, #111); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.55); }
  .nav-pop a { display: block; padding: 8px 10px; border-radius: 6px; color: var(--muted);
    text-decoration: none; font-size: 11px; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em; white-space: nowrap; }
  .nav-pop a:hover { background: var(--surface-2, #161616); color: var(--text); }
  .nav-pop a.active { color: var(--text); }
</style>
</head>
<body>

<nav>
  <h1>Lexicon Audio</h1>
  <div class="nav-links">
      <details class="nav-menu"><summary>LEXICON</summary>
        <div class="nav-pop">
        <a href="../">WORKOUT</a>
        <a href="../capital.html">CAPITAL</a>
        </div>
      </details>
      <a href="../routines.html" class="nav-link">ROUTINE</a>
      <a href="../input.html" class="nav-link">INPUT</a>
    </div>
</nav>

<div class="sec"><span class="n">LEXICON AUDIO</span><span class="line"></span><span class="r" id="stat">불러오는 중</span></div>

<div class="tools">
  <input class="search" id="q" type="search" placeholder="표현 검색" autocomplete="off" autocorrect="off" spellcheck="false">
  <div class="chips" id="chips"></div>
  <div class="chips" id="sorts">
    <span class="chip" data-o="unheard" style="--c:#84cc16">안 들은 것 먼저</span>
    <span class="chip" data-o="default" style="--c:#71717a">사전 순</span>
    <span class="chip" data-o="random" style="--c:#fbbf24">랜덤</span>
    <span class="chip" id="cSkip" style="--c:#FF1A8C">들은 것 건너뛰기</span>
  </div>
  <div class="chips" id="flags">
    <span class="chip" id="cEnrich" style="--c:#38bdf8">ENRICH<span class="ct" id="nEnrich">0</span></span>
    <span class="chip" id="cRetire" style="--c:#84cc16">HIDE RETIRED<span class="ct" id="nRetire">0</span></span>
  </div>
</div>

<div class="list" id="list"><div class="empty">불러오는 중...</div></div>

<div class="prog"><i id="progBar"></i></div>
<div class="foot">
  <span>들음 <b id="dn">0</b> / <span id="tt">0</span></span>
  <span class="sp"></span>
  <a id="aExport">백업</a>
  <a id="aImport">복원</a>
  <a id="aReset">초기화</a>
</div>
<input type="file" id="fImport" accept="application/json,.json" hidden>

<div class="player off" id="player">
  <div class="inner">
    <div class="pt"><span class="now" id="now">—</span><span class="tm" id="tm">0:00 / 0:00</span></div>
    <div class="seek" id="seek"><i id="bar"></i></div>
    <div class="ctl">
      <button class="rep" id="bRep" title="한 항목 반복">REPEAT</button>
      <button id="bPrev">&#9664;&#9664;</button>
      <button class="play" id="bPlay">&#9654;</button>
      <button id="bNext">&#9654;&#9654;</button>
      <button class="sp" id="bSpeed">1.0&times;</button>
    </div>
  </div>
</div>

<audio id="au" preload="none"></audio>

<script>
// Lexicon Audio — 옵시디언 사전(Colloquial · Idioms · Expressions)의 표제어별 해설 음성.
// 목록은 미리 만들어 둔 index.json 이고, 이 페이지는 재생과 진행 상태만 들고 있다.
var AUDIO_BASE = '';   // 페이지가 lexicon/ 안에 있으므로 mp3 와 index.json 은 같은 자리
// 최상위 lexicon.html 은 노트북 동기화가 '고아 파일'로 보고 지운다.
// lexicon/ 폴더는 건드리지 않으므로 페이지를 그 안에 둔다.
var LS = 'lexiconAudio';
var PAGE = 250;                // 한 번에 그리는 행 수 — 1,589개를 통째로 그리면 폰이 버벅인다

var SRC_COLOR = { Colloquial: '#FF1A8C', Idioms: '#fbbf24', Expressions: '#84cc16' };
var PLAY = '▶', PAUSE = '❚❚';

var ALL = [], view = [], shown = PAGE, cur = -1;
// done[slug] = 들은 날(epoch day). 1 로 저장하던 예전 값도 truthy 라 그대로 읽힌다.
// enrich[slug] / retire[slug] = 표시한 날(epoch day). done 과 같은 꼴로 저장한다.
var st = { src: 'ALL', q: '', speed: 1, repeat: false,
           skip: true, order: 'unheard', seed: 1, last: null, done: {},
           enrich: {}, retire: {}, onlyEnrich: false, hideRetired: true };
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
if (!st.enrich) st.enrich = {};
if (!st.retire) st.retire = {};
function save() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }
function today() { return Math.floor(Date.now() / 86400000); }

// epoch day → 표시용. 한국은 UTC+9 라 UTC 자정이 같은 날 오전 9시로 떨어진다 — 날짜가 안 밀린다.
// 옛 값이 문자열(ISO)로 들어와도 읽히게 둘 다 받는다.
function dstr(v, full) {
  if (!v) return '';
  var d = (typeof v === 'string') ? new Date(v) : new Date(v * 86400000);
  if (isNaN(d.getTime())) return '';
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return full ? d.getFullYear() + '-' + mm + '-' + dd : mm + '-' + dd;
}
// 백업에 쓸 ISO. 저장은 정수로 두고 내보낼 때만 바꾼다.
function toIso(v) {
  if (typeof v === 'string') return v;
  return new Date(v * 86400000).toISOString().slice(0, 10);
}
// 백업에서 읽을 때 정수로 되돌린다.
function toDay(v) {
  if (typeof v === 'number') return v;
  var t = Date.parse(v);
  return isNaN(t) ? today() : Math.floor(t / 86400000);
}

function $(id) { return document.getElementById(id); }
var au = $('au');

function mmss(s) {
  s = Math.max(0, Math.round(s || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function speedLabel(v) { return (v === 1 ? '1.0' : String(v)) + '×'; }

// 고정 시드 셔플 — 다시 그려도 같은 순서가 유지된다.
function shuffled(arr, seed) {
  var s = seed >>> 0;
  function rnd() {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1)), tmp = arr[i];
    arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// 목록. 정렬은 여기서만 바뀐다 — 재생 중 한 항목을 다 들었다고 목록이 튀면 곤란하다.
function applyFilter() {
  var q = (st.q || '').trim().toLowerCase();
  var base = ALL.filter(function (e) {
    if (st.onlyEnrich && !st.enrich[e.slug]) return false;
    // RETIRE 는 기본으로 숨긴다. 칩을 끄면 취소하려고 다시 보인다.
    if (st.hideRetired && st.retire[e.slug]) return false;
    return (st.src === 'ALL' || e.source === st.src) &&
           (!q || e.term.toLowerCase().indexOf(q) >= 0 || (e.slug || '').indexOf(q) >= 0);
  });
  if (st.order === 'unheard') {
    var a = [], b = [];
    base.forEach(function (e) { (st.done[e.slug] ? b : a).push(e); });
    view = a.concat(b);                       // 들은 것은 아래로 가라앉는다
  } else if (st.order === 'random') {
    view = shuffled(base.slice(), st.seed);
  } else {
    view = base;
  }
  shown = PAGE;
  render();
  updateStat();
}

function markDone(slug, on) {
  if (on === undefined) on = true;
  if (on) { st.done[slug] = today(); } else { delete st.done[slug]; }
  save();
  var row = document.querySelector('.item[data-slug="' + slug + '"]');
  if (row) row.classList.toggle('done', on);
  updateStat();
}

// 목록을 다시 그리지 않는다 — RETIRE 를 누른 순간 행이 사라지면 펼쳐 둔 액션 줄도 같이 사라진다.
// 화면에서 빠지는 건 다음번에 목록이 새로 그려질 때다.
function markFlag(slug, which) {
  var bag = st[which];
  if (bag[slug]) { delete bag[slug]; } else {
    bag[slug] = today();
    // 둘은 배타다. 안 들을 것에 내용을 더 채울 이유가 없다.
    var other = which === 'enrich' ? 'retire' : 'enrich';
    delete st[other][slug];
  }
  save();
  // 띠·취소선·날짜가 한꺼번에 바뀌므로 목록을 다시 그린다.
  // render() 는 view 를 그대로 그린다 — 거르는 건 applyFilter() 라서 행이 사라지지 않는다.
  render();
  paintFlags();
}

function paintFlags() {
  var scope = st.src === 'ALL' ? ALL : ALL.filter(function (e) { return e.source === st.src; });
  var en = 0, rt = 0;
  scope.forEach(function (e) {
    if (st.enrich[e.slug]) en++;
    if (st.retire[e.slug]) rt++;
  });
  $('nEnrich').textContent = en.toLocaleString();
  $('nRetire').textContent = rt.toLocaleString();
  $('cEnrich').classList.toggle('active', st.onlyEnrich);
  $('cRetire').classList.toggle('active', st.hideRetired);
}

$('flags').addEventListener('click', function (ev) {
  var c = ev.target.closest('.chip');
  if (!c) return;
  if (c.id === 'cEnrich') { st.onlyEnrich = !st.onlyEnrich; }
  else { st.hideRetired = !st.hideRetired; }
  save(); paintFlags(); applyFilter();
});

function updateStat() {
  var scope = st.src === 'ALL' ? ALL : ALL.filter(function (e) { return e.source === st.src; });
  var dn = scope.filter(function (e) { return st.done[e.slug]; }).length;
  $('dn').textContent = dn.toLocaleString();
  $('tt').textContent = scope.length.toLocaleString();
  $('progBar').style.width = (scope.length ? dn / scope.length * 100 : 0) + '%';
}

// 액션 줄 안내문. 표시한 날을 전체 날짜로 보여 준다 — 여기는 한 줄뿐이라 자리가 있다.
function drawHint(slug) {
  if (st.enrich[slug]) return 'ENRICH ' + dstr(st.enrich[slug], true);
  if (st.retire[slug]) return 'RETIRE ' + dstr(st.retire[slug], true) + ' \u00b7 다음 바퀴부터 빠집니다';
  return '재생 중';
}

// 플래그가 붙은 행에만 MM-DD. 색은 어느 플래그인지 말해 준다.
function flagDate(slug) {
  var v = st.enrich[slug], col = 'var(--sky)';
  if (!v) { v = st.retire[slug]; col = 'var(--lime)'; }
  if (!v) return '';
  return '<span class="fdt" style="color:' + col + '">' + dstr(v) + '</span>';
}

function render() {
  var box = $('list');
  if (!view.length) { box.innerHTML = '<div class="empty">일치하는 표현이 없습니다</div>'; return; }
  var curSlug = ALL[cur] ? ALL[cur].slug : null;
  var h = view.slice(0, shown).map(function (e, i) {
    var c = SRC_COLOR[e.source] || 'var(--muted)';
    var sl = esc(e.slug);
    var h = '<div class="item' + (st.done[e.slug] ? ' done' : '') + (e.slug === curSlug ? ' on' : '') +
      (st.enrich[e.slug] ? ' enrich' : '') + (st.retire[e.slug] ? ' retire' : '') +
      '" data-slug="' + sl + '">' +
      '<span class="ix"><span>' + (i + 1) + '</span></span>' +
      '<span class="term">' + esc(e.term) + '</span>' +
      '<span class="meta">' + flagDate(e.slug) +
      '<span class="src" style="color:' + c + '">' +
      esc(e.source.slice(0, 4).toUpperCase()) + '</span>' +
      '<span class="dur">' + mmss(e.seconds) + '</span></span></div>';
    // 액션 줄은 재생 중인 한 행에만 달린다
    if (e.slug === curSlug) {
      h += '<div class="draw open" data-slug="' + sl + '">' +
        '<button class="enrich' + (st.enrich[e.slug] ? ' on' : '') + '" data-f="enrich">ENRICH</button>' +
        '<button class="retire' + (st.retire[e.slug] ? ' on' : '') + '" data-f="retire">RETIRE</button>' +
        '<span class="hint">' + drawHint(e.slug) + '</span></div>';
    }
    return h;
  }).join('');
  if (view.length > shown) {
    h += '<div class="more" id="more">+ ' + (view.length - shown).toLocaleString() + '개 더 보기</div>';
  }
  box.innerHTML = h;
}

$('list').addEventListener('click', function (ev) {
  if (ev.target.id === 'more') { shown += PAGE; render(); return; }
  var fb = ev.target.closest('[data-f]');
  if (fb) {
    markFlag(fb.closest('.draw').dataset.slug, fb.dataset.f);
    return;
  }
  var row = ev.target.closest('.item');
  if (!row) return;
  // 번호를 누르면 들음 표시만 뒤집는다 (재생 없이 진도 정리)
  if (ev.target.closest('.ix')) {
    markDone(row.dataset.slug, !st.done[row.dataset.slug]);
    return;
  }
  for (var i = 0; i < ALL.length; i++) {
    if (ALL[i].slug === row.dataset.slug) { play(i); return; }
  }
});

// 재생
function play(i) {
  var e = ALL[i];
  if (!e) return;
  cur = i;
  st.last = e.slug; save();
  $('player').classList.remove('off');
  $('now').textContent = e.term;
  au.src = AUDIO_BASE + e.file;
  au.playbackRate = st.speed;
  au.play().catch(function () { $('bPlay').innerHTML = PLAY; });
  render();
}

// 다음/이전은 보이는 목록 기준으로 움직인다 — 필터를 걸면 그 안에서만 이어 듣는다.
// skip 이 켜져 있으면 이미 들은 항목은 건너뛴다. 전부 들었으면 그냥 다음 것을 튼다.
function step(d) {
  if (!view.length) return;
  var curSlug = ALL[cur] ? ALL[cur].slug : null;
  var vi = -1;
  for (var k = 0; k < view.length; k++) { if (view[k].slug === curSlug) { vi = k; break; } }
  var n = view.length;
  var start = vi < 0 ? (d > 0 ? -1 : 0) : vi;
  var first = null, pick = null;
  for (var s = 1; s <= n; s++) {
    var ni = (((start + d * s) % n) + n) % n;
    if (first === null) first = ni;
    if (st.retire[view[ni].slug]) continue;        // 그만 듣기로 한 것
    if (st.skip && st.done[view[ni].slug]) continue;
    pick = ni; break;
  }
  if (pick === null) pick = first;   // 전부 들었으면 건너뛰기를 포기하고 바로 다음 것으로
  if (pick === null) return;
  var nx = view[pick];
  if (pick >= shown) { shown = pick + PAGE; }
  for (var i = 0; i < ALL.length; i++) { if (ALL[i].slug === nx.slug) { play(i); return; } }
}

$('bPlay').onclick = function () {
  if (cur < 0) { step(1); return; }
  if (au.paused) { au.play().catch(function () {}); } else { au.pause(); }
};
$('bNext').onclick = function () { step(1); };
$('bPrev').onclick = function () { if (au.currentTime > 3) { au.currentTime = 0; } else { step(-1); } };
$('bRep').onclick = function () {
  st.repeat = !st.repeat; save();
  $('bRep').classList.toggle('on', st.repeat);
};
$('bSpeed').onclick = function () {
  var steps = [1, 1.25, 1.5, 0.85];
  var i = steps.indexOf(st.speed);
  st.speed = steps[(i + 1) % steps.length];
  au.playbackRate = st.speed; save();
  $('bSpeed').innerHTML = speedLabel(st.speed);
};

au.addEventListener('play', function () { $('bPlay').innerHTML = PAUSE; });
au.addEventListener('pause', function () { $('bPlay').innerHTML = PLAY; });
au.addEventListener('timeupdate', function () {
  var d = au.duration || (ALL[cur] ? ALL[cur].seconds : 0) || 0;
  $('bar').style.width = (d ? (au.currentTime / d) * 100 : 0) + '%';
  $('tm').textContent = mmss(au.currentTime) + ' / ' + mmss(d);
  // 90% 를 넘기면 들은 것으로 친다 — 끝까지 안 듣고 넘겨도 진도가 남는다.
  if (d && ALL[cur] && au.currentTime / d >= 0.9 && !st.done[ALL[cur].slug]) {
    markDone(ALL[cur].slug, true);
  }
});
au.addEventListener('ended', function () {
  if (ALL[cur] && !st.done[ALL[cur].slug]) markDone(ALL[cur].slug, true);
  if (st.repeat) { au.currentTime = 0; au.play().catch(function () {}); return; }
  step(1);   // 기본이 연속 재생 — 운전·산책 중 손대지 않아도 이어진다
});
$('seek').addEventListener('click', function (ev) {
  var r = ev.currentTarget.getBoundingClientRect();
  if (au.duration) au.currentTime = ((ev.clientX - r.left) / r.width) * au.duration;
});

// 잠금화면 · 차량 컨트롤
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
    navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
  } catch (e) {}
  au.addEventListener('play', function () {
    var e = ALL[cur];
    if (!e) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: e.term, artist: e.source, album: 'Lexicon Audio'
      });
    } catch (err) {}
  });
}

// 정렬 · 건너뛰기
function paintSorts() {
  var k = $('sorts').querySelectorAll('[data-o]');
  for (var i = 0; i < k.length; i++) k[i].classList.toggle('active', k[i].dataset.o === st.order);
  $('cSkip').classList.toggle('active', st.skip);
}
$('sorts').addEventListener('click', function (ev) {
  var c = ev.target.closest('.chip');
  if (!c) return;
  if (c.id === 'cSkip') { st.skip = !st.skip; save(); paintSorts(); return; }
  if (st.order === 'random' && c.dataset.o === 'random') st.seed = (Math.random() * 1e9) | 0;  // 다시 누르면 새로 섞는다
  st.order = c.dataset.o; save(); paintSorts(); applyFilter();
});

// 백업 파일은 사람이 열어볼 수 있어야 한다. 저장은 정수, 파일은 ISO.
function isoBag(bag) {
  var o = {};
  for (var k in bag) o[k] = toIso(bag[k]);
  return o;
}

// 학습 상태 백업 — iOS 는 7일 이상 안 쓴 사이트의 저장소를 비운다. 진도는 그때 같이 날아간다.
$('aExport').onclick = function () {
  var blob = new Blob([JSON.stringify({ app: 'lexicon', saved: new Date().toISOString(),
                                        done: st.done, enrich: isoBag(st.enrich),
                                        retire: isoBag(st.retire) }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lexicon-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
$('aImport').onclick = function () { $('fImport').click(); };
$('fImport').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var d = JSON.parse(fr.result);
      var got = d.done || {};
      var n = 0;
      for (var k in got) { if (!st.done[k]) { st.done[k] = got[k]; n++; } }   // 덮어쓰지 않고 합친다
      ['enrich', 'retire'].forEach(function (f) {
        var g = d[f] || {};
        for (var k2 in g) { if (!st[f][k2]) { st[f][k2] = toDay(g[k2]); n++; } }
      });
      save(); paintFlags(); applyFilter();
      alert(n.toLocaleString() + '개를 불러왔습니다. (총 ' + Object.keys(st.done).length.toLocaleString() + '개)');
    } catch (e) { alert('파일을 읽지 못했습니다: ' + e.message); }
  };
  fr.readAsText(f);
  ev.target.value = '';
});
$('aReset').onclick = function () {
  var n = Object.keys(st.done).length;
  if (!n) { alert('기록이 없습니다.'); return; }
  if (!confirm('들음 기록 ' + n.toLocaleString() + '개를 지웁니다.\n되돌릴 수 없습니다. 먼저 백업하시겠습니까?')) return;
  st.done = {}; st.last = null; save(); applyFilter();
};

// 시작
$('q').value = st.q || '';
$('q').addEventListener('input', function (ev) { st.q = ev.target.value; save(); applyFilter(); });
$('bRep').classList.toggle('on', st.repeat);
$('bSpeed').innerHTML = speedLabel(st.speed);
paintSorts();
paintFlags();

fetch(AUDIO_BASE + 'index.json?_=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (d) {
    ALL = d.entries || [];
    var counts = { ALL: ALL.length };
    ALL.forEach(function (e) { counts[e.source] = (counts[e.source] || 0) + 1; });
    $('chips').innerHTML = ['ALL'].concat(d.sources || []).map(function (s) {
      return '<span class="chip' + (st.src === s ? ' active' : '') + '" data-s="' + esc(s) + '"' +
        (SRC_COLOR[s] ? ' style="--c:' + SRC_COLOR[s] + '"' : '') + '>' +
        esc(s.toUpperCase()) + '<span class="ct">' + (counts[s] || 0).toLocaleString() + '</span></span>';
    }).join('');
    $('chips').addEventListener('click', function (ev) {
      var c = ev.target.closest('.chip');
      if (!c) return;
      st.src = c.dataset.s; save();
      var kids = $('chips').children;
      for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('active', kids[i] === c);
      applyFilter();
    });

    $('stat').textContent = (d.count || ALL.length).toLocaleString() + '개 · ' +
      ((d.total_seconds || 0) / 3600).toFixed(1) + '시간';

    applyFilter();

    // 이어듣기. 마지막에 듣던 것을 이미 다 들었으면 그 다음 안 들은 항목을 물려 둔다.
    // 재생은 누를 때 시작한다 — 브라우저가 자동재생을 막기도 하고, 의도치 않게 소리가 나면 곤란하다.
    var resume = null;
    if (st.last) {
      for (var i = 0; i < ALL.length; i++) { if (ALL[i].slug === st.last) { resume = i; break; } }
    }
    if (resume !== null && st.skip && st.done[ALL[resume].slug]) {
      var after = -1;
      for (var v = 0; v < view.length; v++) { if (view[v].slug === st.last) { after = v; break; } }
      for (var s = 1; s <= view.length; s++) {
        var cand = view[(after + s) % view.length];
        if (!st.done[cand.slug]) {
          for (var j = 0; j < ALL.length; j++) { if (ALL[j].slug === cand.slug) { resume = j; break; } }
          break;
        }
      }
    }
    if (resume === null && view.length) {
      for (var v2 = 0; v2 < view.length; v2++) {
        if (st.done[view[v2].slug]) continue;
        for (var j2 = 0; j2 < ALL.length; j2++) { if (ALL[j2].slug === view[v2].slug) { resume = j2; break; } }
        break;
      }
    }
    if (resume !== null) {
      cur = resume;
      $('player').classList.remove('off');
      $('now').textContent = ALL[cur].term;
      $('tm').textContent = '0:00 / ' + mmss(ALL[cur].seconds);
      au.src = AUDIO_BASE + ALL[cur].file;
      au.playbackRate = st.speed;
      render();
    }
  })
  .catch(function (e) {
    $('list').innerHTML = '<div class="empty">음성 목록을 불러오지 못했습니다 (' + esc(e.message) + ')</div>';
    $('stat').textContent = '오류';
  });
</script>

<script>
// 서버 사본이 더 새로우면 캐시 버스터를 붙여 한 번 새로고침한다 (다른 페이지와 동일).
(function () {
  function check() {
    fetch(location.pathname, { method: "HEAD", cache: "no-store" })
      .then(function (r) {
        var server = Date.parse(r.headers.get("Last-Modified") || "");
        var mine = Date.parse(document.lastModified);
        if (!server || !mine || server <= mine + 1000) return;
        var key = "reloadedFor:" + location.pathname;
        try { if (sessionStorage.getItem(key) === String(server)) return;
              sessionStorage.setItem(key, String(server)); } catch (e) {}
        var u = new URL(location.href);
        u.searchParams.set("v", String(server));
        location.replace(u.toString());
      })
      .catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") check();
  });
})();
</script>
<script>document.addEventListener('click',function(e){var d=document.querySelector('.nav-menu[open]');if(d&&!d.contains(e.target))d.removeAttribute('open');});</script>
